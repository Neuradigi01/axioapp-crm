name: quality

# Runs on PRs into the integration (dev) and production (main) branches, and on
# direct pushes to production. NOT on feature-branch pushes (the pre-commit hook
# covers fast local feedback there). Job names `python` / `frontend` double as the
# required status-check contexts in branch protection.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            API/requirements.txt
            API/requirements.dev.txt

      - name: Install dev tooling (pinned)
        run: pip install -r requirements.dev.txt

      # ---- BLOCKING ----
      - name: Ruff format (check)
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests

      # ---- report-only (promote by removing continue-on-error once the
      #      backlog is cleaned) ----
      - name: Bandit (report-only)
        continue-on-error: true
        run: bandit -c pyproject.toml -r src -q
      - name: Pyright (report-only)
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          pyright

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: APP/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      # ---- BLOCKING ----
      - name: Prettier (check)
        run: npx prettier --check "src/**/*.{ts,html,scss,css,json}"
      - name: ESLint (errors block; warnings reported, non-blocking)
        run: npx eslint .

      # ---- report-only (promote by removing continue-on-error once clean) ----
      - name: tsc --noEmit (report-only)
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: jscpd duplication (report-only)
        continue-on-error: true
        run: npx jscpd src ../API/src
