[tool.pytest.ini_options]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Code-quality tooling (Core CRM). Staged enforcement — see CLAUDE.md.
#   ruff format / ruff check  -> BLOCKING (hook + CI)
#   pyright / bandit          -> report-only (CI continue-on-error)
# Tools are pinned in requirements.dev.txt so the container and CI install
# identical versions.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100          # aligns with the frontend Prettier printWidth (100)
target-version = "py313"
# Scope is the application source + tests. Generated/throwaway code is excluded
# so it never blocks a commit and is honoured even when paths are passed
# explicitly (the pre-commit hook runs ruff with --force-exclude).
extend-exclude = [
    "alembic",        # autogenerated Alembic migrations
    "_debug_*.py",    # local debug scratch scripts (not shipped)
    "main.py",        # legacy template entrypoint (real app is src/app/main.py)
    "**/__pycache__",
]

[tool.ruff.lint]
# lint + import-sort. E/W=pycodestyle, F=pyflakes, I=isort, B=bugbear, UP=pyupgrade.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # call in arg default — the FastAPI Depends()/Query()/File() idiom
    "E711",   # `== None`  — required by SQLAlchemy filter expressions
    "E712",   # `== True`  — required by SQLAlchemy filter expressions
    "E501",   # line too long — the formatter owns wrapping; residual long
              # lines are unbreakable strings/URLs and must not block commits
    "UP042",  # (str, Enum) -> StrEnum — would change str()/f-string output of
              # string-valued status constants (silent breakage)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]      # intentional re-exports
"**/models.py" = ["F821"]        # SQLAlchemy Mapped["X"] relationship forward refs
"src/models/**" = ["F821"]       # legacy model registry — same forward-ref pattern
"src/models/__init__.py" = ["E402", "F401"]  # Base defined before model imports
"src/celery/**" = ["E402"]       # config/tasks imported for side-effect after setup

[tool.bandit]
# Keep B311 ON (weak PRNG is a real risk for OTP/token generation). Skip only the
# named-string-constant false positives ("possible hardcoded password").
skips = ["B105", "B106", "B107"]
exclude_dirs = ["tests", "alembic", ".venv", "__pycache__"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "alembic", ".venv", "_debug_*.py"]
pythonVersion = "3.13"
# Report-only for now (CI continue-on-error). Promote to "standard"/"strict" and
# drop the continue-on-error once the type backlog is cleaned.
typeCheckingMode = "basic"
