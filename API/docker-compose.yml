# Secret passthrough. A null value means "forward this variable from the
# compose process environment" — which run.cmd / run.sh populate via
# `sops exec-env` (secrets decrypted in memory, never written to disk).
# Keep this list in sync with the keys in secrets.local.enc.env and
# secrets.prod.enc.env. A key missing from the active env's secrets file
# is simply left unset in the container.
#
# Non-secret config: config.env (shared) is loaded first, then
# config.${APP_ENV}.env overrides it. APP_ENV comes from the .environment
# file, read and exported by run.cmd / run.sh.
x-secret-vars: &secret-vars
  DB_PASSWORD:
  JWT_SECRET_KEY:
  FERNET_KEY:
  REDIS_PASSWORD:
  RECAPTCHA_SECRET_KEY:
  EMAIL_PASSWORD:
  EMAIL_APP_PASSWORD:
  SMS_API_KEY:
  FIREBASE_PRIVATE_KEY:
  FIREBASE_API_KEY:
  FIREBASE_VAPID_KEY:
  FLOWER_PASS:
  INTEGRATIONS_ENCRYPTION_KEY:
  GOOGLE_OAUTH_CLIENT_SECRET:
  GOOGLE_ADS_DEVELOPER_TOKEN:
  META_APP_SECRET:
  META_WEBHOOK_VERIFY_TOKEN:
  STRIPE_SECRET_KEY:
  STRIPE_WEBHOOK_SECRET:
  WHATSAPP_APP_SECRET:
  TRACKING_HMAC_KEY:
  AUTOMATION_TRACKING_SECRET:
  MAILGUN_WEBHOOK_SIGNING_KEY:

services:
  api:
    build: .
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    depends_on:
      - redis
    restart: unless-stopped

  celery:
    build: .
    command: celery -A src.celery.worker.celery worker --loglevel=info --hostname=celery_worker@%h
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    volumes:
      - ./logs:/app/logs
    depends_on:
      - api
      - redis
    profiles:
      - celery
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A src.celery.worker.celery beat --loglevel=info
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    depends_on:
      - celery
    profiles:
      - celery
    restart: unless-stopped

  flower:
    build: .
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${FLOWER_PORT:-5555}:5555"
    command: >
      sh -c "celery -A src.celery.worker.celery flower --port=5555 --basic_auth='${FLOWER_USER:-admin}:${FLOWER_PASS:-admin}' --persistent=True --db=./flower/flower.db"
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    volumes:
      - ./flower:/app/flower
    depends_on:
      - celery
    profiles:
      - celery
    restart: unless-stopped

  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  redis_data:
