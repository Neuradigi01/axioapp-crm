# Secret passthrough. A null value means "forward this variable from the
# compose process environment" — which run.cmd / run.sh populate via
# `sops exec-env` (secrets decrypted in memory, never written to disk).
# Keep this list in sync with the keys in secrets.enc.env.
x-secret-vars: &secret-vars
  DB_PASSWORD:
  JWT_SECRET_KEY:
  FERNET_KEY:
  REDIS_PASSWORD:
  RECAPTCHA_SECRET_KEY:
  EMAIL_PASSWORD:
  EMAIL_APP_PASSWORD:
  SMS_API_KEY:
  FIREBASE_PRIVATE_KEY:
  FIREBASE_API_KEY:
  FIREBASE_VAPID_KEY:
  FLOWER_PASS:
  INTEGRATIONS_ENCRYPTION_KEY:
  PROPERTY_LINK_ENCRYPTION_KEY:
  CATALOG_LINK_ENCRYPTION_KEY:
  GOOGLE_OAUTH_CLIENT_SECRET:
  GOOGLE_ADS_DEVELOPER_TOKEN:
  META_APP_SECRET:
  META_WEBHOOK_VERIFY_TOKEN:
  WHATSAPP_APP_SECRET:
  STRIPE_SECRET_KEY:
  STRIPE_WEBHOOK_SECRET:
  AI_PROVIDER_KEY_KEK:
  # mailgun-inbound track — inbound webhook + Route API auth.
  # MAILGUN_SIGNING_KEY_PREVIOUS is empty except during a key
  # rotation window; must be forwarded so the fallback verify path
  # still activates when the operator populates it.
  MAILGUN_API_KEY:
  MAILGUN_SIGNING_KEY:
  MAILGUN_SIGNING_KEY_PREVIOUS:
  # r2-storage track — Cloudflare R2 bucket credentials. Only read when
  # STORAGE_BACKEND=r2 (set per environment in config.<env>.env).
  R2_ACCOUNT_ID:
  R2_ACCESS_KEY_ID:
  R2_SECRET_ACCESS_KEY:
  R2_BUCKET:

services:
  api:
    build: .
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
      - ./storage:/app/storage
      # Public chat widget bundle (built by ../widget with Vite). Served
      # read-only via the FastAPI /widget static mount in main.py.
      - ../widget/dist:/app/widget:ro
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    depends_on:
      - redis
    restart: unless-stopped

  celery:
    build: .
    # --concurrency=4 — remote Postgres max_connections=100 budget;
    # api pool eats 15, beat ~1, flower ~3, leaving ~80 for worker
    # tasks. Default ``--concurrency`` was the host's CPU count (12
    # on dev) which over-subscribed the DB during bursty sweeps and
    # triggered ``TooManyConnectionsError`` on 2026-06-30.
    command: celery -A src.celery.worker.celery worker --loglevel=info --concurrency=4 --hostname=celery_worker@%h
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage
    depends_on:
      - api
      - redis
    profiles:
      - celery
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A src.celery.worker.celery beat --loglevel=info
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    volumes:
      - ./storage:/app/storage
    depends_on:
      - celery
    profiles:
      - celery
    restart: unless-stopped

  flower:
    build: .
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${FLOWER_PORT:-5555}:5555"
    command: >
      sh -c "celery -A src.celery.worker.celery flower --port=5555 --basic_auth='${FLOWER_USER:-admin}:${FLOWER_PASS:-admin}' --persistent=True --db=./flower/flower.db"
    env_file:
      - config.env
      - config.${APP_ENV}.env
    environment:
      <<: *secret-vars
    volumes:
      - ./flower:/app/flower
    depends_on:
      - celery
    profiles:
      - celery
    restart: unless-stopped

  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  redis_data:
