      - contacts.write
      - activities.read
      - activities.write
      - tasks.*
      - pipelines.read
      - leads.*
      - appointments.*
      - walk_ins.*
      - catalog.read
      - conversations.read
      - conversations.write
      - calls.read
      - calls.write
      - inventory.read

  - key: junior_sales_executive
    name: Junior Sales Executive
    permissions:
      - contacts.read
      - activities.read
      - activities.write
      - tasks.read
      - tasks.write
      - pipelines.read
      - leads.read
      - leads.write
      - appointments.read
      - walk_ins.read
      - walk_ins.write
      - catalog.read
      - conversations.read
      - calls.read
      - inventory.read
      - custom_orders.read
      - custom_orders.write

  - key: design_consultant
    name: Design Consultant
    permissions:
      - contacts.read
      - contacts.write
      - activities.read
      - activities.write
      - tasks.read
      - tasks.write
      - pipelines.read
      - leads.read
      - leads.write
      - appointments.*
      - walk_ins.read
      - walk_ins.write
      - catalog.read
      - conversations.read
      - conversations.write
      - inventory.read
      - custom_orders.*

  - key: warehouse_manager
    name: Warehouse Manager
    permissions:
      - contacts.read
      - tasks.read
      - tasks.write
      - catalog.*
      - staff.read
      - attendance.write
      - inventory.*

# ---------------------------------------------------------------------------
# Lead sources — top-of-funnel attribution. The Reviews tab and the
# Campaigns tab both read this list.
# ---------------------------------------------------------------------------
lead_sources:
  - {key: whatsapp,    label: WhatsApp,    display_order: 10}
  - {key: instagram,   label: Instagram,   display_order: 20}
  - {key: facebook,    label: Facebook,    display_order: 30}
  - {key: website,     label: Website,     display_order: 40}
  - {key: walk-in,     label: Walk-in,     display_order: 50}
  - {key: reference,   label: Reference,   display_order: 60}
  - {key: marketplace, label: Marketplace, display_order: 70}

# ---------------------------------------------------------------------------
# Call outcomes — what an agent picks at the end of a call.
# ---------------------------------------------------------------------------
call_outcomes:
  - {key: appointment_booked,        label: Appointment Booked,        color: '#10b981', display_order: 10}
  - {key: quote_sent,                label: Quote Sent,                color: '#0ea5e9', display_order: 20}
  - {key: showroom_visit_scheduled,  label: Showroom Visit Scheduled,  color: '#8b5cf6', display_order: 30}
  - {key: callback_requested,        label: Callback Requested,        color: '#f59e0b', display_order: 40}
  - {key: not_interested,            label: Not Interested,            color: '#6b7280', display_order: 50}
  - {key: wrong_number,              label: Wrong Number,              color: '#ef4444', display_order: 60}

# ---------------------------------------------------------------------------
# Org-wide defaults. Applied only when the field is still at its
# migration default (or null) — the installer NEVER overwrites an
# admin's manual edit on `org_settings`.
# ---------------------------------------------------------------------------
defaults:
  currency: INR
  tax_rate: 18.00
  timezone: Asia/Kolkata
  locale: en-IN
  review_source: google
  ai_personality: |
    A helpful, warm Indian furniture sales assistant. Always
    suggests an in-store visit for sofas/dining sets, mentions GST is
    included in the displayed price, and offers WhatsApp follow-up.
    Concise replies (3-4 sentences max), uses ₹ for prices.
  ai_welcome_message: |
    Hi! Welcome to our showroom 👋  Looking for living-room, bedroom
    or dining-room furniture? Share a budget range and a photo of the
    space if you can — we'll suggest options.

# ---------------------------------------------------------------------------
# Follow-up schedule — Phase 5 reads this to drip-feed a fresh lead
# with templated WhatsApp messages on day 1, 3, 7 after creation.
# ---------------------------------------------------------------------------
follow_up_schedule:
  - day_offset: 1
    channel: whatsapp
    template: |
      Hi {{full_name}}, this is a follow-up on your enquiry yesterday.
      Would tomorrow or Saturday work for a showroom visit?
  - day_offset: 3
    channel: whatsapp
    template: |
      Hi {{full_name}}, sharing 3 options that match your budget range.
      Reply HOLD to reserve any one for 48 hours. — Team Furniture
  - day_offset: 7
    channel: whatsapp
    template: |
      Hi {{full_name}}, last gentle nudge — our Diwali offer ends Friday.
      20% off + free delivery within city. Want me to lock something for you?

# ---------------------------------------------------------------------------
# module → permission key map. Lets roles use `<module>.*` shorthand
# above to grant every key a module declares. New modules append here
# in future pack versions.
# ---------------------------------------------------------------------------
module_permissions:
  contacts:      [contacts.read, contacts.write]
  activities:    [activities.read, activities.write]
  tasks:         [tasks.read, tasks.write]
  pipelines:     [pipelines.read, pipelines.write]
  leads:         [leads.read, leads.write]
  appointments:  [appointments.read, appointments.write]
  walk_ins:      [walk_ins.read, walk_ins.write]
  catalog:       [catalog.read, catalog.write]
  staff:         [staff.read, staff.write, attendance.write]
  attendance:    [attendance.write]
  conversations: [conversations.read, conversations.write]
  calls:         [calls.read, calls.write, calls.outcomes.manage]
  reviews:       [reviews.read, reviews.write]
  campaigns:     [campaigns.read, campaigns.write, campaigns.send]
  settings:      [settings.read, settings.write]
  inventory:     [inventory.read, inventory.write, inventory.dispatch, inventory.transfer]
  custom_orders: [custom_orders.read, custom_orders.write, custom_orders.move]
