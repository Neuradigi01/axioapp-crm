# Core CRM — global (vendor-neutral) pack manifest.
#
# This is the universal default every org should start with. Unlike
# vertical packs (e.g. `furniture`), nothing in here assumes an
# industry — the Leads funnel is the textbook SaaS shape that admins
# can rename / reorder per-org without losing the contract.
#
# Run via:
#
#   python -m src.app.scripts.install_pack --org <slug> --pack base
#
# Re-running is a no-op. A later vertical pack install (e.g. furniture)
# replaces the `leads` pipeline shape with its own funnel; everything
# else here remains.

template_id: base
version: 1.0.0
display_name: Core CRM

# ---------------------------------------------------------------------------
# Pipelines — only the universal Leads board lives here. Vertical
# packs are the right home for any other board (custom_orders, jobs,
# tickets, …).
# ---------------------------------------------------------------------------
pipelines:
  - key: leads
    name: Leads
    stages:
      - {key: new,        name: New,        color: '#3b82f6', display_order: 0}
      - {key: contacted,  name: Contacted,  color: '#0ea5e9', display_order: 1}
      - {key: qualified,  name: Qualified,  color: '#8b5cf6', display_order: 2}
      - {key: proposal,   name: Proposal,   color: '#f59e0b', display_order: 3}
      - {key: won,        name: Won,        color: '#10b981', display_order: 4, is_won: true}
      - {key: lost,       name: Lost,       color: '#ef4444', display_order: 5, is_lost: true}

# ---------------------------------------------------------------------------
# Call outcomes — what an agent picks at the end of a call. Generic,
# industry-neutral set; vertical packs add their own domain outcomes.
# Admins can rename / recolour / add more per org.
# ---------------------------------------------------------------------------
call_outcomes:
  - {key: connected,    label: Connected,    color: '#10b981', display_order: 10}
  - {key: no_answer,    label: No Answer,    color: '#f59e0b', display_order: 20}
  - {key: busy,         label: Busy,         color: '#f97316', display_order: 30}
  - {key: voicemail,    label: Voicemail,    color: '#6366f1', display_order: 40}
  - {key: wrong_number, label: Wrong Number, color: '#ef4444', display_order: 50}
