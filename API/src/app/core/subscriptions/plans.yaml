# Source of truth for subscription plans, caps, features, and prices.
#
# Editing this file is the way pricing or feature placement changes ship.
# The Pydantic loader in `plans.py` validates the file at process boot;
# unknown feature keys, missing required pricing fields, or duplicate
# plan codes raise immediately and the API refuses to start.
#
# Conventions:
#   - Caps that are unlimited use the sentinel value -1.
#     Code: prefer `Cap.is_unlimited(value)` over inline `== -1` checks.
#   - Prices are display USD here for readability. The loader converts
#     to integer cents internally to avoid float drift.
#   - The set of valid `features.*` keys is declared in `plans.py` as
#     `KNOWN_FEATURE_KEYS`. Adding a new feature requires updating both
#     this file and that set.
#   - `code: trial` deliberately mirrors `code: basic`'s feature flags
#     (founder decision: the 14-day trial gives a taste of Basic, not
#     Standard). The caps differ — trial is tighter.
#
# Last reviewed: 2026-06-05.

version: 1
currency: USD
annual_discount_pct: 20

plans:
