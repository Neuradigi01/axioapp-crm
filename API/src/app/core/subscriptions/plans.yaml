# Source of truth for subscription plans, caps, features, and prices.
#
# Editing this file is the way pricing or feature placement changes ship.
# The Pydantic loader in `plans.py` validates the file at process boot;
# unknown feature keys, missing required pricing fields, or duplicate
# plan codes raise immediately and the API refuses to start.
#
# Conventions:
#   - Caps that are unlimited use the sentinel value -1.
#     Code: prefer `Cap.is_unlimited(value)` over inline `== -1` checks.
#   - Prices are declared in TWO currencies: USD (for global customers)
#     and INR (for Indian customers). Both are display units — the
#     loader converts to integer cents/paise internally to avoid float
#     drift. Currency selection happens at checkout: org.country == 'IN'
#     picks INR, everything else picks USD (user can override in the UI).
#   - The set of valid `features.*` keys is declared in `plans.py` as
#     `KNOWN_FEATURE_KEYS`. Adding a new feature requires updating both
#     this file and that set.
#   - `code: trial` deliberately mirrors `code: basic`'s feature flags
#     (founder decision: the 14-day trial gives a taste of Basic, not
#     Standard). The caps differ — trial is tighter.
#
# Last reviewed: 2026-06-05. INR prices added 2026-07-02
# (~₹83/USD; rounded to psychology-friendly INR numbers).

version: 1
supported_currencies: [INR, USD]
# INR is the canonical default (India-first business). Actual currency
# picked at checkout time by the subscriptions service:
#   org.country_code == 'IN'  → INR
#   any other country          → USD
#   country unknown / fallback → INR (this default)
# The billing UI shows a currency toggle so visitors can pick manually;
# the toggle initially displays USD for global reach, but the underlying
# checkout still honours the country-based logic.
default_currency: INR
annual_discount_pct: 20

plans:
