# Stripe price IDs per plan + billing cycle + currency.
#
# Each plan needs 4 price IDs: USD monthly + USD annual + INR monthly +
# INR annual. Create Products in Stripe Dashboard with 2 prices each
# (one USD, one INR — Stripe supports multi-currency prices per product),
# copy the price IDs here, and restart the API.
#
# NOTE: The INR price IDs below are TODO placeholders. Fill them in
# after creating INR prices in your Stripe India account.
#
# To create INR prices:
#   1. Stripe Dashboard → Products → open a product (e.g. Basic)
#   2. Add another price → Currency: INR → set the amount from
#      plans.yaml (`monthly_bundle_inr` × 100 = paise)
#   3. Copy the new `price_...` ID and paste under this plan's `INR` block
#   4. Restart the API — validation will fail if any INR field is empty
#      when Indian orgs try to check out.

