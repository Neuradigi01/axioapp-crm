# LOCAL overrides (non-secret). Adds a local Postgres 17 container so
# your machine can run entirely offline — no dependency on the remote
# prod DB. Shared infra (redis) is defined once in docker-compose.yml.
# Secrets come from secrets.local.enc.env via `sops exec-env`.
#
# The `db` service is Docker-DNS resolvable at hostname `db` from every
# service on the compose network. From your host machine (DBeaver /
# psql), connect via ${LISTEN_ADDR}:${DB_HOST_PORT} — see DB_HOST_PORT in
# config.local.env. That avoids clashing with a native Postgres install
# on 5432, and with any OTHER project's database container on this
# machine: the host port is published, so it is shared across every
# compose project you run, not scoped to this one.
#
# PROPERTY_LINK_ENCRYPTION_KEY now lives in secrets.local.enc.env like
# every other crypto key — the compose file no longer inlines it.
x-local-env: &local-env
  IS_DEVELOPMENT: "true"
  DB_NULL_POOL: "1"
  # Password for the local developer login seeded by
  # src/app/scripts/seed_dev_user.py. Null = forward from the compose
  # process environment, which run.cmd / run.sh populate via
  # `sops exec-env secrets.local.enc.env`.
  #
  # Declared HERE and not in docker-compose.yml's shared x-secret-vars
  # on purpose: a developer login must be impossible to create on a
  # deployed box. Prod never loads this overlay, and .sops.yaml does not
  # make prod servers recipients of secrets.local.enc.env, so a prod
