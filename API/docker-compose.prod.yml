services:
  api:
    env_file:
      - /etc/master.env
    environment:
      - ENV=production
      - REDIS_HOST=redis
    deploy:
      resources:
        limits:
          memory: 512M

  celery:
    environment:
      - ENV=production
      - REDIS_HOST=redis
    depends_on:
      - redis

  celery-beat:
    environment:
      - ENV=production
      - REDIS_HOST=redis
    depends_on:
      - redis

  flower:
    environment:
      - ENV=production
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-yourpassword}
