# Development overrides (non-secret). Secrets come from secrets.enc.env via
# `sops exec-env`; shared infra (redis) is defined once in docker-compose.yml.
# Env-specific non-secret values are merged in via the *dev-env anchor.
x-dev-env: &dev-env
  IS_DEVELOPMENT: "true"
  DB_NULL_POOL: "1"
  # Dev-only Fernet key for the Real Estate pack's public property
  # links. Prod deployment should read this from secrets.enc.env via
  # SOPS (declared in docker-compose.yml secret-vars). Regenerate with:
  #   docker exec crm-api-1 python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  PROPERTY_LINK_ENCRYPTION_KEY: "MlQ8eZQ-Avj_QejfxzPts2JVuQ3CU1sGiDltuoDOU6Q="

services:
  api:
    build:
      args:
        - is_development=true
    ports:
      - "5682:5678"
    volumes:
      - .:/app
    environment:
      <<: *dev-env
    command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "uvicorn", "src.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  celery:
    volumes:
      - .:/app
    environment:
      <<: *dev-env

  celery-beat:
    volumes:
      - .:/app
    environment:
      <<: *dev-env

  flower:
    volumes:
      - .:/app
    environment:
      <<: *dev-env
