<div class="reset-password">
  <mat-card class="reset-password__card">
    <mat-card-header class="reset-password__header">
      <mat-card-title class="reset-password__title">Reset Password</mat-card-title>
      <mat-card-subtitle class="reset-password__subtitle">
        {{ tokenError() ? 'Invalid or expired link' : 'Enter your new password' }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (tokenError()) {
        <div class="reset-password__error">
          <mat-icon class="reset-password__error-icon">error_outline</mat-icon>
          <p class="reset-password__error-text">
            This password reset link is invalid or has expired. Please request a new one.
          </p>
        </div>
      } @else {
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-password__form">
          <!-- New Password -->
          <mat-form-field appearance="outline" class="full-width" appPasswordToggle #pwToggle="passwordToggle">
            <mat-label>New Password</mat-label>
            <input
              matInput
              formControlName="new_password"
              [type]="pwToggle.type()"
              autocomplete="new-password" />
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="pwToggle.toggle()"
              [attr.aria-label]="pwToggle.ariaLabel()">
              <mat-icon>{{ pwToggle.icon() }}</mat-icon>
            </button>
            <mat-error><app-validation-message [control]="resetForm.controls['new_password']" label="Password" /></mat-error>
          </mat-form-field>

          <!-- Confirm Password -->
          <mat-form-field appearance="outline" class="full-width" appPasswordToggle #cpToggle="passwordToggle">
            <mat-label>Confirm Password</mat-label>
            <input
              matInput
              formControlName="confirm_password"
              [type]="cpToggle.type()"
              autocomplete="new-password" />
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="cpToggle.toggle()"
              [attr.aria-label]="cpToggle.ariaLabel()">
              <mat-icon>{{ cpToggle.icon() }}</mat-icon>
            </button>
            <mat-error><app-validation-message [control]="resetForm.controls['confirm_password']" label="Confirm password" /></mat-error>
          </mat-form-field>

          <!-- Submit -->
          <button
            mat-flat-button
            type="submit"
            class="reset-password__submit full-width"
            [disabled]="isLoading()">
            @if (isLoading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Reset Password
            }
          </button>
        </form>
      }
    </mat-card-content>

    <mat-card-actions class="reset-password__actions">
      <span class="reset-password__actions-text">
        Done resetting?
        <a mat-button [routerLink]="loginUrl" class="reset-password__link">Back to Login</a>
      </span>
    </mat-card-actions>
  </mat-card>
</div>
