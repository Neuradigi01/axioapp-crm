<div class="min-h-screen bg-gray-50 py-10 px-4 sm:px-6 lg:px-8">
  <div class="max-w-5xl mx-auto">
    <header class="mb-8 text-center">
      <h1 class="text-2xl sm:text-3xl font-semibold text-gray-900">
        Let's set up your CRM
      </h1>
      <p class="mt-2 text-gray-500">
        Name your workspace and pick a template to get started.
      </p>
    </header>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8 space-y-8"
    >
      <!-- Organization name -->
      <div>
        <label
          for="organization_name"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Organization name *
        </label>
        <input
          id="organization_name"
          type="text"
          formControlName="organization_name"
          maxlength="100"
          placeholder="e.g. Acme Furniture"
          class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"
        />
      </div>

      <!-- Template tiles -->
      <div>
        <div class="flex items-baseline justify-between mb-3">
          <label class="block text-sm font-medium text-gray-700">
            Choose your CRM template *
          </label>
          @if (selectedTile(); as t) {
            <span class="text-xs text-gray-500">
              Selected: <span class="font-medium text-gray-700">{{ t.name }}</span>
            </span>
          }
        </div>

        @if (isLoadingCatalog()) {
          <div class="text-sm text-gray-500 py-8 text-center">
            Loading templates…
          </div>
        } @else if (catalogError(); as err) {
          <div
            class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-3"
          >
            {{ err }}
          </div>
        } @else {
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            @for (tile of tiles(); track tile.pack_id) {
              <app-pack-tile
                [tile]="tile"
                [selected]="selectedPackId() === tile.pack_id"
                (select)="onTileSelect($event)"
              />
            }
          </div>
        }
      </div>

      <!-- Country / Currency / Team size -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label
            for="country"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Country
          </label>
          <input
            id="country"
            type="text"
            formControlName="country"
            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"
          />
        </div>
        <div>
          <label
            for="currency"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Currency
          </label>
          <input
            id="currency"
            type="text"
            formControlName="currency"
            maxlength="3"
            placeholder="INR"
            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none uppercase"
          />
        </div>
        <div>
          <label
            for="team_size"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Team size
          </label>
          <select
            id="team_size"
            formControlName="team_size"
            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none bg-white"
          >
            <option value="">Select…</option>
            @for (size of teamSizes; track size) {
              <option [value]="size">{{ size }}</option>
            }
          </select>
        </div>
      </div>

      <div class="flex justify-end pt-2">
        <button
          type="submit"
          [disabled]="!canSubmit() || isSubmitting()"
          class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-6 py-2.5 text-white font-medium shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (isSubmitting()) {
            <span>Setting up…</span>
          } @else {
            <span>Finish setup</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
