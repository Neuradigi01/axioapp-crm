<div class="forgot-password">
  <mat-card class="forgot-password__card">
    <mat-card-header class="forgot-password__header">
      <mat-card-title class="forgot-password__title">Forgot Password</mat-card-title>
      <mat-card-subtitle class="forgot-password__subtitle">
        Enter your User ID or Email to receive a password reset link
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (!submitted()) {
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-password__form">
          <!-- Identifier -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>User ID or Email</mat-label>
            <input matInput formControlName="identifier" autocomplete="username" />
            <mat-error><app-validation-message [control]="forgotForm.controls['identifier']" label="User ID or Email" /></mat-error>
          </mat-form-field>

          <!-- Submit -->
          <button
            mat-flat-button
            type="submit"
            class="forgot-password__submit full-width"
            [disabled]="isLoading()">
            @if (isLoading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Send Reset Link
            }
          </button>
        </form>
      } @else {
        <div class="forgot-password__success">
          <mat-icon class="forgot-password__success-icon">mark_email_read</mat-icon>
          <p class="forgot-password__success-text">
            If this account exists, you'll receive a password reset link shortly.
          </p>
        </div>
      }
    </mat-card-content>

    <mat-card-actions class="forgot-password__actions">
      <span class="forgot-password__actions-text">
        Remember your password?
        <a mat-button [routerLink]="loginUrl" class="forgot-password__link">Back to Login</a>
      </span>
    </mat-card-actions>
  </mat-card>
</div>
