<div class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/50 px-4">
  <div class="w-full max-w-xl rounded-lg bg-white p-5 shadow-xl">
    <header class="mb-4">
      <h2 class="text-lg font-semibold text-zinc-900">New campaign</h2>
      <p class="mt-1 text-xs text-zinc-500">
        Save as draft. Click <span class="font-medium">Start</span> from the list when you're ready to send.
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm">
          <span class="block text-xs font-medium text-zinc-600">Name</span>
          <input
            type="text"
            formControlName="name"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          />
        </label>
        <label class="block text-sm">
          <span class="block text-xs font-medium text-zinc-600">Channel</span>
          <select
            formControlName="channel"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          >
            @for (c of channels; track c.value) {
              <option [value]="c.value">{{ c.label }}</option>
            }
          </select>
        </label>
      </div>

      <fieldset class="rounded-md border border-zinc-200 p-3">
        <legend class="px-1 text-xs font-medium text-zinc-600">
          Audience (leave blank = everyone)
        </legend>
        <div class="grid grid-cols-3 gap-2">
          <label class="block text-sm">
            <span class="block text-[10px] text-zinc-500">Search (q)</span>
            <input
              type="text"
              formControlName="audience_q"
              placeholder="name / phone / email"
              class="mt-0.5 block w-full rounded-md border border-zinc-300 bg-white px-2 py-1 text-xs shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
            />
          </label>
          <label class="block text-sm">
            <span class="block text-[10px] text-zinc-500">Source</span>
            <input
              type="text"
              formControlName="audience_source"
              placeholder="walk-in"
              class="mt-0.5 block w-full rounded-md border border-zinc-300 bg-white px-2 py-1 text-xs shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
            />
          </label>
          <label class="block text-sm">
            <span class="block text-[10px] text-zinc-500">Tag</span>
            <input
              type="text"
              formControlName="audience_tag"
              placeholder="vip"
              class="mt-0.5 block w-full rounded-md border border-zinc-300 bg-white px-2 py-1 text-xs shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
            />
          </label>
        </div>
      </fieldset>

      <label class="block text-sm">
        <span class="block text-xs font-medium text-zinc-600">
          Template
          <span class="ml-1 text-[10px] text-zinc-400">
            Use <code>{{ varFullName }}</code> · <code>{{ varPhone }}</code> for personalisation
          </span>
        </span>
        <textarea
          rows="4"
          formControlName="template"
          [placeholder]="templatePlaceholder"
          class="mt-1 block w-full resize-none rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
        ></textarea>
      </label>

      <label class="block text-sm">
        <span class="block text-xs font-medium text-zinc-600">
          Schedule (optional — leave blank to send when you click Start)
        </span>
        <input
          type="datetime-local"
          formControlName="schedule_at"
          class="mt-1 rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
        />
      </label>

      @if (submitError(); as err) {
        <div class="rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
          {{ err }}
        </div>
      }

      <div class="flex items-center justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="close()"
          class="rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded-md bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-zinc-800 disabled:opacity-50"
        >
          {{ submitting() ? 'Saving…' : 'Save draft' }}
        </button>
      </div>
    </form>
  </div>
</div>
