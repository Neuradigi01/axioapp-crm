@if (entry(); as e) {
  <div class="mt-2 rounded-md border border-zinc-200 bg-zinc-50 px-3 py-2 text-xs">
    <p class="font-medium text-zinc-700">{{ e.label }}</p>
    <p class="mt-0.5 text-zinc-600">{{ e.description }}</p>
    <button
      type="button"
      (click)="toggleExpanded()"
      class="mt-2 inline-flex items-center gap-1 rounded text-[10px] font-medium uppercase tracking-wide text-zinc-500 hover:text-zinc-700"
    >
      @if (expanded()) {
        <lucide-icon name="chevron-down" size="10" />
        Hide sample payload
      } @else {
        <lucide-icon name="chevron-right" size="10" />
        Show sample payload
      }
    </button>
    @if (expanded()) {
      <pre
        class="mt-1 overflow-x-auto rounded bg-white px-2 py-1.5 font-mono text-[11px] leading-snug text-zinc-700 ring-1 ring-zinc-200"
        >{{ samplePayloadJson() }}</pre
      >
      <p class="mt-1 text-[10px] text-zinc-500">
        Reference any path above in conditions or templates — e.g.
        <code class="rounded bg-zinc-100 px-1 font-mono">contact.email</code>.
      </p>
    }
  </div>
}
