<div class="relative">
  <button
    type="button"
    class="flex w-full items-center justify-between rounded-lg border border-subtle bg-surface px-3 py-1.5 text-left text-sm text-default hover:bg-surface-2 disabled:cursor-not-allowed disabled:opacity-50"
    [attr.aria-expanded]="open()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <span class="truncate" [class.text-faint]="!currentValue()">
      {{ triggerLabel() }}
    </span>
    <lucide-icon name="calendar" class="ml-1 h-3.5 w-3.5 shrink-0 text-faint" />
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-30" (click)="close()" aria-hidden="true"></div>
    <div
      class="absolute top-full right-0 left-0 z-40 mt-1 rounded-lg border border-subtle bg-surface p-3 shadow-lg"
      role="dialog"
      aria-modal="false"
    >
      <!-- Month nav -->
      <div class="mb-2 flex items-center justify-between">
        <button
          type="button"
          (click)="prevMonth()"
          class="inline-flex h-7 w-7 items-center justify-center rounded-md text-muted hover:bg-surface-2 hover:text-default"
          aria-label="Previous month"
        >
          <lucide-icon name="chevron-left" class="h-4 w-4" />
        </button>
        <div class="text-sm font-semibold text-default">{{ monthLabel() }}</div>
        <button
          type="button"
          (click)="nextMonth()"
          class="inline-flex h-7 w-7 items-center justify-center rounded-md text-muted hover:bg-surface-2 hover:text-default"
          aria-label="Next month"
        >
          <lucide-icon name="chevron-right" class="h-4 w-4" />
        </button>
      </div>

      <!-- Weekday header -->
      <div class="grid grid-cols-7 gap-0.5 text-center text-[10px] font-semibold text-faint">
        @for (w of weekdayLabels; track w) {
          <div class="py-1">{{ w }}</div>
        }
      </div>

      <!-- Day grid -->
      <div class="mt-1 grid grid-cols-7 gap-0.5">
        @for (day of gridDays(); track day.getTime()) {
          <button
            type="button"
            [disabled]="isDisabled(day)"
            (click)="pickDay(day)"
            class="inline-flex h-8 w-full items-center justify-center rounded-md text-[12px] transition disabled:cursor-not-allowed disabled:opacity-30"
            [class.text-faint]="!isCurrentMonth(day) && !isSameDay(day, selectedDay())"
            [class.text-default]="isCurrentMonth(day) && !isSameDay(day, selectedDay())"
            [class.hover:bg-surface-2]="!isSameDay(day, selectedDay()) && !isDisabled(day)"
            [class.bg-accent]="isSameDay(day, selectedDay())"
            [class.text-white]="isSameDay(day, selectedDay())"
            [class.ring-1]="isSameDay(day, today) && !isSameDay(day, selectedDay())"
            [class.ring-accent]="isSameDay(day, today) && !isSameDay(day, selectedDay())"
          >
            {{ day.getDate() }}
          </button>
        }
      </div>

      <!-- Time row (hidden in date-only mode) -->
      @if (mode() !== 'date') {
        <div class="mt-3 flex items-center gap-2 border-t border-subtle pt-3">
          <lucide-icon name="clock" class="h-3.5 w-3.5 text-faint" />
          <span class="text-[11px] font-medium text-muted">Time</span>
          <div class="ml-auto inline-flex items-center gap-1">
            <input
              type="number"
              min="0"
              max="23"
              [value]="selectedHour()"
              (input)="onHourInput($event)"
              class="h-8 w-12 rounded-md border border-subtle bg-surface px-2 text-center text-sm text-default focus:border-muted focus:outline-none"
              aria-label="Hour"
            />
            <span class="text-sm text-muted">:</span>
            <input
              type="number"
              min="0"
              max="59"
              [value]="selectedMinute()"
              (input)="onMinuteInput($event)"
              class="h-8 w-12 rounded-md border border-subtle bg-surface px-2 text-center text-sm text-default focus:border-muted focus:outline-none"
              aria-label="Minute"
            />
          </div>
        </div>
      }

      <!-- Footer -->
      <div class="mt-3 flex items-center justify-between border-t border-subtle pt-2 text-xs">
        <button
          type="button"
          (click)="clear()"
          class="rounded-md px-2 py-1 font-medium text-muted hover:bg-surface-2 hover:text-default"
        >
          Clear
        </button>
        <button
          type="button"
          (click)="pickToday()"
          class="rounded-md px-2 py-1 font-medium text-accent hover:bg-surface-2"
        >
          Today
        </button>
      </div>
    </div>
  }
</div>
