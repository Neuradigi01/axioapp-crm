<div class="mx-auto max-w-6xl space-y-6 p-4 md:p-6">
  <header>
    <h1 class="text-lg font-semibold text-default">Dynamic Form — dev preview</h1>
    <p class="mt-1 text-xs text-muted">
      One field per supported <code class="font-mono">field_type</code>, rendered through
      <code class="font-mono">&lt;app-dynamic-form&gt;</code> against an in-memory definition list.
      Edit any field to see the live value &amp; validity update on the right.
    </p>
  </header>

  <div class="grid gap-6 lg:grid-cols-2">
    <section class="rounded-lg bg-surface p-6 shadow-sm ring-1 border-subtle">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-default">Form</h2>
        <button
          type="button"
          (click)="toggleLoading()"
          class="rounded-md border border-subtle bg-surface px-2.5 py-1 text-xs font-medium text-default hover:bg-surface-2"
        >
          {{ loading() ? 'Hide skeleton' : 'Show skeleton' }}
        </button>
      </div>
      <app-dynamic-form
        [fields]="fields()"
        [value]="value()"
        [loading]="loading()"
        (valueChange)="onValueChange($event)"
        (validityChange)="onValidityChange($event)"
      />
    </section>

    <section class="rounded-lg bg-surface p-6 text-default shadow-sm ring-1 ring-subtle">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="text-sm font-semibold">Live value</h2>
        <span
          class="rounded-full px-2 py-0.5 text-xs font-medium ring-1"
          [class]="
            valid()
              ? 'bg-emerald-500/20 text-emerald-200 ring-emerald-500/40'
              : 'bg-red-500/20 text-red-200 ring-red-500/40'
          "
        >
          {{ valid() ? 'valid' : 'invalid' }}
        </span>
      </div>
      <pre
        class="overflow-x-auto rounded-md bg-app p-4 text-xs leading-relaxed text-default"
      ><code>{{ valuePreview }}</code></pre>
    </section>
  </div>
</div>
