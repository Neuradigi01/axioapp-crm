<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-lg bg-white shadow-xl ring-1 ring-zinc-200">
    <header class="border-b border-zinc-200 px-5 py-3">
      <h2 class="text-sm font-semibold text-zinc-900">{{ heading() }}</h2>
    </header>
    <div class="space-y-4 px-5 py-4">
      <div>
        <label for="reassign_owner" class="block text-xs font-medium text-zinc-700">
          New owner
        </label>
        <select
          id="reassign_owner"
          [formControl]="userControl"
          class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
        >
          <option value="">Unassigned</option>
          @for (u of users(); track u.id) {
            <option [value]="u.id">{{ u.full_name }}</option>
          }
        </select>
      </div>
      <div>
        <label for="reassign_note" class="block text-xs font-medium text-zinc-700">
          Note <span class="text-zinc-400">(optional)</span>
        </label>
        <textarea
          id="reassign_note"
          [formControl]="noteControl"
          rows="2"
          maxlength="500"
          placeholder="Saved on the timeline entry."
          class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 placeholder-zinc-400 shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
        ></textarea>
      </div>
      @if (_error(); as err) {
        <div class="rounded-md bg-red-50 px-3 py-2 text-xs text-red-700 ring-1 ring-red-200">
          {{ err }}
        </div>
      }
    </div>
    <footer class="flex items-center justify-end gap-2 border-t border-zinc-200 bg-zinc-50 px-5 py-3 rounded-b-lg">
      <button
        type="button"
        class="rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50"
        [disabled]="_submitting()"
        (click)="cancel.emit()"
      >
        Cancel
      </button>
      <button
        type="button"
        [disabled]="!canConfirm()"
        (click)="onConfirm()"
        class="rounded-md bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-zinc-800 disabled:cursor-not-allowed disabled:bg-zinc-400"
      >
        Reassign
      </button>
    </footer>
  </div>
</div>
