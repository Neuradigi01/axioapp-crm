<div class="overflow-hidden rounded-lg bg-white shadow-sm ring-1 ring-zinc-200">
  <header class="flex items-center justify-between border-b border-zinc-200 px-4 py-3">
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="previousMonth()"
        class="rounded-md p-1.5 text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-700"
        aria-label="Previous month"
      >
        <lucide-icon name="chevron-left" class="h-4 w-4" />
      </button>
      <h2 class="text-sm font-semibold text-zinc-900">{{ monthLabel() }}</h2>
      <button
        type="button"
        (click)="nextMonth()"
        class="rounded-md p-1.5 text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-700"
        aria-label="Next month"
      >
        <lucide-icon name="chevron-right" class="h-4 w-4" />
      </button>
    </div>
    <button
      type="button"
      (click)="goToToday()"
      class="rounded-md border border-zinc-300 bg-white px-2.5 py-1 text-xs font-medium text-zinc-700 hover:bg-zinc-50"
    >
      Today
    </button>
  </header>

  <div class="grid grid-cols-7 border-b border-zinc-200 bg-zinc-50">
    @for (w of weekdayLabels; track w) {
      <div class="px-2 py-2 text-center text-[10px] font-semibold uppercase tracking-wider text-zinc-500">
        {{ w }}
      </div>
    }
  </div>

  <div class="grid grid-cols-7">
    @for (day of days(); track day.getTime()) {
      <button
        type="button"
        (click)="onDayClick(day)"
        class="group flex h-20 flex-col items-stretch border-b border-r border-zinc-100 px-2 py-1.5 text-left transition last:border-r-0 hover:bg-zinc-50 focus:bg-zinc-50 focus:outline-none"
        [class.bg-zinc-50]="!isInViewMonth(day)"
        [class.text-zinc-300]="!isInViewMonth(day)"
        [class.ring-2]="isSelected(day)"
        [class.ring-inset]="isSelected(day)"
        [class.ring-zinc-900]="isSelected(day)"
      >
        <span class="flex items-center justify-between">
          <span
            class="inline-flex h-6 w-6 items-center justify-center rounded-full text-xs"
            [class.bg-zinc-900]="isTodayCell(day)"
            [class.text-white]="isTodayCell(day)"
            [class.font-semibold]="isTodayCell(day)"
            [class.text-zinc-900]="!isTodayCell(day) && isInViewMonth(day)"
          >
            {{ dayNumber(day) }}
          </span>
        </span>

        @if (eventCount(day) > 0) {
          <div class="mt-auto flex items-center gap-1">
            @for (i of dotsToRender(eventCount(day)); track i) {
              <span class="h-1.5 w-1.5 rounded-full bg-zinc-900"></span>
            }
            @if (overflowCount(eventCount(day)) > 0) {
              <span class="ml-0.5 text-[10px] font-medium text-zinc-500">
                +{{ overflowCount(eventCount(day)) }}
              </span>
            }
          </div>
        }
      </button>
    }
  </div>
</div>
