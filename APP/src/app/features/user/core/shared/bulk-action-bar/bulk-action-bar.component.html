@if (visible()) {
  <div
    class="fixed bottom-4 left-1/2 z-30 -translate-x-1/2 transform"
    role="region"
    aria-label="Bulk actions"
  >
    <div
      class="flex items-center gap-2 rounded-full bg-zinc-900 px-4 py-2 text-sm text-white shadow-lg ring-1 ring-zinc-700"
    >
      <span class="font-medium"> {{ _selectedCount() }} selected </span>
      <span class="h-4 w-px bg-zinc-700"></span>
      @for (a of visibleActions(); track a.key) {
        <button
          type="button"
          (click)="action.emit(a.key)"
          [class]="
            a.danger
              ? 'inline-flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-medium hover:bg-red-600/30'
              : 'inline-flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-medium hover:bg-zinc-700'
          "
        >
          <lucide-icon [name]="a.icon" class="h-3.5 w-3.5" />
          {{ a.label }}
        </button>
      }
      <span class="h-4 w-px bg-zinc-700"></span>
      <button
        type="button"
        (click)="clear.emit()"
        class="inline-flex items-center rounded-md px-2 py-1 text-xs text-zinc-300 hover:bg-zinc-700 hover:text-white"
        aria-label="Clear selection"
      >
        <lucide-icon name="x" class="h-3.5 w-3.5" />
      </button>
    </div>
  </div>
}
