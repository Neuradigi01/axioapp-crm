<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
  style="animation: fadeIn 0.12s ease"
>
  <form
    class="w-full max-w-md overflow-hidden rounded-2xl border border-subtle bg-surface-2 shadow-elevated"
    style="animation: popIn 0.12s ease"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'prompt-title'"
    (submit)="onSubmit($event)"
  >
    <header class="border-b border-subtle px-5 py-4">
      <h2 id="prompt-title" class="font-display text-base font-semibold text-default">
        {{ title }}
      </h2>
    </header>
    <div class="space-y-3 px-5 py-4">
      @if (body) {
        <p class="text-[13.5px] text-muted">{{ body }}</p>
      }
      <input
        #input
        type="text"
        class="block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm text-default placeholder-zinc-400 focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent/30"
        [ngModel]="value()"
        (ngModelChange)="value.set($event)"
        [placeholder]="placeholder"
        [disabled]="submitting"
        name="promptValue"
        autocomplete="off"
      />
      @if (error) {
        <p
          class="rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-[13px] text-red-600 dark:text-red-400"
        >
          {{ error }}
        </p>
      }
    </div>
    <footer class="flex items-center justify-end gap-2 border-t border-subtle px-5 py-4">
      <button
        type="button"
        class="btn btn-secondary"
        [disabled]="submitting"
        (click)="cancel.emit()"
      >
        {{ cancelLabel }}
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="submitting || !value().trim()">
        {{ confirmLabel }}
      </button>
    </footer>
  </form>
</div>
