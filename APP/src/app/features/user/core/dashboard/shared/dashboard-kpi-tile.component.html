@if (loading) {
  <div
    class="relative flex h-28 flex-col justify-between rounded-xl border border-zinc-200 bg-white p-4 shadow-sm"
    aria-busy="true"
  >
    <div class="h-3 w-20 animate-pulse rounded bg-zinc-200"></div>
    <div class="h-7 w-24 animate-pulse rounded bg-zinc-200"></div>
    <div class="h-3 w-16 animate-pulse rounded bg-zinc-200"></div>
  </div>
} @else if (link) {
  <a
    [routerLink]="link"
    class="group relative flex h-28 flex-col justify-between rounded-xl border border-zinc-200 bg-white p-4 shadow-sm transition-shadow hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-900 focus-visible:ring-offset-1"
  >
    <ng-container *ngTemplateOutlet="tileBody"></ng-container>
  </a>
} @else {
  <div
    class="relative flex h-28 flex-col justify-between rounded-xl border border-zinc-200 bg-white p-4 shadow-sm"
  >
    <ng-container *ngTemplateOutlet="tileBody"></ng-container>
  </div>
}

<ng-template #tileBody>
  @if (deltaLabel()) {
    <span
      [class]="
        'absolute right-3 top-3 inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-medium ring-1 ring-inset ' +
        deltaPillClass()
      "
      >{{ deltaLabel() }}</span
    >
  }
  <div class="text-xs font-medium uppercase tracking-wide text-zinc-500">
    {{ label }}
  </div>
  <div class="text-3xl font-semibold text-zinc-900">{{ formattedValue() }}</div>
</ng-template>
