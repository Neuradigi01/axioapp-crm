@if (loading) {
  <div class="relative flex h-28 flex-col justify-between card" aria-busy="true">
    <div class="h-3 w-20 animate-pulse rounded bg-surface-2"></div>
    <div class="h-7 w-24 animate-pulse rounded bg-surface-2"></div>
    <div class="h-3 w-16 animate-pulse rounded bg-surface-2"></div>
  </div>
} @else if (link) {
  <a
    [routerLink]="link"
    class="group relative flex h-28 flex-col justify-between card transition hover:border-muted"
  >
    <ng-container *ngTemplateOutlet="tileBody"></ng-container>
  </a>
} @else {
  <div class="relative flex h-28 flex-col justify-between card">
    <ng-container *ngTemplateOutlet="tileBody"></ng-container>
  </div>
}

<ng-template #tileBody>
  @if (deltaLabel()) {
    <span
      [class]="
        'absolute right-3 top-3 inline-flex items-center rounded-full px-2 py-0.5 font-mono text-[11px] font-medium ' +
        deltaPillClass()
      "
      >{{ deltaLabel() }}</span
    >
  }
  <div class="truncate text-[12.5px] font-medium text-muted" [class.pr-14]="!!deltaLabel()">
    {{ label }}
  </div>
  <div
    class="truncate font-mono text-[20px] font-semibold leading-none tracking-[-.02em] text-default sm:text-[26px]"
    [attr.title]="formattedValue()"
  >
    {{ formattedValue() }}
  </div>
</ng-template>
