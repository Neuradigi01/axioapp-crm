<div
  class="inline-flex items-center rounded-lg border border-zinc-200 bg-white p-0.5 shadow-sm"
  role="group"
  aria-label="Dashboard date range"
>
  @for (opt of options; track opt.value) {
    <button
      type="button"
      (click)="select(opt.value)"
      [class.bg-zinc-900]="active() === opt.value"
      [class.text-white]="active() === opt.value"
      [class.text-zinc-600]="active() !== opt.value"
      [attr.aria-pressed]="active() === opt.value"
      class="rounded-md px-3 py-1.5 text-xs font-semibold transition-colors hover:text-zinc-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-900 focus-visible:ring-offset-1"
    >
      {{ opt.label }}
    </button>
  }
</div>
