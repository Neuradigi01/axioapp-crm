@if (visible().length > 0) {
  <section class="mb-4 flex flex-wrap gap-2">
    @for (a of visible(); track a.key) {
      <a
        [routerLink]="a.routerLink"
        [queryParams]="a.queryParams"
        class="inline-flex items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm font-medium text-zinc-800 shadow-sm transition hover:border-zinc-300 hover:bg-zinc-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-900 focus-visible:ring-offset-1"
      >
        <lucide-icon [name]="a.icon" class="h-4 w-4 text-zinc-500"></lucide-icon>
        {{ a.label }}
      </a>
    }
  </section>
}
