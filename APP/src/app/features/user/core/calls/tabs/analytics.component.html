<div>
  <div class="mb-4 flex flex-wrap items-end gap-3">
    <label class="block text-sm">
      <span class="block text-xs font-medium text-muted">From</span>
      <input
        type="date"
        [formControl]="fromControl"
        class="mt-1 rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
      />
    </label>
    <label class="block text-sm">
      <span class="block text-xs font-medium text-muted">To</span>
      <input
        type="date"
        [formControl]="toControl"
        class="mt-1 rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
      />
    </label>
    <button
      type="button"
      (click)="reload()"
      class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:bg-accent"
    >
      Refresh
    </button>
    <div class="ml-auto text-sm text-muted">
      Total in window:
      <span class="ml-1 font-semibold text-default">{{ totalCalls() }}</span>
    </div>
  </div>

  @if (loadError(); as err) {
    <div class="mb-3 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
      {{ err }}
    </div>
  }

  @if (loading()) {
    <div class="rounded-lg border border-subtle bg-surface p-6 text-center text-sm text-muted">
      Loading…
    </div>
  } @else if (!data() || totalCalls() === 0) {
    <div
      class="rounded-lg border border-dashed border-subtle bg-surface p-12 text-center text-sm text-muted"
    >
      No calls in this window yet. Log a call or widen the date range.
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <div class="rounded-lg border border-subtle bg-surface p-4 shadow-sm">
        <h3 class="mb-2 text-sm font-semibold text-default">Outcomes</h3>
        <div class="relative h-64">
          <canvas
            baseChart
            [type]="'doughnut'"
            [data]="outcomesChart()"
            [options]="doughnutOptions"
          ></canvas>
        </div>
      </div>
      <div class="rounded-lg border border-subtle bg-surface p-4 shadow-sm">
        <h3 class="mb-2 text-sm font-semibold text-default">Direction split</h3>
        <div class="relative h-64">
          <canvas
            baseChart
            [type]="'doughnut'"
            [data]="directionChart()"
            [options]="doughnutOptions"
          ></canvas>
        </div>
      </div>
      <div class="rounded-lg border border-subtle bg-surface p-4 shadow-sm lg:col-span-2">
        <h3 class="mb-2 text-sm font-semibold text-default">Daily volume</h3>
        <div class="relative h-64">
          <canvas baseChart [type]="'bar'" [data]="dailyChart()" [options]="barOptions"></canvas>
        </div>
      </div>
    </div>
  }
</div>
