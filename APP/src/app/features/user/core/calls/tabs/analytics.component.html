<div>
  <div class="mb-4 flex flex-wrap items-end gap-3">
    <label class="block text-sm">
      <span class="block text-xs font-medium text-zinc-600">From</span>
      <input
        type="date"
        [formControl]="fromControl"
        class="mt-1 rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
      />
    </label>
    <label class="block text-sm">
      <span class="block text-xs font-medium text-zinc-600">To</span>
      <input
        type="date"
        [formControl]="toControl"
        class="mt-1 rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
      />
    </label>
    <button
      type="button"
      (click)="reload()"
      class="rounded-md bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-zinc-800"
    >
      Refresh
    </button>
    <div class="ml-auto text-sm text-zinc-500">
      Total in window:
      <span class="ml-1 font-semibold text-zinc-900">{{ totalCalls() }}</span>
    </div>
  </div>

  @if (loadError(); as err) {
    <div class="mb-3 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
      {{ err }}
    </div>
  }

  @if (loading()) {
    <div class="rounded-lg border border-zinc-200 bg-white p-6 text-center text-sm text-zinc-500">
      Loading…
    </div>
  } @else if (!data() || totalCalls() === 0) {
    <div class="rounded-lg border border-dashed border-zinc-300 bg-white p-12 text-center text-sm text-zinc-500">
      No calls in this window yet. Log a call or widen the date range.
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <div class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm">
        <h3 class="mb-2 text-sm font-semibold text-zinc-900">Outcomes</h3>
        <div class="relative h-64">
          <canvas
            baseChart
            [type]="'doughnut'"
            [data]="outcomesChart()"
            [options]="doughnutOptions"
          ></canvas>
        </div>
      </div>
      <div class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm">
        <h3 class="mb-2 text-sm font-semibold text-zinc-900">Direction split</h3>
        <div class="relative h-64">
          <canvas
            baseChart
            [type]="'doughnut'"
            [data]="directionChart()"
            [options]="doughnutOptions"
          ></canvas>
        </div>
      </div>
      <div class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm lg:col-span-2">
        <h3 class="mb-2 text-sm font-semibold text-zinc-900">Daily volume</h3>
        <div class="relative h-64">
          <canvas
            baseChart
            [type]="'bar'"
            [data]="dailyChart()"
            [options]="barOptions"
          ></canvas>
        </div>
      </div>
    </div>
  }
</div>
