<div
  class="flex flex-col items-center justify-center gap-3 rounded-lg border border-dashed border-zinc-300 bg-white p-12 text-center"
>
  <h2 class="text-lg font-semibold text-zinc-900">Book an appointment</h2>
  <p class="max-w-md text-sm text-zinc-500">
    Open the booking form to schedule a follow-up with the customer. The Appointments page lists
    everything that's already on the calendar.
  </p>
  @if (lastCreatedTitle(); as title) {
    <div
      class="rounded-md border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs text-emerald-700"
    >
      Booked "{{ title }}". You can book another, or visit the Appointments page.
    </div>
  }
  <button
    type="button"
    (click)="open()"
    class="mt-2 rounded-md bg-zinc-900 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-800"
  >
    New appointment
  </button>
</div>

@if (modalOpen()) {
  <app-book-appointment-modal (created)="onCreated($event)" (cancel)="onCancel()" />
}
