<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
  (click)="onCancel()"
>
  <div
    class="w-full max-w-md rounded-lg bg-white shadow-xl ring-1 ring-zinc-200"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <header class="flex items-start justify-between gap-3 border-b border-zinc-200 px-5 py-4">
      <div class="min-w-0">
        <h2 class="text-base font-semibold text-zinc-900">Call {{ contactName }}</h2>
        <p class="mt-0.5 font-mono text-xs text-zinc-500">{{ phone }}</p>
      </div>
      <button
        type="button"
        (click)="onCancel()"
        class="rounded-md p-1 text-zinc-400 hover:bg-zinc-100 hover:text-zinc-600"
        aria-label="Close"
      >
        <lucide-icon name="x" size="16" aria-hidden="true"></lucide-icon>
      </button>
    </header>

    <!-- Options -->
    <div class="space-y-2 p-4">
      <button
        type="button"
        (click)="onWhatsApp()"
        class="group flex w-full items-center gap-3 rounded-lg border border-zinc-200 bg-white px-3 py-3 text-left transition hover:border-emerald-300 hover:bg-emerald-50"
      >
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-700"
        >
          <lucide-icon name="message-circle" size="18" aria-hidden="true"></lucide-icon>
        </span>
        <span class="flex-1">
          <span class="block text-sm font-medium text-zinc-900">WhatsApp Call</span>
          <span class="mt-0.5 block text-xs text-zinc-500">
            Opens WhatsApp — tap the phone icon to place a free voice call
          </span>
        </span>
        <span
          class="shrink-0 rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-semibold text-emerald-700 ring-1 ring-emerald-200"
        >
          Free
        </span>
      </button>

      <button
        type="button"
        (click)="onTel()"
        class="group flex w-full items-center gap-3 rounded-lg border border-zinc-200 bg-white px-3 py-3 text-left transition hover:border-sky-300 hover:bg-sky-50"
      >
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-sky-100 text-sky-700"
        >
          <lucide-icon name="phone" size="18" aria-hidden="true"></lucide-icon>
        </span>
        <span class="flex-1">
          <span class="block text-sm font-medium text-zinc-900">Phone Link / Dial</span>
          <span class="mt-0.5 block text-xs text-zinc-500">
            Dial via your paired phone, Phone Link, or default dialer
          </span>
        </span>
        <span
          class="shrink-0 rounded-full bg-sky-50 px-2 py-0.5 text-[10px] font-semibold text-sky-700 ring-1 ring-sky-200"
        >
          Free
        </span>
      </button>

      <button
        type="button"
        (click)="onCopy()"
        [disabled]="copied()"
        class="group flex w-full items-center gap-3 rounded-lg border border-zinc-200 bg-white px-3 py-3 text-left transition hover:border-zinc-300 hover:bg-zinc-50 disabled:cursor-default disabled:opacity-70"
      >
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-zinc-100 text-zinc-700"
        >
          <lucide-icon
            [name]="copied() ? 'check' : 'copy'"
            size="18"
            aria-hidden="true"
          ></lucide-icon>
        </span>
        <span class="flex-1">
          <span class="block text-sm font-medium text-zinc-900">
            {{ copied() ? 'Copied ✓' : 'Copy Number' }}
          </span>
          <span class="mt-0.5 block text-xs text-zinc-500">
            Paste into any dialer, desk phone app, or SMS
          </span>
        </span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="flex items-center justify-between border-t border-zinc-200 bg-zinc-50 px-5 py-3">
      <p class="text-[11px] text-zinc-500">
        After the call, you'll log the outcome in the next step.
      </p>
      <button
        type="button"
        (click)="onCancel()"
        class="rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-xs font-medium text-zinc-700 hover:bg-zinc-50"
      >
        Cancel
      </button>
    </footer>
  </div>
</div>
