<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
  <div class="w-full max-w-md rounded-lg bg-surface p-5 shadow-xl">
    <header class="mb-4">
      <h2 class="text-lg font-semibold text-default">Log a call</h2>
      @if (prefilledContactName) {
        <p class="mt-1 text-xs text-muted">
          For <span class="font-medium text-default">{{ prefilledContactName }}</span>
        </p>
      }
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="block text-sm">
          <span class="mb-1 block text-xs font-medium text-muted">Direction</span>
          <crm-mobile-select
            [options]="directionOptions"
            [value]="form.controls.direction.value"
            (valueChange)="onDirectionPicked($event)"
          />
        </label>
        <label class="block text-sm">
          <span class="mb-1 block text-xs font-medium text-muted">Started</span>
          <crm-mobile-datetime
            [value]="form.controls.started_at.value"
            [min]="minStartedAt"
            [max]="maxStartedAt"
            placeholder="Pick date & time"
            (valueChange)="onStartedAtPicked($event)"
          />
        </label>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Duration (sec)</span>
          <input
            type="number"
            min="0"
            formControlName="duration_sec"
            class="mt-1 block w-full rounded-lg border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </label>
        <label class="block text-sm">
          <span class="mb-1 block text-xs font-medium text-muted">Outcome</span>
          <crm-mobile-select
            [options]="outcomeOptions()"
            [value]="form.controls.outcome_id.value ?? ''"
            placeholder="— Not set —"
            (valueChange)="onOutcomePicked($event)"
          />
        </label>
      </div>

      <label class="block text-sm">
        <span class="block text-xs font-medium text-muted">Notes</span>
        <textarea
          rows="3"
          formControlName="notes"
          class="mt-1 block w-full resize-none rounded-lg border border-subtle bg-surface px-3 py-2 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
        ></textarea>
      </label>

      <!-- Recording upload (optional) — drag/drop or click. Uploads
           after the Call row is created so we have a stable id to
           attach to. -->
      <div class="block text-sm">
        <span class="block text-xs font-medium text-muted">Recording (optional)</span>

        @if (recordingFile(); as f) {
          <div
            class="mt-1 flex items-center justify-between gap-2 rounded-md border border-emerald-500/20 bg-emerald-500/10 px-3 py-2 text-xs text-emerald-300"
          >
            <span class="flex items-center gap-2 truncate">
              <lucide-icon name="mic" size="14" aria-hidden="true"></lucide-icon>
              <span class="truncate font-medium">{{ f.name }}</span>
              <span class="shrink-0 text-emerald-400/70">· {{ recordingSizeLabel() }}</span>
            </span>
            <button
              type="button"
              (click)="clearRecording()"
              class="shrink-0 rounded p-0.5 text-emerald-400 hover:bg-emerald-500/10"
              aria-label="Remove recording"
            >
              <lucide-icon name="x" size="14" aria-hidden="true"></lucide-icon>
            </button>
          </div>
        } @else {
          <label
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave()"
            (drop)="onDrop($event)"
            [class.border-muted]="dragActive()"
            [class.bg-surface-2]="dragActive()"
            class="mt-1 flex cursor-pointer flex-col items-center justify-center rounded-md border border-dashed border-subtle bg-surface px-3 py-4 text-center text-xs text-muted transition hover:border-subtle hover:bg-surface-2"
          >
            <lucide-icon
              name="upload-cloud"
              size="18"
              class="mb-1 text-faint"
              aria-hidden="true"
            ></lucide-icon>
            <span class="font-medium text-default">Drop audio file or click to upload</span>
            <span class="mt-0.5 text-[11px] text-faint"> mp3 · m4a · ogg · wav · max 30 MB </span>
            <input
              type="file"
              accept=".mp3,.m4a,.ogg,.wav,audio/*"
              class="sr-only"
              (change)="onRecordingPicked($event)"
            />
          </label>
        }

        @if (recordingError(); as err) {
          <p class="mt-1 text-[11px] text-red-500">{{ err }}</p>
        }
      </div>

      @if (submitError(); as err) {
        <div
          class="rounded-md border border-red-500/20 bg-red-500/10 px-3 py-2 text-xs text-red-400"
        >
          {{ err }}
        </div>
      }

      <div class="flex items-center justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="close()"
          class="rounded-lg border border-subtle bg-surface px-3 py-1.5 text-sm font-medium text-default hover:bg-surface-2"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:brightness-95 disabled:opacity-50"
        >
          @if (uploadingRecording()) {
            Uploading recording…
          } @else if (submitting()) {
            Saving…
          } @else {
            Log call
          }
        </button>
      </div>
    </form>
  </div>
</div>
