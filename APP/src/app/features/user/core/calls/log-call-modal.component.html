<div class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/50 px-4">
  <div class="w-full max-w-md rounded-lg bg-white p-5 shadow-xl">
    <header class="mb-4">
      <h2 class="text-lg font-semibold text-zinc-900">Log a call</h2>
      @if (prefilledContactName) {
        <p class="mt-1 text-xs text-zinc-500">
          For <span class="font-medium text-zinc-700">{{ prefilledContactName }}</span>
        </p>
      }
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm">
          <span class="block text-xs font-medium text-zinc-600">Direction</span>
          <select
            formControlName="direction"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          >
            <option value="out">Outgoing</option>
            <option value="in">Incoming</option>
          </select>
        </label>
        <label class="block text-sm">
          <span class="block text-xs font-medium text-zinc-600">Started</span>
          <input
            type="datetime-local"
            formControlName="started_at"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          />
        </label>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm">
          <span class="block text-xs font-medium text-zinc-600">Duration (sec)</span>
          <input
            type="number"
            min="0"
            formControlName="duration_sec"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          />
        </label>
        <label class="block text-sm">
          <span class="block text-xs font-medium text-zinc-600">Outcome</span>
          <select
            formControlName="outcome_id"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          >
            <option [ngValue]="null">— Not set —</option>
            @for (o of outcomes; track o.id) {
              <option [ngValue]="o.id">{{ o.label }}</option>
            }
          </select>
        </label>
      </div>

      <label class="block text-sm">
        <span class="block text-xs font-medium text-zinc-600">Notes</span>
        <textarea
          rows="3"
          formControlName="notes"
          class="mt-1 block w-full resize-none rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
        ></textarea>
      </label>

      @if (submitError(); as err) {
        <div class="rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
          {{ err }}
        </div>
      }

      <div class="flex items-center justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="close()"
          class="rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded-md bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-zinc-800 disabled:opacity-50"
        >
          {{ submitting() ? 'Saving…' : 'Log call' }}
        </button>
      </div>
    </form>
  </div>
</div>
