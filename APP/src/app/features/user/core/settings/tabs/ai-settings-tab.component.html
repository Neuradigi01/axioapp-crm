<div>
  @if (loadError(); as err) {
    <div
      class="mb-3 rounded-md border border-red-500/20 bg-red-500/10 px-3 py-2 text-sm text-red-400"
    >
      {{ err }}
    </div>
  }

  @if (loading()) {
    <div class="rounded-lg border border-subtle bg-surface p-6 text-center text-sm text-muted">
      Loading…
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-5">
      <section>
        <h3 class="mb-2 text-sm font-semibold text-default">AI assistant</h3>
        <label class="flex items-start gap-3">
          <input
            type="checkbox"
            formControlName="ai_enabled"
            class="mt-1 h-4 w-4 rounded border-subtle text-default focus:ring-accent"
          />
          <span class="text-sm text-default">
            Enable the AI assistant for this organisation.
            <span class="block text-xs text-muted mt-0.5">
              Phase 5 reads this flag to decide whether to auto-reply to inbound WhatsApp messages
              with the personality below.
            </span>
          </span>
        </label>

        <label class="mt-3 block text-sm">
          <span class="block text-xs font-medium text-muted">Personality / tone</span>
          <textarea
            rows="3"
            formControlName="ai_personality"
            placeholder="Warm, helpful, concise. Always recommend visiting the showroom for sofas."
            class="mt-1 block w-full resize-none rounded-md border border-subtle bg-surface px-3 py-2 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          ></textarea>
        </label>

        <label class="mt-3 block text-sm">
          <span class="block text-xs font-medium text-muted">Welcome message</span>
          <textarea
            rows="2"
            formControlName="ai_welcome_message"
            placeholder="Hi! Welcome to Demo Furniture — how can I help?"
            class="mt-1 block w-full resize-none rounded-md border border-subtle bg-surface px-3 py-2 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          ></textarea>
        </label>
      </section>

      <section>
        <h3 class="mb-2 text-sm font-semibold text-default">Reviews automation</h3>
        <label class="flex items-start gap-3">
          <input
            type="checkbox"
            formControlName="reviews_auto_request_enabled"
            class="mt-1 h-4 w-4 rounded border-subtle text-default focus:ring-accent"
          />
          <span class="text-sm text-default">
            Automatically request a review after delivery.
            <span class="block text-xs text-muted mt-0.5">
              Wires up in Phase 5.11; reads this toggle + the delay below.
            </span>
          </span>
        </label>

        <label class="mt-3 block text-sm">
          <span class="block text-xs font-medium text-muted">Delay (hours after delivery)</span>
          <input
            type="number"
            min="0"
            max="720"
            formControlName="reviews_auto_request_delay_hours"
            class="mt-1 w-32 rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </label>
      </section>

      @if (saveError(); as err) {
        <div
          class="rounded-md border border-red-500/20 bg-red-500/10 px-3 py-2 text-sm text-red-400"
        >
          {{ err }}
        </div>
      }
      @if (saveOk()) {
        <div
          class="rounded-md border border-emerald-500/20 bg-emerald-500/10 px-3 py-2 text-xs text-emerald-400"
        >
          Saved.
        </div>
      }

      <div class="flex justify-end">
        <button
          type="submit"
          [disabled]="saving()"
          class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:bg-accent disabled:opacity-50"
        >
          {{ saving() ? 'Saving…' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</div>
