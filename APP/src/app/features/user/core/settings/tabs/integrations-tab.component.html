<div>
  <ul class="space-y-3">
    @for (i of items; track i.id) {
      @let badge = statusBadge(i.status);
      <li class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-semibold text-zinc-900">{{ i.name }}</h3>
              <span
                [class]="
                  'inline-flex items-center rounded-full px-2 py-0.5 text-[10px] font-medium ring-1 ' + badge.cls
                "
              >
                {{ badge.label }}
              </span>
            </div>
            <p class="mt-1 text-xs text-zinc-500">{{ i.description }}</p>
          </div>
          <span class="shrink-0 text-[10px] text-zinc-500">{{ i.phase }}</span>
        </div>
      </li>
    }
  </ul>
</div>
