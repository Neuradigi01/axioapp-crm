<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-accent/40 p-4"
  (click)="onBackdropClick($event)"
  data-testid="add-domain-modal-backdrop"
>
  <div
    class="w-full  rounded-xl border border-subtle bg-surface p-4 md:p-6 shadow-xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="add-domain-title"
  >
    <div class="flex items-start gap-3">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-surface-2 text-default ring-1 border-subtle"
        aria-hidden="true"
      >
        <lucide-icon name="globe" size="20"></lucide-icon>
      </div>
      <div class="min-w-0">
        <h2 id="add-domain-title" class="text-base font-semibold text-default">
          Add a sender domain
        </h2>
        <p class="mt-1 text-sm text-muted">
          Enter the naked domain your campaign mailboxes send from. Skip
          <span class="font-mono">https://</span>, <span class="font-mono">www.</span>, and any
          trailing paths.
        </p>
      </div>
    </div>

    <form class="mt-4 space-y-2" (ngSubmit)="submit()">
      <label class="block text-sm">
        <span class="block text-xs font-medium text-muted">Domain</span>
        <input
          type="text"
          autocomplete="off"
          spellcheck="false"
          [formControl]="form.domain"
          placeholder="yourshop.com"
          class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 font-mono text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          [class.border-rose-300]="form.domain.touched && form.domain.invalid"
        />
      </label>
      @if (form.domain.touched && form.domain.invalid) {
        <p class="text-xs text-rose-600">
          Enter a valid domain — letters, digits, hyphens, and a TLD (e.g.
          <span class="font-mono">yourshop.com</span>).
        </p>
      }

      <div class="mt-6 flex items-center justify-end gap-2">
        <button
          type="button"
          class="inline-flex items-center rounded-md border border-subtle bg-surface px-3 py-2 text-sm font-medium text-default hover:bg-surface-2 disabled:opacity-50"
          [disabled]="creating()"
          (click)="cancelled.emit()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex items-center gap-1.5 rounded-md bg-accent px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-accent disabled:opacity-50"
          [disabled]="creating() || form.domain.invalid"
        >
          @if (creating()) {
            <lucide-icon name="loader-2" size="14" class="animate-spin"></lucide-icon>
            Adding…
          } @else {
            <lucide-icon name="plus" size="14"></lucide-icon>
            Add domain
          }
        </button>
      </div>
    </form>
  </div>
</div>
