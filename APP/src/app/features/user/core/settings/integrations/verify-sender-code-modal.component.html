<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
  (click)="onBackdropClick($event)"
>
  <div class="w-full max-w-md rounded-xl border border-subtle bg-surface p-4 md:p-6 shadow-lg">
    <div class="mb-4 flex items-start justify-between gap-3">
      <div>
        <h3 class="text-base font-semibold text-default">Enter verification code</h3>
        <p class="mt-1 text-sm text-muted">
          We emailed a 6-digit code to
          <span class="font-mono text-default">{{ fromAddress() }}</span
          >. Enter it below to activate this sender identity. The code expires in 30 minutes.
        </p>
      </div>
      <button
        type="button"
        class="rounded p-1 text-muted hover:bg-surface-2"
        [disabled]="submitting()"
        (click)="cancel()"
        aria-label="Close"
      >
        <lucide-icon name="x" size="16" aria-hidden="true"></lucide-icon>
      </button>
    </div>

    @if (info(); as msg) {
      <div
        class="mb-3 flex items-start gap-2 rounded-md border border-emerald-500/20 bg-emerald-500/10 p-3 text-sm text-emerald-400"
      >
        <lucide-icon
          name="check-circle-2"
          size="14"
          class="mt-0.5 shrink-0"
          aria-hidden="true"
        ></lucide-icon>
        <span>{{ msg }}</span>
      </div>
    }

    @if (error(); as err) {
      <div
        class="mb-3 flex items-start gap-2 rounded-md border border-red-500/20 bg-red-500/10 p-3 text-sm text-red-400"
      >
        <lucide-icon
          name="alert-triangle"
          size="14"
          class="mt-0.5 shrink-0"
          aria-hidden="true"
        ></lucide-icon>
        <span>{{ err }}</span>
      </div>
    }

    <form (ngSubmit)="submit()">
      <label class="block">
        <span class="text-xs font-medium text-default">Verification code</span>
        <input
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          pattern="\d{6}"
          class="mt-1 block w-full rounded-lg border border-subtle bg-surface px-3 py-2 text-center font-mono text-2xl tracking-[0.5em] shadow-sm focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
          placeholder="______"
          [formControl]="code"
        />
        @if (code.touched && code.invalid) {
          <p class="mt-1 text-xs text-red-500">Enter the 6-digit numeric code.</p>
        }
      </label>

      <div class="mt-5 flex items-center justify-between gap-3">
        <button
          type="button"
          class="inline-flex items-center gap-1 text-sm font-medium text-muted hover:text-default disabled:opacity-50"
          [disabled]="resending() || submitting()"
          (click)="resend()"
        >
          @if (resending()) {
            <lucide-icon
              name="loader-2"
              size="14"
              class="animate-spin"
              aria-hidden="true"
            ></lucide-icon>
            Resending…
          } @else {
            Resend code
          }
        </button>

        <div class="flex items-center gap-2">
          <button
            type="button"
            class="inline-flex items-center rounded-lg border border-subtle bg-surface px-3 py-2 text-sm font-medium text-default hover:bg-surface-2 disabled:opacity-50"
            [disabled]="submitting()"
            (click)="cancel()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="inline-flex items-center gap-2 rounded-md bg-accent px-3 py-2 text-sm font-medium text-white shadow-sm hover:brightness-95 disabled:opacity-50"
            [disabled]="submitting() || code.invalid"
          >
            @if (submitting()) {
              <lucide-icon
                name="loader-2"
                size="14"
                class="animate-spin"
                aria-hidden="true"
              ></lucide-icon>
              Verifying…
            } @else {
              Verify
            }
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
