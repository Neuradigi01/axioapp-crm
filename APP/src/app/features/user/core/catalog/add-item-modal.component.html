<div class="fixed inset-0 z-40 flex items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-lg rounded-lg bg-white shadow-xl ring-1 ring-zinc-200">
    <header class="border-b border-zinc-200 px-6 py-4">
      <h2 class="text-base font-semibold text-zinc-900">
        {{ isEdit() ? 'Edit product' : 'Add product' }}
      </h2>
      <p class="mt-1 text-xs text-zinc-500">
        {{ isEdit() ? 'SKU is locked. Change name, category, price, or active state.' : 'Pick a unique SKU, give it a name, set the price.' }}
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 px-6 py-5">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-medium text-zinc-700" for="ci_sku">SKU *</label>
          <input
            id="ci_sku"
            type="text"
            formControlName="sku"
            placeholder="e.g. SOF001"
            autocomplete="off"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm uppercase text-zinc-900 placeholder-zinc-400 shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500 disabled:bg-zinc-100"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-700" for="ci_category">Category</label>
          <input
            id="ci_category"
            type="text"
            formControlName="category"
            placeholder="e.g. Sofa"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 placeholder-zinc-400 shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-700" for="ci_name">Name *</label>
        <input
          id="ci_name"
          type="text"
          formControlName="name"
          placeholder="e.g. 3-seater Sofa"
          class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 placeholder-zinc-400 shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
        />
      </div>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-medium text-zinc-700" for="ci_price">Price (₹) *</label>
          <input
            id="ci_price"
            type="number"
            min="0"
            step="0.01"
            formControlName="price"
            placeholder="0.00"
            class="mt-1 block w-full rounded-md border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 placeholder-zinc-400 shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
          />
        </div>
        <div class="flex items-end">
          <label class="flex items-center gap-2 text-sm text-zinc-700">
            <input
              type="checkbox"
              formControlName="is_active"
              class="h-4 w-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-500"
            />
            Active (shown in pickers + lists)
          </label>
        </div>
      </div>

      @if (submitError(); as err) {
        <div class="rounded-md bg-red-50 px-3 py-2 text-xs text-red-700 ring-1 ring-red-200">
          {{ err }}
        </div>
      }
    </form>

    <footer class="flex items-center justify-end gap-2 border-t border-zinc-200 bg-zinc-50 px-6 py-3 rounded-b-lg">
      <button
        type="button"
        (click)="cancel.emit()"
        class="rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50"
      >
        Cancel
      </button>
      <button
        type="button"
        [disabled]="submitting()"
        (click)="onSubmit()"
        class="rounded-md bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-zinc-800 disabled:cursor-not-allowed disabled:bg-zinc-400"
      >
        {{ isEdit() ? 'Save' : 'Add Product' }}
      </button>
    </footer>
  </div>
</div>
