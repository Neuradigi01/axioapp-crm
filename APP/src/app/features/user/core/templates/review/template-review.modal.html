<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-lg bg-surface shadow-xl ring-1 border-subtle">
    <header class="border-b border-subtle px-5 py-3">
      <h2 class="text-sm font-semibold text-default">Review template</h2>
      <p class="mt-0.5 text-xs text-muted">
        {{ template().name }} · v{{ template().current_version }}
      </p>
    </header>

    <div class="space-y-3 px-5 py-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-xs">
        <button
          type="button"
          (click)="setAction('approve')"
          class="rounded-md border px-2 py-2 font-medium ring-inset"
          [class]="
            action() === 'approve'
              ? 'border-emerald-300 bg-emerald-500/10 text-emerald-400 ring-1 border-emerald-500/20'
              : 'border-subtle bg-surface text-default hover:bg-surface-2'
          "
        >
          <lucide-icon name="check" size="14" class="mr-1 inline" />
          Approve
        </button>
        <button
          type="button"
          (click)="setAction('request_changes')"
          class="rounded-md border px-2 py-2 font-medium"
          [class]="
            action() === 'request_changes'
              ? 'border-amber-300 bg-amber-500/10 text-amber-400 ring-1 border-amber-500/20'
              : 'border-subtle bg-surface text-default hover:bg-surface-2'
          "
        >
          <lucide-icon name="pencil" size="14" class="mr-1 inline" />
          Request changes
        </button>
        <button
          type="button"
          (click)="setAction('reject')"
          class="rounded-md border px-2 py-2 font-medium"
          [class]="
            action() === 'reject'
              ? 'border-red-500/30 bg-red-500/10 text-red-400 ring-1 border-red-500/20'
              : 'border-subtle bg-surface text-default hover:bg-surface-2'
          "
        >
          <lucide-icon name="x" size="14" class="mr-1 inline" />
          Reject
        </button>
      </div>

      <label class="block">
        <span class="text-xs font-medium text-default">
          Note
          @if (noteRequired()) {
            <span class="text-red-500">*</span>
            <span class="text-faint">required</span>
          } @else {
            <span class="text-faint">optional</span>
          }
        </span>
        <textarea
          rows="4"
          [value]="note()"
          (input)="onNoteInput($any($event.target).value)"
          maxlength="2000"
          class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm focus:border-muted focus:outline-none"
          placeholder="What should the author know?"
        ></textarea>
      </label>

      @if (error(); as e) {
        <div
          class="rounded-md border border-red-500/20 bg-red-500/10 px-3 py-2 text-xs text-red-400"
        >
          {{ e }}
        </div>
      }
    </div>

    <footer
      class="flex items-center justify-end gap-2 border-t border-subtle bg-surface-2 px-5 py-3"
    >
      <button
        type="button"
        (click)="close()"
        [disabled]="submitting()"
        class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm text-default hover:bg-surface-2 disabled:opacity-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="submit()"
        [disabled]="!canSubmit()"
        class="inline-flex items-center gap-1.5 rounded-md bg-accent px-3 py-1.5 text-sm font-semibold text-white hover:brightness-95 disabled:opacity-50"
      >
        @if (submitting()) {
          <lucide-icon name="loader-2" size="12" class="animate-spin" />
        }
        Submit
      </button>
    </footer>
  </div>
</div>
