<aside
  class="fixed inset-y-0 left-0 z-50 flex h-screen w-64 flex-col bg-zinc-900 text-zinc-100 transition-all duration-200 md:sticky md:top-0 md:z-auto md:translate-x-0"
  [class.-translate-x-full]="!mobileOpen()"
  [class.md:w-16]="!expanded()"
>
  <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-4">
    <!-- Full brand: always shown on mobile, desktop only when expanded. -->
    <div class="min-w-0 flex-1" [class.md:hidden]="!expanded()">
      <span class="block truncate text-base font-semibold tracking-tight">
        {{ org()?.name ?? 'CRM' }}
      </span>
      @if (org(); as o) {
        <span class="mt-0.5 inline-block rounded-full bg-zinc-800 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-zinc-400">
          {{ o.template_id }} pack
        </span>
      }
    </div>
    <!-- Collapsed initial: desktop only when collapsed. -->
    <span class="hidden text-base font-semibold" [class.md:block]="!expanded()">
      {{ (org()?.name ?? 'C').charAt(0) }}
    </span>

    <!-- Desktop collapse/expand toggle. -->
    <button
      type="button"
      class="ml-2 hidden rounded p-1 text-zinc-400 transition hover:bg-zinc-800 hover:text-zinc-100 md:inline-flex"
      (click)="toggle.emit()"
      [attr.aria-label]="expanded() ? 'Collapse sidebar' : 'Expand sidebar'"
    >
      <lucide-icon
        [name]="expanded() ? 'chevron-left' : 'chevron-right'"
        class="h-4 w-4"
      />
    </button>

    <!-- Mobile drawer close. -->
    <button
      type="button"
      class="ml-2 rounded p-1 text-zinc-400 transition hover:bg-zinc-800 hover:text-zinc-100 md:hidden"
      (click)="close.emit()"
      aria-label="Close menu"
    >
      <lucide-icon name="x" class="h-4 w-4" />
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto px-2 py-3">
    @if (error()) {
      <p class="px-2 text-xs text-rose-400">{{ error() }}</p>
    } @else {
      <ul class="space-y-1">
        @for (m of modules(); track m.id) {
          <li>
            <a
              [routerLink]="m.frontend_route"
              routerLinkActive="bg-zinc-800 text-white"
              class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-zinc-300 transition hover:bg-zinc-800 hover:text-white"
              [class.md:justify-center]="!expanded()"
              [attr.title]="m.name"
              (click)="close.emit()"
            >
              <lucide-icon [name]="m.icon" class="h-5 w-5 shrink-0" />
              <span class="truncate" [class.md:hidden]="!expanded()">{{ m.name }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </nav>
</aside>
