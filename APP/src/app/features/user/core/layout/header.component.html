<header
  class="sticky top-0 z-10 flex h-14 items-center gap-4 border-b border-zinc-200 bg-white px-4 shadow-sm"
>
  <button
    type="button"
    class="rounded p-2 text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-700 md:hidden"
    (click)="toggleSidebar.emit()"
    aria-label="Toggle sidebar"
  >
    <lucide-icon name="menu" class="h-5 w-5" />
  </button>

  <div class="relative flex max-w-md flex-1 items-center">
    <lucide-icon name="search" class="pointer-events-none absolute left-3 h-4 w-4 text-zinc-400" />
    <input
      type="search"
      placeholder="Search…"
      class="h-9 w-full rounded-md border border-zinc-200 bg-zinc-50 pl-9 pr-3 text-sm placeholder:text-zinc-400 focus:border-zinc-400 focus:bg-white focus:outline-none"
    />
  </div>

  <div class="ml-auto flex items-center gap-2">
    <div
      class="inline-flex items-center rounded-md border border-zinc-200 bg-zinc-50 p-0.5"
      role="radiogroup"
      aria-label="Theme"
    >
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="themeChoice() === 'light'"
        class="inline-flex h-7 w-7 items-center justify-center rounded transition"
        [class.bg-white]="themeChoice() === 'light'"
        [class.text-zinc-900]="themeChoice() === 'light'"
        [class.shadow-sm]="themeChoice() === 'light'"
        [class.text-zinc-500]="themeChoice() !== 'light'"
        [class.hover:text-zinc-700]="themeChoice() !== 'light'"
        (click)="pickTheme('light')"
        aria-label="Light theme"
      >
        <lucide-icon name="sun" class="h-3.5 w-3.5" />
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="themeChoice() === 'dark'"
        class="inline-flex h-7 w-7 items-center justify-center rounded transition"
        [class.bg-white]="themeChoice() === 'dark'"
        [class.text-zinc-900]="themeChoice() === 'dark'"
        [class.shadow-sm]="themeChoice() === 'dark'"
        [class.text-zinc-500]="themeChoice() !== 'dark'"
        [class.hover:text-zinc-700]="themeChoice() !== 'dark'"
        (click)="pickTheme('dark')"
        aria-label="Dark theme"
      >
        <lucide-icon name="moon" class="h-3.5 w-3.5" />
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="themeChoice() === 'system'"
        class="inline-flex h-7 w-7 items-center justify-center rounded transition"
        [class.bg-white]="themeChoice() === 'system'"
        [class.text-zinc-900]="themeChoice() === 'system'"
        [class.shadow-sm]="themeChoice() === 'system'"
        [class.text-zinc-500]="themeChoice() !== 'system'"
        [class.hover:text-zinc-700]="themeChoice() !== 'system'"
        (click)="pickTheme('system')"
        aria-label="Match system theme"
      >
        <lucide-icon name="monitor" class="h-3.5 w-3.5" />
      </button>
    </div>

    <div class="relative">
      <button
        type="button"
        class="relative rounded p-2 text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-700"
        aria-label="My tasks"
        [attr.aria-expanded]="tasksOpen()"
        (click)="toggleTasks()"
      >
        <lucide-icon name="check-square" class="h-5 w-5" />
      </button>
      <app-my-tasks-popover [open]="tasksOpen()" />
    </div>

    <div class="relative">
      <button
        type="button"
        class="relative rounded p-2 text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-700"
        aria-label="Notifications"
        [attr.aria-expanded]="notificationsOpen()"
        (click)="toggleNotifications()"
      >
        <lucide-icon name="bell" class="h-5 w-5" />
        @if (unreadCount() > 0) {
          <span
            class="absolute right-0.5 top-0.5 inline-flex h-4 min-w-[1rem] items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-medium text-white"
          >
            {{ unreadCount() > 99 ? '99+' : unreadCount() }}
          </span>
        }
      </button>
      <app-notifications-popover
        [open]="notificationsOpen()"
        (closeRequested)="closeNotifications()"
      />
    </div>

    <div class="relative">
      <button
        type="button"
        class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm text-zinc-700 transition hover:bg-zinc-100"
        (click)="toggleUserMenu()"
      >
        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-zinc-200">
          <lucide-icon name="user" class="h-4 w-4 text-zinc-600" />
        </span>
        @if (user(); as u) {
          <span class="hidden sm:inline">{{ u.full_name }}</span>
        }
      </button>

      @if (userMenuOpen()) {
        <div
          class="absolute right-0 top-full mt-1 w-44 overflow-hidden rounded-md border border-zinc-200 bg-white shadow-lg"
        >
          @if (user(); as u) {
            <div class="border-b border-zinc-100 px-3 py-2 text-xs text-zinc-500">
              <p class="truncate font-medium text-zinc-700">{{ u.full_name }}</p>
              <p class="truncate">{{ u.email }}</p>
            </div>
          }
          <a
            routerLink="/user/settings"
            [queryParams]="{ tab: 'profile' }"
            class="flex w-full items-center gap-2 px-3 py-2 text-sm text-zinc-700 transition hover:bg-zinc-50"
            (click)="toggleUserMenu()"
          >
            <lucide-icon name="user" class="h-4 w-4" />
            Profile
          </a>
          <button
            type="button"
            class="flex w-full items-center gap-2 border-t border-zinc-100 px-3 py-2 text-sm text-zinc-700 transition hover:bg-zinc-50"
            (click)="logout()"
          >
            <lucide-icon name="log-out" class="h-4 w-4" />
            Log out
          </button>
        </div>
      }
    </div>
  </div>
</header>
