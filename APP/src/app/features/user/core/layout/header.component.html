<header
  class="sticky top-0 z-10 flex h-[56px] shrink-0 items-center gap-3 border-b border-subtle bg-surface px-4"
>
  <!-- Left: Cmd+K search trigger pill (AIXO layout — left, 34px, 340px max) -->
  <button
    type="button"
    class="hidden h-[34px] max-w-[340px] min-w-[220px] flex-1 items-center gap-2 rounded-[9px] border border-subtle bg-app px-3 text-left text-[13px] text-faint transition hover:border-muted hover:text-muted md:flex"
    (click)="openPalette.emit()"
    aria-label="Open command palette"
  >
    <lucide-icon name="search" class="h-3.5 w-3.5 shrink-0" />
    <span class="flex-1 truncate">Search or jump to…</span>
    <kbd
      class="ml-auto hidden rounded border border-subtle bg-surface-2 px-1.5 py-0.5 font-mono text-[10.5px] uppercase tracking-wider text-faint md:inline"
    >
      ⌘K
    </kbd>
  </button>

  <!-- Mobile: workspace label (initial + name) on the left. Sidebar's
       workspace card shows the same info on desktop. -->
  <div class="flex min-w-0 items-center gap-2 md:hidden">
    <span
      class="inline-flex h-[28px] w-[28px] shrink-0 items-center justify-center rounded-[8px] bg-accent-soft font-display text-[13px] font-semibold text-accent"
      aria-hidden="true"
    >
      {{ wsInitial() }}
    </span>
    <span class="truncate text-[14px] font-semibold text-default">
      {{ org()?.name ?? brand().name }}
    </span>
  </div>

  <!-- Mobile: compact search icon (opens the same command palette) -->
  <button
    type="button"
    class="inline-flex h-[34px] w-[34px] shrink-0 items-center justify-center rounded-[9px] border border-subtle bg-app text-muted transition hover:bg-surface-2 hover:text-default md:hidden"
    (click)="openPalette.emit()"
    aria-label="Open command palette"
  >
    <lucide-icon name="search" class="h-4 w-4" />
  </button>

  <!-- Right cluster (AIXO layout — 34px controls, radius 9px) -->
  <div class="ml-auto flex items-center gap-2">
    <!-- Theme toggle (3-way segmented, 34px tall to match AIXO controls) -->
    <div
      class="hidden h-[34px] items-center rounded-[9px] border border-subtle bg-app px-1 sm:inline-flex"
      role="radiogroup"
      aria-label="Theme"
    >
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="themeChoice() === 'light'"
        class="inline-flex h-7 w-7 items-center justify-center rounded-md transition"
        [class.bg-surface]="themeChoice() === 'light'"
        [class.text-default]="themeChoice() === 'light'"
        [class.text-muted]="themeChoice() !== 'light'"
        [class.hover:text-default]="themeChoice() !== 'light'"
        (click)="pickTheme('light')"
        aria-label="Light theme"
      >
        <lucide-icon name="sun" class="h-3.5 w-3.5" />
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="themeChoice() === 'dark'"
        class="inline-flex h-7 w-7 items-center justify-center rounded-md transition"
        [class.bg-surface]="themeChoice() === 'dark'"
        [class.text-default]="themeChoice() === 'dark'"
        [class.text-muted]="themeChoice() !== 'dark'"
        [class.hover:text-default]="themeChoice() !== 'dark'"
        (click)="pickTheme('dark')"
        aria-label="Dark theme"
      >
        <lucide-icon name="moon" class="h-3.5 w-3.5" />
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="themeChoice() === 'system'"
        class="inline-flex h-7 w-7 items-center justify-center rounded-md transition"
        [class.bg-surface]="themeChoice() === 'system'"
        [class.text-default]="themeChoice() === 'system'"
        [class.text-muted]="themeChoice() !== 'system'"
        [class.hover:text-default]="themeChoice() !== 'system'"
        (click)="pickTheme('system')"
        aria-label="Match system theme"
      >
        <lucide-icon name="monitor" class="h-3.5 w-3.5" />
      </button>
    </div>

    <!-- Mobile theme cycle (Light → Dark → System → Light) -->
    <button
      type="button"
      class="inline-flex h-[34px] w-[34px] items-center justify-center rounded-[9px] border border-subtle bg-app text-muted transition hover:bg-surface-2 hover:text-default sm:hidden"
      (click)="cycleTheme()"
      [attr.aria-label]="'Theme: ' + themeChoice() + ' (tap to change)'"
    >
      @switch (themeChoice()) {
        @case ('light') {
          <lucide-icon name="sun" class="h-4 w-4" />
        }
        @case ('dark') {
          <lucide-icon name="moon" class="h-4 w-4" />
        }
        @default {
          <lucide-icon name="monitor" class="h-4 w-4" />
        }
      }
    </button>

    <!-- My tasks (34px bordered icon button to match AIXO controls) -->
    <div class="relative">
      <button
        type="button"
        class="relative inline-flex h-[34px] w-[34px] items-center justify-center rounded-[9px] border border-subtle bg-app text-muted transition hover:bg-surface-2 hover:text-default"
        aria-label="My tasks"
        [attr.aria-expanded]="tasksOpen()"
        (click)="toggleTasks()"
      >
        <lucide-icon name="check-square" class="h-4 w-4" />
      </button>
      <app-my-tasks-popover [open]="tasksOpen()" />
    </div>

    <!-- Notifications (34px bordered icon button) -->
    <div class="relative">
      <button
        type="button"
        class="relative inline-flex h-[34px] w-[34px] items-center justify-center rounded-[9px] border border-subtle bg-app text-muted transition hover:bg-surface-2 hover:text-default"
        aria-label="Notifications"
        [attr.aria-expanded]="notificationsOpen()"
        (click)="toggleNotifications()"
      >
        <lucide-icon name="bell" class="h-4 w-4" />
        @if (unreadCount() > 0) {
          <span
            class="absolute right-0.5 top-0.5 inline-flex h-4 min-w-[1rem] items-center justify-center rounded-full bg-red-500 px-1 font-mono text-[10px] font-medium text-white"
          >
            {{ unreadCount() > 99 ? '99+' : unreadCount() }}
          </span>
        }
      </button>
      <app-notifications-popover
        [open]="notificationsOpen()"
        (closeRequested)="closeNotifications()"
      />
    </div>

    <!-- Avatar (AIXO: accent-soft bg, accent text, 34x34, radius 9px) -->
    <div class="relative">
      <button
        type="button"
        class="inline-flex h-[34px] w-[34px] items-center justify-center rounded-[9px] bg-accent-soft font-display text-[13px] font-semibold text-accent transition hover:brightness-110"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="userMenuOpen()"
        aria-label="Account"
      >
        @if (user(); as u) {
          {{ u.full_name.charAt(0).toUpperCase() }}
        } @else {
          <lucide-icon name="user" class="h-4 w-4" />
        }
      </button>

      @if (userMenuOpen()) {
        <div
          class="absolute right-0 top-[42px] z-40 w-[224px] overflow-hidden rounded-xl border border-subtle bg-surface-2 p-1.5 shadow-elevated"
        >
          @if (user(); as u) {
            <div class="px-2.5 pb-2.5 pt-2">
              <p class="truncate text-sm font-semibold text-default">{{ u.full_name }}</p>
              <p class="truncate text-xs text-faint">{{ u.email }}</p>
            </div>
            <div class="my-1 h-px bg-subtle"></div>
          }
          <a
            routerLink="/user/settings"
            [queryParams]="{ tab: 'profile' }"
            class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm text-default transition hover:bg-surface"
            (click)="toggleUserMenu()"
          >
            <lucide-icon name="user" class="h-4 w-4 text-muted" />
            Profile
          </a>
          <button
            type="button"
            class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm text-red-500 transition hover:bg-surface"
            (click)="logout()"
          >
            <lucide-icon name="log-out" class="h-4 w-4" />
            Log out
          </button>
        </div>
      }
    </div>
  </div>
</header>
