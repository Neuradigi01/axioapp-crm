<nav
  class="fixed inset-x-0 bottom-0 z-30 flex h-[64px] items-stretch border-t border-subtle bg-surface pb-[env(safe-area-inset-bottom)] md:hidden"
  aria-label="Primary"
>
  @for (m of pinned(); track m.id) {
    <a
      [routerLink]="m.frontend_route"
      routerLinkActive="text-accent"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex flex-1 flex-col items-center justify-center gap-1 text-[11px] font-medium text-muted transition"
    >
      <lucide-icon [name]="m.icon" class="h-[18px] w-[18px]" />
      <span class="truncate leading-none">{{ m.name }}</span>
    </a>
  }

  <button
    type="button"
    class="flex flex-1 flex-col items-center justify-center gap-1 text-[11px] font-medium text-muted transition"
    [class.text-accent]="moreOpen()"
    (click)="openMore()"
    aria-label="More modules"
    [attr.aria-expanded]="moreOpen()"
  >
    <lucide-icon name="menu" class="h-[18px] w-[18px]" />
    <span class="leading-none">More</span>
  </button>
</nav>

<app-mobile-more-sheet [open]="moreOpen()" (closed)="closeMore()" />
