<div class="flex min-h-screen bg-app text-default">
  @if (mobileMenuOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 md:hidden"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>
  }

  <app-sidebar
    [expanded]="sidebarOpen()"
    [mobileOpen]="mobileMenuOpen()"
    (toggle)="toggleSidebar()"
    (close)="closeMobileMenu()"
    class="contents"
  />

  <div class="flex min-w-0 flex-1 flex-col">
    <crm-trial-banner />
    <app-header (toggleSidebar)="toggleMobileMenu()" (openPalette)="openPalette()" />
    <main class="flex flex-1 flex-col overflow-x-hidden">
      <div class="flex-1">
        <router-outlet />
      </div>
      <app-footer />
    </main>
  </div>
</div>

<app-quick-add-fab />
<app-toast-host />
<app-command-palette #palette />
<crm-upgrade-modal />
