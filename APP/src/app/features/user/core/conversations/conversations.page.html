<div class="flex h-[calc(100vh-4rem)] flex-col">
  <header class="border-b border-zinc-200 bg-white px-6 py-3">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-zinc-900">Conversations</h1>
        <p class="text-xs text-zinc-500">
          Unified inbox across WhatsApp, Instagram, web chat &amp; SMS
        </p>
      </div>
      <button
        type="button"
        (click)="reloadList()"
        class="rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50"
      >
        Refresh
      </button>
    </div>
    @if (loadError(); as err) {
      <div class="mt-2 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
        {{ err }}
      </div>
    }
  </header>

  @if (reassignOpen() && selectedConversation(); as conv) {
    <app-reassign-modal
      [entityLabel]="'conversation'"
      [count]="1"
      [currentOwnerId]="conv.assigned_to_id"
      [submitting]="reassignSubmitting()"
      [error]="reassignError()"
      (confirm)="onReassignConfirm($event)"
      (cancel)="closeReassign()"
    />
  }

  <div class="flex min-h-0 flex-1">
    <!-- Left: list -->
    <aside class="flex w-80 min-w-[18rem] flex-col border-r border-zinc-200 bg-white">
      <app-conversation-list
        [items]="items()"
        [loading]="loading()"
        [selectedId]="selectedId()"
        [staffById]="staffById()"
        [currentUserId]="currentUserId() ?? ''"
        [initialAssignee]="initialAssignee"
        [tagFilterIds]="tagFilterIds()"
        (filtersChange)="onFiltersChange($event)"
        (assigneeChange)="onAssigneeFilterChange($event)"
        (tagFilterChange)="onTagFilterChange($event)"
        (select)="onSelect($event)"
      />
    </aside>

    <!-- Right: thread + compose -->
    <section class="flex min-w-0 flex-1 flex-col bg-zinc-50">
      @if (selectedConversation(); as conv) {
        <app-chat-thread
          [conversation]="conv"
          [detail]="detail()"
          [loading]="threadLoading()"
          [staffById]="staffById()"
          (toggleAi)="onToggleAi($event)"
          (reassign)="openReassign()"
          (replyTo)="onReplyTo($event)"
          (react)="onReact($event)"
          (tagsChanged)="onTagsChanged($event)"
          (pickTemplate)="onPickTemplate()"
        />
        <app-compose-bar
          #composeBar
          [aiHandling]="conv.ai_handling"
          [channel]="conv.channel"
          [contactId]="conv.contact_id"
          [replyingTo]="replyingTo()"
          [staff]="staffList()"
          [outOfSession]="isOutOfSession()"
          [receivedViaPhoneId]="$any(conv).received_via_phone_id ?? null"
          (send)="onSendText($event)"
          (sendMedia)="onSendMedia($event)"
          (sendNote)="onSendNote($event)"
          (openInteractive)="openInteractive()"
          (toggleAi)="onToggleAi($event)"
          (clearReply)="onClearReply()"
        />
        <app-interactive-builder
          [open]="interactiveOpen()"
          (cancel)="closeInteractive()"
          (submit)="onSendInteractive($event)"
        />
      } @else {
        <div class="flex flex-1 items-center justify-center px-4 text-center text-sm text-zinc-500">
          Pick a conversation from the list to start replying.
        </div>
      }
    </section>
  </div>
</div>
