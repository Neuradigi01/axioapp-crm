@if (variant() === 'page') {
  <!-- Full-bleed page wrapper -->
  <div class="flex min-h-[60vh] items-center justify-center px-6 py-12">
    <div
      class="w-full max-w-lg rounded-2xl border border-zinc-200 bg-white p-8 text-center shadow-sm dark:border-slate-700 dark:bg-slate-800"
    >
      @if (illustrationUrl(); as url) {
        <img [src]="url" alt="" class="mx-auto mb-6 h-32 w-32" aria-hidden="true" />
      } @else {
        <div
          class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-blue-100 text-3xl text-blue-600 dark:bg-blue-950 dark:text-blue-300"
          aria-hidden="true"
        >
          🔒
        </div>
      }
      <h2 class="text-xl font-semibold text-zinc-900 dark:text-slate-100">
        {{ title() }}
      </h2>
      <p class="mt-3 text-sm text-zinc-600 dark:text-slate-300">
        {{ description() }}
      </p>
      <button
        type="button"
        (click)="onUpgrade()"
        class="mt-6 inline-flex items-center gap-1.5 rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-blue-700"
      >
        Upgrade to {{ planLabel() }} →
      </button>
      <p class="mt-4 text-xs text-zinc-500 dark:text-slate-400">
        Already on {{ planLabel() }}? Contact support.
      </p>
    </div>
  </div>
} @else {
  <!-- Compact inline variant -->
  <div
    class="flex items-start gap-4 rounded-xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800"
  >
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-100 text-lg text-blue-600 dark:bg-blue-950 dark:text-blue-300"
      aria-hidden="true"
    >
      🔒
    </div>
    <div class="flex-1">
      <h3 class="text-sm font-semibold text-zinc-900 dark:text-slate-100">
        {{ title() }}
      </h3>
      <p class="mt-1 text-sm text-zinc-600 dark:text-slate-300">
        {{ description() }}
      </p>
    </div>
    <button
      type="button"
      (click)="onUpgrade()"
      class="shrink-0 rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700"
    >
      Upgrade
    </button>
  </div>
}
