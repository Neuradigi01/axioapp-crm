<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-lg bg-surface shadow-xl ring-1 border-subtle">
    <header class="border-b border-subtle px-5 py-3">
      <h2 class="text-sm font-semibold text-default">Reschedule appointment</h2>
      @if (_appointment(); as a) {
        <p class="mt-0.5 text-xs text-muted">
          {{ a.title }}
        </p>
      }
    </header>
    <div class="space-y-3 px-5 py-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="reschedule_date" class="block text-xs font-medium text-default">Date</label>
          <input
            id="reschedule_date"
            type="date"
            [formControl]="dateControl"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm text-default shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </div>
        <div>
          <label for="reschedule_time" class="block text-xs font-medium text-default">Time</label>
          <input
            id="reschedule_time"
            type="time"
            [formControl]="timeControl"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm text-default shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </div>
      </div>

      <div>
        <label for="reschedule_reason" class="block text-xs font-medium text-default">
          Reason <span class="text-faint">(optional)</span>
        </label>
        <textarea
          id="reschedule_reason"
          [formControl]="reasonControl"
          rows="2"
          placeholder="e.g. customer requested earlier slot"
          class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm text-default placeholder-zinc-400 shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
        ></textarea>
        <p class="mt-1 text-xs text-muted">Saved on the timeline entry.</p>
      </div>

      @if (_error(); as err) {
        <div class="rounded-md bg-red-50 px-3 py-2 text-xs text-red-700 ring-1 ring-red-200">
          {{ err }}
        </div>
      }
    </div>
    <footer
      class="flex items-center justify-end gap-2 border-t border-subtle bg-surface-2 px-5 py-3 rounded-b-lg"
    >
      <button
        type="button"
        [disabled]="_submitting()"
        (click)="cancel.emit()"
        class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm font-medium text-default hover:bg-surface-2"
      >
        Cancel
      </button>
      <button
        type="button"
        [disabled]="!canConfirm()"
        (click)="onConfirm()"
        class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:bg-accent disabled:cursor-not-allowed disabled:bg-surface-2"
      >
        Save
      </button>
    </footer>
  </div>
</div>
