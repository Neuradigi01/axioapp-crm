@if (_appointment(); as a) {
  <div class="fixed inset-0 z-40" (click)="dismiss.emit()" aria-hidden="true"></div>
  <div
    role="dialog"
    class="fixed left-1/2 top-1/2 z-50 w-72 -translate-x-1/2 -translate-y-1/2 rounded-lg bg-white p-3 shadow-xl ring-1 ring-zinc-200"
    (click)="$event.stopPropagation()"
  >
    <header class="border-b border-zinc-200 pb-2">
      <h3 class="text-sm font-semibold text-zinc-900">{{ a.title }}</h3>
      <p class="mt-0.5 text-[10px] uppercase tracking-wide text-zinc-500">
        {{ a.status }}
      </p>
    </header>
    <div class="mt-2 grid grid-cols-1 gap-1">
      @if (canReassign()) {
        <button
          type="button"
          (click)="reassign.emit()"
          class="inline-flex items-center gap-2 rounded-md px-2 py-1.5 text-left text-xs font-medium text-zinc-700 hover:bg-zinc-50"
        >
          <lucide-icon name="user-cog" class="h-3.5 w-3.5" />
          Reassign
        </button>
      }
      @if (canWrite()) {
        <button
          type="button"
          (click)="reschedule.emit()"
          class="inline-flex items-center gap-2 rounded-md px-2 py-1.5 text-left text-xs font-medium text-zinc-700 hover:bg-zinc-50"
        >
          <lucide-icon name="calendar-clock" class="h-3.5 w-3.5" />
          Reschedule
        </button>
      }
      @if (canMarkCompleted()) {
        <button
          type="button"
          (click)="markCompleted.emit()"
          class="inline-flex items-center gap-2 rounded-md px-2 py-1.5 text-left text-xs font-medium text-emerald-700 hover:bg-emerald-50"
        >
          <lucide-icon name="check-circle-2" class="h-3.5 w-3.5" />
          Mark completed
        </button>
      }
      @if (canCancel()) {
        <button
          type="button"
          (click)="cancelAppt.emit()"
          class="inline-flex items-center gap-2 rounded-md px-2 py-1.5 text-left text-xs font-medium text-red-700 hover:bg-red-50"
        >
          <lucide-icon name="x-circle" class="h-3.5 w-3.5" />
          Cancel
        </button>
      }
    </div>
    <footer class="mt-2 border-t border-zinc-200 pt-2 text-right">
      <button
        type="button"
        (click)="dismiss.emit()"
        class="rounded-md px-2 py-1 text-[11px] font-medium text-zinc-500 hover:bg-zinc-100"
      >
        Close
      </button>
    </footer>
  </div>
}
