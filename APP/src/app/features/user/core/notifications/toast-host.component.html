@if (toasts().length > 0) {
  <div
    class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-80 flex-col gap-2"
    aria-live="polite"
    aria-atomic="true"
  >
    @for (t of toasts(); track t.id) {
      <button
        type="button"
        (click)="onClick(t)"
        class="pointer-events-auto flex w-full items-start gap-3 rounded-xl border border-subtle bg-surface-2 px-3.5 py-3 text-left shadow-elevated transition hover:brightness-105"
        style="animation: popIn 0.15s ease"
      >
        <lucide-icon
          [name]="toneIcon(t.tone)"
          class="mt-0.5 h-4 w-4 shrink-0"
          [class]="toneIconClass(t.tone)"
        />
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium text-default">{{ t.title }}</span>
          @if (t.body) {
            <span class="mt-0.5 block text-xs text-muted">{{ t.body }}</span>
          }
        </span>
        <button
          type="button"
          (click)="onClose($event, t.id)"
          class="rounded p-0.5 text-faint transition hover:bg-surface hover:text-default"
          aria-label="Dismiss"
        >
          <lucide-icon name="x" class="h-3.5 w-3.5" />
        </button>
      </button>
    }
  </div>
}
