<div
  class="w-72 overflow-hidden rounded-md border border-subtle bg-surface shadow-lg"
  role="dialog"
  aria-label="Add stage"
>
  <header class="border-b border-subtle px-3 py-2">
    <h3 class="text-sm font-semibold text-default">Add stage</h3>
  </header>

  <div class="space-y-3 px-3 py-3">
    <label class="block">
      <span class="text-xs font-medium text-default">Name</span>
      <input
        type="text"
        [value]="nameValue()"
        (input)="onNameInput($any($event.target).value)"
        maxlength="128"
        placeholder="e.g. Demo Scheduled"
        class="mt-1 w-full rounded border border-subtle px-2 py-1.5 text-sm text-default focus:border-zinc-500 focus:outline-none"
      />
      @if (nameError(); as err) {
        <p class="mt-1 text-[11px] text-red-600">{{ err }}</p>
      } @else if (nameValue().length > 0 && !nameValid()) {
        <p class="mt-1 text-[11px] text-red-600">Name must be 1–128 characters.</p>
      }
    </label>

    <div>
      <span class="text-xs font-medium text-default">Colour</span>
      <div class="mt-1 flex items-center gap-2">
        <div class="flex items-center gap-1.5">
          @for (preset of presetColors; track preset) {
            <button
              type="button"
              (click)="onSelectPreset(preset)"
              [attr.aria-label]="'Use colour ' + preset"
              [attr.aria-pressed]="colorValue() === preset"
              class="h-5 w-5 rounded-full ring-2 ring-transparent transition hover:border-subtle"
              [class.ring-zinc-900]="colorValue() === preset"
              [style.background-color]="preset"
            ></button>
          }
        </div>
        <input
          type="text"
          [value]="colorValue() ?? ''"
          (input)="onColorInput($any($event.target).value)"
          placeholder="#a855f7"
          maxlength="9"
          class="w-24 rounded border border-subtle px-2 py-1 text-xs font-mono text-default focus:border-zinc-500 focus:outline-none"
        />
      </div>
      @if (!colorValid()) {
        <p class="mt-1 text-[11px] text-red-600">Colour must be a hex like #a855f7.</p>
      }
    </div>

    <label class="block">
      <span class="text-xs font-medium text-default">Insert</span>
      <select
        [value]="afterStageKey() ?? ''"
        (change)="onAnchorChange($any($event.target).value)"
        class="mt-1 w-full rounded border border-subtle bg-surface px-2 py-1.5 text-sm text-default focus:border-zinc-500 focus:outline-none"
      >
        <option value="">(at the end)</option>
        @for (stage of anchorOptions(); track stage.id) {
          <option [value]="stage.key">After: {{ stage.name }}</option>
        }
      </select>
    </label>
  </div>

  <footer class="flex items-center justify-end gap-2 border-t border-subtle bg-surface-2 px-3 py-2">
    @if (submitError(); as err) {
      <p class="mr-auto text-[11px] text-red-600">{{ err }}</p>
    }
    <button
      type="button"
      (click)="onCancel()"
      class="rounded border border-subtle bg-surface px-3 py-1 text-xs font-medium text-default transition hover:bg-surface-2"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="!canSubmit()"
      class="rounded bg-accent px-3 py-1 text-xs font-medium text-white transition hover:bg-accent disabled:cursor-not-allowed disabled:opacity-50"
    >
      Add stage
    </button>
  </footer>
</div>
