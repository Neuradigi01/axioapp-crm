<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-lg bg-surface shadow-xl ring-1 border-subtle">
    <header class="border-b border-subtle px-5 py-3">
      <h2 class="text-sm font-semibold text-default">Why was this lead lost?</h2>
      <p class="mt-0.5 text-xs text-muted">
        Required so we can analyse win-loss reasons. Pick the closest match.
      </p>
    </header>
    <div class="space-y-3 px-5 py-4">
      <fieldset class="space-y-1.5">
        @for (r of reasons; track r.v) {
          <label
            class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-sm hover:bg-surface-2"
            [class.bg-surface-2]="reasonControl.value === r.v"
            [class.font-medium]="reasonControl.value === r.v"
          >
            <input
              type="radio"
              [value]="r.v"
              [formControl]="reasonControl"
              class="h-4 w-4 border-subtle text-default focus:ring-accent"
            />
            <span class="text-default">{{ r.label }}</span>
          </label>
        }
      </fieldset>

      @if (otherRequired()) {
        <div>
          <label for="lost_reason_other" class="block text-xs font-medium text-default">
            Tell us more
          </label>
          <input
            id="lost_reason_other"
            type="text"
            [formControl]="otherControl"
            maxlength="255"
            placeholder="e.g. switched to a custom-build vendor"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm text-default placeholder-zinc-400 shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </div>
      }

      @if (_error(); as err) {
        <div
          class="rounded-md bg-red-500/10 px-3 py-2 text-xs text-red-400 ring-1 border-red-500/20"
        >
          {{ err }}
        </div>
      }
    </div>
    <footer
      class="flex items-center justify-end gap-2 border-t border-subtle bg-surface-2 px-5 py-3 rounded-b-lg"
    >
      <button
        type="button"
        [disabled]="_submitting()"
        (click)="cancel.emit()"
        class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm font-medium text-default hover:bg-surface-2"
      >
        Cancel
      </button>
      <button
        type="button"
        [disabled]="!canConfirm()"
        (click)="onConfirm()"
        class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:bg-accent disabled:cursor-not-allowed disabled:bg-surface-2"
      >
        Mark Lost
      </button>
    </footer>
  </div>
</div>
