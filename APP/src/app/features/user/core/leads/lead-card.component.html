<div class="space-y-1.5">
  <div class="flex items-start gap-2">
    <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-zinc-200 text-[10px] font-semibold text-zinc-700">
      {{ initials() }}
    </span>
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-medium text-zinc-900">
        {{ contactName() ?? 'Unknown contact' }}
      </p>
      @if (contactPhone()) {
        <p class="truncate text-[11px] text-zinc-500">{{ contactPhone() }}</p>
      }
    </div>
  </div>

  <div class="flex items-center justify-between gap-2">
    @if (contactSource()) {
      <span class="inline-flex items-center gap-1 rounded-full bg-zinc-100 px-1.5 py-0.5 text-[10px] font-medium text-zinc-700 ring-1 ring-zinc-200">
        @if (sourceIcon(); as icn) {
          <lucide-icon [name]="icn" class="h-3 w-3" />
        }
        {{ contactSource() }}
      </span>
    }
    <span
      class="ml-auto inline-flex items-center rounded-full px-1.5 py-0.5 text-[10px] font-medium ring-1"
      [class]="statusPillClass()"
    >
      {{ lead().status }}
    </span>
  </div>

  @if (lead().budget) {
    <p class="text-xs font-semibold text-zinc-700">
      {{ lead().budget | formatINR : true }}
    </p>
  }
</div>
