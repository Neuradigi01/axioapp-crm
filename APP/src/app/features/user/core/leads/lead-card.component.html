<div class="space-y-1.5">
  <div class="flex items-start gap-2">
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xs font-semibold"
      [class]="avatarClass()"
    >
      {{ initials() }}
    </span>
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-medium text-zinc-900">
        {{ contactName() ?? 'Unknown contact' }}
      </p>
      <p class="truncate text-[11px] text-zinc-500">
        {{ dateLabel() }}
      </p>
    </div>
    <span
      class="ml-auto inline-flex items-center rounded-full px-1.5 py-0.5 text-[10px] font-medium ring-1"
      [class]="statusPillClass()"
    >
      {{ lead().status }}
    </span>
  </div>

  @if (productLabel(); as product) {
    <p class="flex items-center gap-1 text-xs text-zinc-700">
      <span aria-hidden="true">🛋️</span>
      <span class="truncate">{{ product }}</span>
    </p>
  }

  @if (lead().budget) {
    <p class="text-sm font-semibold text-zinc-900">
      {{ lead().budget | formatINR : true }}
    </p>
  }

  <div>
    <span
      class="inline-flex items-center rounded-full px-1.5 py-0.5 text-[10px] font-medium ring-1"
      [class]="sourceBadgeClass()"
    >
      {{ sourceBadgeLabel() }}
    </span>
  </div>
</div>
