<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
  <div class="w-full max-w-lg rounded-lg bg-surface p-5 shadow-xl">
    <header class="mb-3">
      <h2 class="text-lg font-semibold text-default">Reply to review</h2>
      <p class="mt-1 text-xs text-muted capitalize">Source: {{ review.source }}</p>
    </header>

    <!-- Original review (read-only) -->
    <div class="mb-4 rounded-md border border-subtle bg-surface-2 p-3">
      <div class="mb-1 flex items-baseline gap-2">
        <span class="text-base text-amber-500">{{ stars(review.rating) }}</span>
        <span class="text-xs text-muted">{{ review.rating }}/5</span>
      </div>
      @if (review.text) {
        <p class="text-sm text-default whitespace-pre-wrap">{{ review.text }}</p>
      } @else {
        <p class="text-sm text-muted italic">(no text)</p>
      }
    </div>

    <form (ngSubmit)="submit()">
      <label class="block text-sm">
        <span class="block text-xs font-medium text-muted">Your reply</span>
        <textarea
          rows="4"
          [formControl]="textControl"
          placeholder="Thanks for the feedback…"
          class="mt-1 block w-full resize-none rounded-md border border-subtle bg-surface px-3 py-2 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
        ></textarea>
      </label>

      @if (submitError(); as err) {
        <div
          class="mt-3 rounded-md border border-red-500/20 bg-red-500/10 px-3 py-2 text-xs text-red-400"
        >
          {{ err }}
        </div>
      }

      <div class="mt-4 flex items-center justify-end gap-2">
        <button
          type="button"
          (click)="close()"
          class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm font-medium text-default hover:bg-surface-2"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="submitting() || !textControl.value.trim()"
          class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:brightness-95 disabled:opacity-50"
        >
          {{ submitting() ? 'Sending…' : 'Send reply' }}
        </button>
      </div>
    </form>
  </div>
</div>
