<div class="space-y-3">
  @if (isConvert()) {
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Conversion reason</label>
      <crm-mobile-select
        [options]="conversionReasonOptions"
        [value]="conversionReason()"
        (valueChange)="onConversionReasonChange($event)"
        placeholder="Select…"
      />
    </div>
  }

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Reason (audit note)</label>
    <textarea
      rows="2"
      [ngModel]="reason()"
      (ngModelChange)="onReasonChange($event)"
      placeholder="Optional — audit log records this"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    ></textarea>
  </div>
</div>
