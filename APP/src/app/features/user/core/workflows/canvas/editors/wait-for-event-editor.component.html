<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Wait for event</label>
    <select
      [ngModel]="eventType()"
      (ngModelChange)="onEventChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    >
      <option value="">— pick an event —</option>
      @for (e of waitableEvents; track e.type) {
        <option [value]="e.type">{{ e.label }}</option>
      }
    </select>
    @if (!eventType()) {
      <p class="text-[10px] text-rose-600 mt-1">Event is required.</p>
    }
    <p class="text-[10px] text-muted mt-1">
      Only events a contact can "expect" appear (e.g. opened / clicked / replied — not raw creates).
    </p>
  </div>

  <div class="grid grid-cols-2 gap-2">
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Max wait</label>
      <input
        type="number"
        min="1"
        [ngModel]="amount()"
        (ngModelChange)="onAmountChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
      />
    </div>
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Unit</label>
      <select
        [ngModel]="unit()"
        (ngModelChange)="onUnitChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
      >
        @for (u of units; track u.value) {
          <option [value]="u.value">{{ u.label }}</option>
        }
      </select>
    </div>
  </div>

  <label class="flex items-center gap-2 text-xs">
    <input
      type="checkbox"
      [ngModel]="contactMatch()"
      (ngModelChange)="onContactMatchChange($event)"
    />
    Require the event to be from the same contact
  </label>
  <p class="text-[10px] text-muted">
    When off, any event of this type fires the
    <code class="text-emerald-700">event_received</code> edge (org-wide wake-up).
  </p>
</div>
