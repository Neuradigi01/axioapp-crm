<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Recipient</label>
    <select
      [ngModel]="recipient()"
      (ngModelChange)="onRecipientChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
    >
      <option value="workflow.owner">Workflow owner</option>
      <option value="lead.owner">Lead owner</option>
      <option value="contact.assigned_to">Contact's assigned rep</option>
    </select>
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Title</label>
    <input
      type="text"
      [ngModel]="title()"
      (ngModelChange)="onTitleChange($event)"
      placeholder="e.g. New lead waiting"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
    />
    @if (!title().trim()) {
      <p class="text-[10px] text-rose-600 mt-1">Title is required.</p>
    }
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Body</label>
    <textarea
      rows="3"
      [ngModel]="body()"
      (ngModelChange)="onBodyChange($event)"
      placeholder="Notification body — supports {{ '{{var}}' }} variables"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
    ></textarea>
  </div>
</div>
