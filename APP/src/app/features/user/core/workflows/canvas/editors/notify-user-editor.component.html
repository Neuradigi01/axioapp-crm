<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Recipient</label>
    <crm-mobile-select
      [options]="recipientOptions"
      [value]="recipient()"
      (valueChange)="onRecipientChange($event)"
      placeholder="Select…"
    />
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Title</label>
    <input
      type="text"
      [ngModel]="title()"
      (ngModelChange)="onTitleChange($event)"
      placeholder="e.g. New lead waiting"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!title().trim()) {
      <p class="text-[10px] text-red-500 mt-1">Title is required.</p>
    }
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Body</label>
    <textarea
      rows="3"
      [ngModel]="body()"
      (ngModelChange)="onBodyChange($event)"
      placeholder="Notification body — supports {{ '{{var}}' }} variables"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    ></textarea>
  </div>
</div>
