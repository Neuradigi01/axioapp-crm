<div
  class="fixed inset-0 z-50 bg-accent/40 backdrop-blur-sm flex items-center justify-center p-6"
  (click)="busy() ? null : cancel.emit()"
>
  <div
    class="bg-surface rounded-xl border border-subtle shadow-xl w-full max-w-md"
    (click)="$event.stopPropagation()"
  >
    <header class="px-5 py-3 border-b border-subtle flex items-center gap-2">
      <h2 class="text-sm font-semibold text-default flex-1">Import workflow JSON</h2>
      <button
        type="button"
        class="text-faint hover:text-default"
        [disabled]="busy()"
        (click)="cancel.emit()"
      >
        <lucide-icon name="X" class="w-4 h-4"></lucide-icon>
      </button>
    </header>

    <div class="px-5 py-4 space-y-3">
      <label
        class="block px-3 py-6 text-center text-xs text-muted border-2 border-dashed border-subtle rounded cursor-pointer hover:border-zinc-500 hover:bg-surface-2"
      >
        <lucide-icon name="Upload" class="w-5 h-5 mb-1 text-muted inline"></lucide-icon>
        @if (fileName()) {
          <p class="text-default font-medium truncate">{{ fileName() }}</p>
          <p class="text-[10px] text-muted mt-1">Click to pick a different file.</p>
        } @else {
          <p>Click to pick a .workflow.json file</p>
          <p class="text-[10px] text-faint mt-1">Up to 5 MB.</p>
        }
        <input
          type="file"
          accept=".json,application/json"
          class="hidden"
          (change)="onFileChange($event)"
        />
      </label>

      @if (error()) {
        <p class="text-xs text-rose-600 px-1">{{ error() }}</p>
      }

      @if (parsed()) {
        <div>
          <label class="block text-[11px] font-medium text-muted mb-1">
            Name for the new draft
          </label>
          <input
            type="text"
            [ngModel]="overrideName()"
            (ngModelChange)="overrideName.set($event)"
            [disabled]="busy()"
            class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
            maxlength="120"
          />
          <p class="text-[10px] text-muted mt-1">
            Name conflicts auto-suffix as <code>(2)</code>, <code>(3)</code>, … Send-action template
            references will be remapped to null — you'll pick real templates per node before
            activating.
          </p>
        </div>
      }
    </div>

    <footer class="px-5 py-3 border-t border-subtle flex items-center gap-2">
      <div class="flex-1"></div>
      <button
        type="button"
        class="px-3 py-1.5 text-xs rounded border border-subtle text-default hover:bg-surface-2"
        [disabled]="busy()"
        (click)="cancel.emit()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="px-3 py-1.5 text-xs rounded bg-accent text-white hover:bg-accent"
        [disabled]="!canSubmit()"
        (click)="onSubmit()"
      >
        @if (busy()) {
          Importing…
        } @else {
          Import as draft
        }
      </button>
    </footer>
  </div>
</div>
