<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Attach to</label>
    <crm-mobile-select
      [options]="entityOptions"
      [value]="entity()"
      (valueChange)="onEntityChange($event)"
      placeholder="Select…"
    />
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Body</label>
    <textarea
      rows="4"
      [ngModel]="body()"
      (ngModelChange)="onBodyChange($event)"
      placeholder="Note text — visible on the timeline, supports {{ '{{var}}' }} variables"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    ></textarea>
    @if (!body().trim()) {
      <p class="text-[10px] text-red-500 mt-1">Body is required.</p>
    }
  </div>
</div>
