<div class="space-y-3">
  <div class="bg-surface-2 border border-subtle rounded px-2 py-1.5">
    <span class="text-[10px] uppercase tracking-wider text-muted">Mode</span>
    <p class="text-xs font-medium text-default capitalize">
      {{ mode().replaceAll('_', ' ') }}
    </p>
  </div>

  @if (!isSpecificUser()) {
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Pool type</label>
      <crm-mobile-select
        [options]="poolTypeOptions"
        [value]="poolType()"
        (valueChange)="onPoolTypeChange($event)"
        placeholder="Select…"
      />
    </div>

    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">
        Pool value
        @if (poolType() === 'explicit') {
          <span class="text-faint">(comma-separated user UUIDs)</span>
        }
      </label>
      <input
        type="text"
        [ngModel]="poolValue()"
        (ngModelChange)="onPoolValueChange($event)"
        [placeholder]="
          poolType() === 'role'
            ? 'role name (e.g. Sales rep)'
            : poolType() === 'team'
              ? 'team id'
              : 'uuid1,uuid2,…'
        "
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
      />
      @if (!poolValue().trim()) {
        <p class="text-[10px] text-red-500 mt-1">Pool value is required.</p>
      }
    </div>
  } @else {
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1"> Specific user UUID </label>
      <input
        type="text"
        [ngModel]="specificUserId()"
        (ngModelChange)="onSpecificUserChange($event)"
        placeholder="uuid"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted font-mono"
      />
      @if (!specificUserId().trim()) {
        <p class="text-[10px] text-red-500 mt-1">User UUID is required.</p>
      }
    </div>
  }

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Attach to</label>
    <crm-mobile-select
      [options]="targetOptions"
      [value]="target()"
      (valueChange)="onTargetChange($event)"
      placeholder="Select…"
    />
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Fallback</label>
    <crm-mobile-select
      [options]="fallbackOptions"
      [value]="fallback()"
      (valueChange)="onFallbackChange($event)"
      placeholder="Select…"
    />
  </div>
</div>
