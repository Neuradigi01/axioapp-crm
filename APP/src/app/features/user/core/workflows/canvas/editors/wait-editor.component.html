<div class="space-y-3">
  <div class="grid grid-cols-2 gap-2">
    <div>
      <label class="block text-[11px] font-medium text-zinc-600 mb-1">Wait</label>
      <input
        type="number"
        min="1"
        [ngModel]="amount()"
        (ngModelChange)="onAmountChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
      />
    </div>
    <div>
      <label class="block text-[11px] font-medium text-zinc-600 mb-1">Unit</label>
      <select
        [ngModel]="unit()"
        (ngModelChange)="onUnitChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
      >
        @for (u of units; track u.value) {
          <option [value]="u.value">{{ u.label }}</option>
        }
      </select>
    </div>
  </div>
  <p class="text-[10px] text-zinc-500">
    Resolves to <strong>{{ delaySeconds() }}</strong> seconds. Sub-minute
    precision is not guaranteed — beat cadence is 60s.
  </p>
</div>
