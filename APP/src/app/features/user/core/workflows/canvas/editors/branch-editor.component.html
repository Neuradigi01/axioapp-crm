<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-zinc-600 mb-1">
      Yes-branch conditions
    </label>
    <p class="text-[10px] text-zinc-500 mb-2">
      When the conditions evaluate to true, the run follows the
      <code class="text-emerald-700">yes</code> edge; otherwise it
      follows the <code class="text-pink-600">no</code> edge.
    </p>
    <app-conditions-builder
      [tree]="conditions()"
      [variableGroups]="variableGroups"
      (treeChange)="onConditionsChange($event)"
    />
    @if (!conditions()) {
      <p class="text-[10px] text-rose-600 mt-1">
        At least one condition is required.
      </p>
    }
  </div>
</div>
