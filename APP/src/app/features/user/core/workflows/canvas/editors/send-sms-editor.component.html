<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">
      SMS template (DLT-registered for IN tenants)
    </label>
    <input
      type="text"
      [ngModel]="state().templateId"
      (ngModelChange)="onTemplateChange($event)"
      placeholder="template UUID"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500 font-mono"
    />
    @if (!state().templateId) {
      <p class="text-[10px] text-rose-600 mt-1">Template is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Recipient phone</label>
    <select
      [ngModel]="state().recipient"
      (ngModelChange)="onRecipientChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
    >
      <option value="">— pick a recipient —</option>
      @for (r of recipientOptions; track r.value) {
        <option [value]="r.value">{{ r.label }}</option>
      }
    </select>
    @if (state().recipient === 'custom') {
      <input
        type="text"
        [ngModel]="state().customRecipient"
        (ngModelChange)="onCustomChange($event)"
        placeholder="dotted path or E.164 phone"
        class="mt-1 w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
      />
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Category</label>
    <select
      [ngModel]="state().category"
      (ngModelChange)="onCategoryChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
    >
      @for (c of categoryOptions; track c.value) {
        <option [value]="c.value">{{ c.label }}</option>
      }
    </select>
  </div>
</div>
