<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-zinc-600 mb-1">Title</label>
    <input
      type="text"
      [ngModel]="title()"
      (ngModelChange)="onTitleChange($event)"
      placeholder="e.g. Discovery call"
      class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
    />
    @if (!title().trim()) {
      <p class="text-[10px] text-rose-600 mt-1">Title is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-zinc-600 mb-1">Assignee</label>
    <select
      [ngModel]="assignee()"
      (ngModelChange)="onAssigneeChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
    >
      <option value="lead.owner">Lead owner</option>
      <option value="contact.assigned_to">Contact's assigned rep</option>
      <option value="workflow.owner">Workflow owner</option>
    </select>
  </div>
  <div class="grid grid-cols-2 gap-2">
    <div>
      <label class="block text-[11px] font-medium text-zinc-600 mb-1">Schedule in (hours)</label>
      <input
        type="number"
        min="0"
        [ngModel]="scheduleInHours()"
        (ngModelChange)="onScheduleChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
      />
    </div>
    <div>
      <label class="block text-[11px] font-medium text-zinc-600 mb-1">Duration (min)</label>
      <input
        type="number"
        min="5"
        [ngModel]="durationMinutes()"
        (ngModelChange)="onDurationChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
      />
    </div>
  </div>
</div>
