<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Title</label>
    <input
      type="text"
      [ngModel]="title()"
      (ngModelChange)="onTitleChange($event)"
      placeholder="e.g. Discovery call"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!title().trim()) {
      <p class="text-[10px] text-red-500 mt-1">Title is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Assignee</label>
    <crm-mobile-select
      [options]="assigneeOptions"
      [value]="assignee()"
      (valueChange)="onAssigneeChange($event)"
      placeholder="Select…"
    />
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Schedule in (hours)</label>
      <input
        type="number"
        min="0"
        [ngModel]="scheduleInHours()"
        (ngModelChange)="onScheduleChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
      />
    </div>
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Duration (min)</label>
      <input
        type="number"
        min="5"
        [ngModel]="durationMinutes()"
        (ngModelChange)="onDurationChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
      />
    </div>
  </div>
</div>
