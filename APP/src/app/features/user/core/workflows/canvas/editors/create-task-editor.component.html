<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Task title</label>
    <input
      type="text"
      [ngModel]="title()"
      (ngModelChange)="onTitleChange($event)"
      placeholder="e.g. Follow up with hot lead"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!title().trim()) {
      <p class="text-[10px] text-rose-600 mt-1">Title is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Description</label>
    <textarea
      rows="3"
      [ngModel]="description()"
      (ngModelChange)="onDescriptionChange($event)"
      placeholder="Optional — supports {{ '{{var}}' }} variables"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    ></textarea>
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Assignee</label>
    <select
      [ngModel]="assignee()"
      (ngModelChange)="onAssigneeChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    >
      <option value="lead.owner">Lead owner</option>
      <option value="contact.assigned_to">Contact's assigned rep</option>
      <option value="workflow.owner">Workflow owner</option>
    </select>
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Due in (days)</label>
    <input
      type="number"
      min="0"
      [ngModel]="dueInDays()"
      (ngModelChange)="onDueChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
  </div>
</div>
