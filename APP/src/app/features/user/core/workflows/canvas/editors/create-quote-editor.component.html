<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Quote template</label>
    <input
      type="text"
      [ngModel]="templateId()"
      (ngModelChange)="onTemplateChange($event)"
      placeholder="template UUID"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted font-mono"
    />
    @if (!templateId()) {
      <p class="text-[10px] text-red-500 mt-1">Template is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Amount</label>
    <input
      type="text"
      [ngModel]="amount()"
      (ngModelChange)="onAmountChange($event)"
      placeholder="literal number or dotted path (e.g. lead.budget)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!amount().trim()) {
      <p class="text-[10px] text-red-500 mt-1">Amount is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Expires in (days)</label>
    <input
      type="number"
      min="1"
      [ngModel]="expiresInDays()"
      (ngModelChange)="onExpiresChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
  </div>
  <label class="flex items-center gap-2 text-xs">
    <input type="checkbox" [ngModel]="sendEmail()" (ngModelChange)="onSendEmailChange($event)" />
    Email the quote to the contact on creation
  </label>
</div>
