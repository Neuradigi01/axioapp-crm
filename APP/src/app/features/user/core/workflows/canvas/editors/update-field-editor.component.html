<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Entity</label>
    <div class="text-xs px-2 py-1.5 rounded bg-surface-2 border border-subtle capitalize">
      {{ entity() }}
    </div>
    <p class="text-[10px] text-muted mt-1">
      Inferred from the node type — change by swapping the node.
    </p>
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Field key</label>
    <input
      type="text"
      [ngModel]="fieldKey()"
      (ngModelChange)="onFieldKeyChange($event)"
      placeholder="e.g. lead_score or custom_data.priority"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!fieldKey().trim()) {
      <p class="text-[10px] text-red-500 mt-1">Field key is required.</p>
    } @else {
      <p class="text-[10px] text-muted mt-1">
        System fields and `custom_data.&lt;key&gt;` paths both accepted.
      </p>
    }
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Value source</label>
    <crm-mobile-select
      [options]="valueSourceOptions()"
      [value]="valueSource()"
      (valueChange)="onValueSourceChange($event)"
      placeholder="Select…"
    />
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Value</label>
    <input
      type="text"
      [ngModel]="value()"
      (ngModelChange)="onValueChange($event)"
      placeholder="literal text, or dotted path if not literal"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!value()) {
      <p class="text-[10px] text-red-500 mt-1">Value is required.</p>
    }
  </div>
</div>
