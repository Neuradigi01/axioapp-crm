<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Instagram template</label>
    <input
      type="text"
      [ngModel]="state().templateId"
      (ngModelChange)="onTemplateChange($event)"
      placeholder="template UUID"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted font-mono"
    />
    @if (!state().templateId) {
      <p class="text-[10px] text-red-500 mt-1">Template is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Recipient IGID</label>
    <crm-mobile-select
      [options]="recipientOptions"
      [value]="state().recipient"
      (valueChange)="onRecipientChange($event)"
      placeholder="— pick —"
    />
    @if (state().recipient === 'custom') {
      <input
        type="text"
        [ngModel]="state().customRecipient"
        (ngModelChange)="onCustomChange($event)"
        placeholder="dotted path to IGID"
        class="mt-1 w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
      />
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Category</label>
    <crm-mobile-select
      [options]="categorySelectOptions()"
      [value]="state().category"
      (valueChange)="onCategoryChange($event)"
      placeholder="Select…"
    />
  </div>
</div>
