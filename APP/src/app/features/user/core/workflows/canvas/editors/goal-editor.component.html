<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Goal name</label>
    <input
      type="text"
      [ngModel]="name()"
      (ngModelChange)="onNameChange($event)"
      placeholder="e.g. Booked a demo"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
    />
    @if (!name().trim()) {
      <p class="text-[10px] text-rose-600 mt-1">Goal name is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Outcome label</label>
    <input
      type="text"
      [ngModel]="outcomeLabel()"
      (ngModelChange)="onOutcomeChange($event)"
      placeholder="goal_reached"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500 font-mono"
    />
    <p class="text-[10px] text-muted mt-1">
      Runs that terminate at this node stamp this label on
      <code>tbl_workflow_runs.outcome</code>.
    </p>
  </div>
</div>
