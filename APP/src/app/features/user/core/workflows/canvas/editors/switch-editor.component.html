<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Path to switch on</label>
    <input
      type="text"
      [ngModel]="path()"
      (ngModelChange)="onPathChange($event)"
      placeholder="e.g. lead.pipeline_stage"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!path().trim()) {
      <p class="text-[10px] text-rose-600 mt-1">Path is required.</p>
    }
  </div>

  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Cases (one per output edge)</label>
    <div class="space-y-1.5">
      @for (c of cases(); track $index) {
        <div class="flex items-center gap-2">
          <input
            type="text"
            [ngModel]="c"
            (ngModelChange)="onCaseChange($index, $event)"
            placeholder="value to match"
            class="flex-1 text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
          />
          <button type="button" class="text-faint hover:text-rose-600" (click)="removeCase($index)">
            <lucide-icon name="X" class="w-3.5 h-3.5"></lucide-icon>
          </button>
        </div>
      }
    </div>
    <button
      type="button"
      class="mt-2 text-[11px] px-2 py-1 rounded border border-subtle text-default hover:bg-surface-2"
      (click)="addCase()"
    >
      <lucide-icon name="Plus" class="inline-block w-3 h-3 mr-1"></lucide-icon>
      Add case
    </button>
    @if (cases().length === 0) {
      <p class="text-[10px] text-rose-600 mt-1">At least one case is required.</p>
    }
    <p class="text-[10px] text-muted mt-1">
      The <code>default</code> edge fires when no case matches.
    </p>
  </div>
</div>
