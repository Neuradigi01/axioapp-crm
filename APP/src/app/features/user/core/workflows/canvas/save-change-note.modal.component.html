@if (open()) {
  <div
    class="fixed inset-0 z-50 bg-accent/40 backdrop-blur-sm flex items-center justify-center p-6"
    (click)="busy() ? null : cancel.emit()"
  >
    <form
      class="bg-surface rounded-xl border border-subtle shadow-xl w-full max-w-md"
      (click)="$event.stopPropagation()"
      (submit)="onSubmit($event)"
    >
      <header class="px-5 py-3 border-b border-subtle flex items-center gap-2">
        <h2 class="text-sm font-semibold text-default flex-1">Describe this change (optional)</h2>
        <button
          type="button"
          class="text-faint hover:text-default"
          [disabled]="busy()"
          (click)="cancel.emit()"
        >
          <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
        </button>
      </header>

      <div class="px-5 py-4 space-y-3">
        <input
          type="text"
          [ngModel]="note()"
          (ngModelChange)="note.set($event)"
          [disabled]="busy()"
          [placeholder]="fallbackPlaceholder()"
          autofocus
          name="changeNote"
          maxlength="240"
          class="w-full text-sm px-3 py-2 rounded border border-subtle focus:outline-none focus:border-muted"
        />
        <p class="text-[11px] text-muted">
          This note lands on the version row so future-you can find this change in the
          version-history drawer. Leave blank to use "<code>{{ fallbackPlaceholder() }}</code
          >".
        </p>
      </div>

      <footer class="px-5 py-3 border-t border-subtle flex items-center gap-2">
        <div class="flex-1"></div>
        <button
          type="button"
          class="px-3 py-1.5 text-xs rounded border border-subtle text-default hover:bg-surface-2"
          [disabled]="busy()"
          (click)="cancel.emit()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-3 py-1.5 text-xs rounded bg-accent text-white hover:bg-accent"
          [disabled]="busy()"
        >
          @if (busy()) {
            Saving…
          } @else {
            Save draft
          }
        </button>
      </footer>
    </form>
  </div>
}
