<div class="space-y-3">
  @if (isTag()) {
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1"> Tag name </label>
      <input
        type="text"
        [ngModel]="tagName()"
        (ngModelChange)="onTagChange($event)"
        placeholder="e.g. hot-lead"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
      />
      @if (!tagName().trim()) {
        <p class="text-[10px] text-rose-600 mt-1">Tag is required.</p>
      }
    </div>
  } @else if (isList()) {
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1"> Contact-group UUID </label>
      <input
        type="text"
        [ngModel]="listId()"
        (ngModelChange)="onListIdChange($event)"
        placeholder="uuid of a static contact group"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500 font-mono"
      />
      @if (!listId().trim()) {
        <p class="text-[10px] text-rose-600 mt-1">Group is required.</p>
      }
    </div>
  } @else if (isScore()) {
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Mode</label>
      <select
        [ngModel]="scoreMode()"
        (ngModelChange)="onScoreModeChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
      >
        <option value="set">Set to literal</option>
        <option value="add">Add delta</option>
        <option value="subtract">Subtract delta</option>
      </select>
    </div>
    <div>
      <label class="block text-[11px] font-medium text-muted mb-1">Value</label>
      <input
        type="number"
        [ngModel]="scoreValue()"
        (ngModelChange)="onScoreValueChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-zinc-500"
      />
    </div>
  }
</div>
