<div class="fixed inset-0 z-50 flex items-center justify-center bg-accent/40" (click)="onCancel()">
  <div
    class="w-full max-w-sm rounded-lg border border-subtle bg-surface shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <header class="flex items-center justify-between border-b border-subtle px-4 py-3">
      <h2 class="text-sm font-semibold text-default">New folder</h2>
      <button
        type="button"
        (click)="onCancel()"
        class="rounded-md p-1 text-muted hover:bg-surface-2 hover:text-default"
        aria-label="Cancel"
      >
        <lucide-icon name="x" size="14" />
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-3 px-4 py-3">
      <label class="block text-sm">
        <span class="block text-xs font-medium text-muted">Name</span>
        <input
          formControlName="name"
          maxlength="120"
          placeholder="Sales, Marketing, Onboarding…"
          class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500"
        />
      </label>

      @if (parentCandidates.length > 0) {
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Parent folder (optional)</span>
          <select
            formControlName="parent_folder_id"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-2 py-1.5 text-sm"
          >
            <option value="">— No parent —</option>
            @for (f of parentCandidates; track f.id) {
              <option [value]="f.id">{{ f.name }}</option>
            }
          </select>
          <span class="mt-1 block text-[11px] text-muted">
            Workflows can be nested one level deep.
          </span>
        </label>
      }

      @if (saveError(); as err) {
        <div class="rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
          {{ err }}
        </div>
      }

      <div class="flex items-center justify-end gap-2 pt-1">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm text-default hover:bg-surface-2"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || saving()"
          class="inline-flex items-center gap-1.5 rounded-md bg-accent px-3 py-1.5 text-sm font-semibold text-white hover:bg-accent disabled:opacity-50"
        >
          @if (saving()) {
            <lucide-icon name="loader-2" size="14" class="animate-spin" />
          }
          Create
        </button>
      </div>
    </form>
  </div>
</div>
