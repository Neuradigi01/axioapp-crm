<div
  class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 md:p-6"
  (click)="close.emit()"
>
  <div
    class="bg-surface rounded-xl border border-subtle shadow-xl flex flex-col w-full max-w-4xl h-[80vh]"
    (click)="$event.stopPropagation()"
  >
    <header class="px-5 py-3 border-b border-subtle flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <h2 class="text-sm font-semibold text-default truncate">
          {{ entry().name }}
        </h2>
        <p class="text-[11px] text-muted truncate">
          {{ entry().description }}
        </p>
      </div>
      <button type="button" class="text-faint hover:text-default" (click)="close.emit()">
        <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
      </button>
    </header>

    <div class="flex-1 min-h-0 bg-surface-2 relative overflow-hidden">
      <svg
        class="absolute inset-0 w-full h-full"
        [attr.viewBox]="viewBox()"
        preserveAspectRatio="xMidYMid meet"
      >
        <defs>
          <pattern id="gallery-preview-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" class="fill-zinc-300" />
          </pattern>
          <marker
            id="workflow-arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerUnits="strokeWidth"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(148 163 184)" />
          </marker>
        </defs>
        <rect
          x="-10000"
          y="-10000"
          width="20000"
          height="20000"
          fill="url(#gallery-preview-grid)"
        />

        @for (edge of state.edges(); track edge.id) {
          @if (nodeById().get(edge.source); as src) {
            @if (nodeById().get(edge.target); as tgt) {
              <g appWorkflowEdge [edge]="edge" [source]="src" [target]="tgt"></g>
            }
          }
        }
        @for (node of state.nodes(); track node.id) {
          <g appWorkflowNode [node]="node" [selected]="false"></g>
        }
      </svg>
    </div>

    <footer class="px-5 py-3 border-t border-subtle flex items-center gap-2">
      <span class="text-[11px] text-muted">
        Read-only preview. Cloning gives you an editable draft.
      </span>
      <div class="flex-1"></div>
      <button
        type="button"
        class="px-3 py-1.5 text-xs rounded border border-subtle text-default hover:bg-surface-2"
        (click)="close.emit()"
      >
        Close
      </button>
      <button
        type="button"
        class="px-3 py-1.5 text-xs rounded bg-accent text-white hover:brightness-95"
        (click)="use.emit()"
      >
        Use this template
      </button>
    </footer>
  </div>
</div>
