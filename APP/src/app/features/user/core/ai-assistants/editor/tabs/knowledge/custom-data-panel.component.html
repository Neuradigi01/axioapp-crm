<div class="space-y-3">
  <div>
    <label
      for="knowledge-title"
      class="block text-xs font-medium uppercase tracking-wide text-muted"
    >
      Title
      <span class="text-faint">(optional)</span>
    </label>
    <input
      id="knowledge-title"
      type="text"
      placeholder="e.g. FAQ, Return Policy, Shipping Rates"
      maxlength="500"
      class="mt-1 block w-full rounded-lg border border-subtle bg-surface px-3 py-1.5 text-sm text-default focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="title()"
      (input)="onTitleInput($event)"
    />
  </div>

  <div>
    <label
      for="knowledge-body"
      class="block text-xs font-medium uppercase tracking-wide text-muted"
    >
      Content
    </label>
    <textarea
      id="knowledge-body"
      rows="10"
      placeholder="Paste your custom content here (FAQs, product info, policies, etc.)"
      class="mt-1 block w-full resize-y rounded-lg border border-subtle bg-surface px-3 py-2 text-sm text-default focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="body()"
      (input)="onBodyInput($event)"
    ></textarea>
    <div class="mt-1 flex items-center justify-between text-xs text-muted">
      <span>The AI Assistant will search this text when answering questions.</span>
      <span
        class="font-mono"
        [class.text-red-400]="charCount() > charLimit"
        [class.text-default]="charCount() <= charLimit"
      >
        {{ charCount() }} / {{ charLimit }}
      </span>
    </div>
  </div>

  <div class="flex justify-end">
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-lg bg-accent px-3 py-1.5 text-sm font-semibold text-white shadow-sm transition hover:brightness-95 disabled:opacity-40"
      [disabled]="!canSave()"
      (click)="save()"
    >
      @if (saving()) {
        <lucide-icon
          name="loader-2"
          size="14"
          class="animate-spin"
          aria-hidden="true"
        ></lucide-icon>
        Saving…
      } @else {
        Add to Knowledge
      }
    </button>
  </div>
</div>
