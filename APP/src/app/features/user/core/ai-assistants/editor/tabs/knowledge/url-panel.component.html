<div class="space-y-3">
  <div>
    <label for="knowledge-url" class="block text-xs font-medium uppercase tracking-wide text-muted">
      URL
    </label>
    <input
      id="knowledge-url"
      type="url"
      placeholder="https://example.com/docs/faq"
      maxlength="4096"
      class="mt-1 block w-full rounded-lg border border-subtle bg-surface px-3 py-1.5 text-sm text-default focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="url()"
      (input)="onUrlInput($event)"
    />
  </div>

  <div>
    <label
      for="knowledge-url-title"
      class="block text-xs font-medium uppercase tracking-wide text-muted"
    >
      Title
      <span class="text-faint">(optional)</span>
    </label>
    <input
      id="knowledge-url-title"
      type="text"
      placeholder="A short label so you can find this URL in the list."
      maxlength="500"
      class="mt-1 block w-full rounded-lg border border-subtle bg-surface px-3 py-1.5 text-sm text-default focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
      [value]="title()"
      (input)="onTitleInput($event)"
    />
  </div>

  <div class="rounded-md border border-amber-500/20 bg-amber-500/10 p-3 text-xs text-amber-400">
    URLs pointing to private, loopback, or link-local addresses (10.x, 192.168.x,
    <span class="font-mono">127.0.0.1</span>, <span class="font-mono">169.254.x</span>) are rejected
    for security. Only public https:// and http:// URLs are allowed.
  </div>

  @if (error(); as e) {
    <div class="rounded-md border border-red-500/20 bg-red-500/10 p-3 text-xs text-red-300">
      {{ e }}
    </div>
  }

  @if (notice(); as msg) {
    <div class="rounded-md border border-amber-500/20 bg-amber-500/10 p-3 text-xs text-amber-400">
      {{ msg }}
    </div>
  }

  <div class="flex justify-end">
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-lg bg-accent px-3 py-1.5 text-sm font-semibold text-white shadow-sm transition hover:brightness-95 disabled:opacity-40"
      [disabled]="!canSave()"
      (click)="save()"
    >
      @if (saving()) {
        <lucide-icon
          name="loader-2"
          size="14"
          class="animate-spin"
          aria-hidden="true"
        ></lucide-icon>
        Adding…
      } @else {
        Add URL
      }
    </button>
  </div>
</div>
