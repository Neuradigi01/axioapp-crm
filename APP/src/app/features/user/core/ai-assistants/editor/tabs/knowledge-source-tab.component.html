<div class="mx-auto max-w-2xl space-y-6">
  @if (formState.assistantId(); as assistantId) {
    <!-- Segmented control -->
    <div
      class="inline-flex rounded-lg border border-subtle bg-surface p-0.5 text-xs font-medium"
      role="tablist"
      aria-label="Knowledge source type"
    >
      @for (p of panels; track p.id) {
        <button
          type="button"
          role="tab"
          class="inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 transition"
          [class.bg-surface-2]="activePanel() === p.id && !p.comingSoon"
          [class.text-default]="activePanel() === p.id && !p.comingSoon"
          [class.text-muted]="activePanel() !== p.id || p.comingSoon"
          [class.hover:text-default]="activePanel() !== p.id && !p.comingSoon"
          [class.cursor-not-allowed]="p.comingSoon"
          [class.opacity-60]="p.comingSoon"
          [attr.aria-selected]="activePanel() === p.id && !p.comingSoon"
          [attr.aria-disabled]="p.comingSoon ? 'true' : null"
          [disabled]="p.comingSoon"
          (click)="setPanel(p.id)"
        >
          <lucide-icon [name]="p.icon" size="14" aria-hidden="true"></lucide-icon>
          {{ p.label }}
          @if (p.comingSoon) {
            <span
              class="ml-1 rounded-full border border-amber-500/30 bg-amber-500/10 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-amber-400"
            >
              Coming soon
            </span>
          }
        </button>
      }
    </div>

    <!-- Active input panel -->
    @switch (activePanel()) {
      @case ('file') {
        <app-knowledge-upload-file-panel
          [assistantId]="assistantId"
          (created)="onCreated()"
        ></app-knowledge-upload-file-panel>
      }
      @case ('text') {
        <app-knowledge-custom-data-panel
          [assistantId]="assistantId"
          (created)="onCreated()"
        ></app-knowledge-custom-data-panel>
      }
      @case ('url') {
        <app-knowledge-url-panel
          [assistantId]="assistantId"
          (created)="onCreated()"
        ></app-knowledge-url-panel>
      }
    }

    <div class="border-t border-subtle"></div>

    <!-- Sources list -->
    <app-knowledge-sources-list
      [assistantId]="assistantId"
      [refreshTick]="listRefreshTick()"
    ></app-knowledge-sources-list>
  } @else {
    <p class="text-sm text-muted">Save this assistant first to add knowledge sources.</p>
  }
</div>
