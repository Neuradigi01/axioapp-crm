<div class="mx-auto max-w-7xl p-6 space-y-5">
  <header>
    <h1 class="text-lg font-semibold text-zinc-900">Billing &amp; POS</h1>
    <p class="mt-0.5 text-xs text-zinc-500">
      Create invoices, manage payments &amp; generate bills
    </p>
  </header>

  <div class="overflow-x-auto border-b border-zinc-200">
    <nav class="-mb-px flex gap-6" aria-label="Tabs">
      @for (t of tabs; track t.id) {
        <button
          type="button"
          (click)="setTab(t.id)"
          [class]="
            'whitespace-nowrap border-b-2 px-1 py-3 text-sm font-medium transition-colors ' +
            (activeTab() === t.id
              ? 'border-zinc-900 text-zinc-900'
              : 'border-transparent text-zinc-500 hover:border-zinc-300 hover:text-zinc-700')
          "
        >
          {{ t.label }}
        </button>
      }
    </nav>
  </div>

  @switch (activeTab()) {
    @case ('invoices') {
      <app-fp-billing-invoices />
    }
    @case ('pos') {
      <app-fp-billing-pos />
    }
  }
</div>
