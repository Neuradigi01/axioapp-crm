<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-accent/50 px-4 py-8 overflow-y-auto"
>
  <div class="w-full max-w-2xl rounded-lg bg-surface p-5 shadow-xl">
    <header class="mb-4">
      <h2 class="text-lg font-semibold text-default">Add new product</h2>
      <p class="mt-1 text-xs text-muted">
        Creates a catalog entry and an inventory row in one transaction. Image upload is optional
        and runs after the create.
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-3">
      <!-- Top row: image picker + core fields -->
      <div class="flex flex-col gap-4 sm:flex-row">
        <!-- Image picker -->
        <div class="flex flex-col items-center gap-2">
          <label
            class="flex h-32 w-32 cursor-pointer items-center justify-center overflow-hidden rounded-md border border-dashed border-subtle bg-surface-2 text-3xl text-faint hover:bg-surface-2"
          >
            @if (previewUrl(); as url) {
              <img [src]="url" alt="Cover preview" class="h-full w-full object-cover" />
            } @else {
              📷
            }
            <input type="file" accept="image/*" (change)="onFile($event)" class="hidden" />
          </label>
          @if (selectedFile(); as file) {
            <button
              type="button"
              (click)="clearFile()"
              class="text-[10px] text-muted hover:text-default"
            >
              Remove image
            </button>
            <span class="max-w-[8rem] truncate text-[10px] text-muted">
              {{ file.name }}
            </span>
          } @else {
            <span class="text-[10px] text-muted">Click to upload</span>
          }
        </div>

        <!-- Name + SKU + Category -->
        <div class="flex-1 space-y-3">
          <label class="block text-sm">
            <span class="block text-xs font-medium text-muted">Product name</span>
            <input
              type="text"
              formControlName="name"
              placeholder="e.g. 3-Seater Sofa — Charcoal Linen"
              class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
            />
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="block text-sm">
              <span class="block text-xs font-medium text-muted">SKU</span>
              <input
                type="text"
                formControlName="sku"
                placeholder="SOF-003"
                class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm font-mono uppercase shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
              />
            </label>
            <label class="block text-sm">
              <span class="block text-xs font-medium text-muted">Category</span>
              <select
                formControlName="category"
                class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
              >
                <option [ngValue]="null">— none —</option>
                @for (c of categories; track c) {
                  <option [ngValue]="c">{{ c }}</option>
                }
              </select>
            </label>
          </div>
        </div>
      </div>

      <!-- Attributes -->
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Material</span>
          <select
            formControlName="material"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          >
            <option [ngValue]="null">— none —</option>
            @for (m of materials; track m) {
              <option [ngValue]="m">{{ m }}</option>
            }
          </select>
        </label>
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Color</span>
          <input
            type="text"
            formControlName="color"
            placeholder="Walnut, Charcoal…"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </label>
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Finish</span>
          <input
            type="text"
            formControlName="finish"
            placeholder="Polished, Matte…"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </label>
      </div>

      <!-- Warehouse + Price + Reorder -->
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Warehouse</span>
          <select
            formControlName="warehouse_id"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          >
            @for (w of warehouses; track w.id) {
              <option [ngValue]="w.id">{{ w.name }}</option>
            }
          </select>
        </label>
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Price (₹)</span>
          <input
            type="number"
            min="0"
            step="0.01"
            formControlName="price"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </label>
        <label class="block text-sm">
          <span class="block text-xs font-medium text-muted">Reorder level</span>
          <input
            type="number"
            min="0"
            formControlName="reorder_level"
            class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
          />
        </label>
      </div>

      <!-- Description -->
      <label class="block text-sm">
        <span class="block text-xs font-medium text-muted">Description</span>
        <textarea
          rows="2"
          formControlName="description"
          class="mt-1 block w-full resize-none rounded-md border border-subtle bg-surface px-3 py-2 text-sm shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
        ></textarea>
      </label>

      <label class="flex items-center gap-2 text-sm text-default">
        <input
          type="checkbox"
          formControlName="is_best_seller"
          class="h-4 w-4 rounded border-subtle text-default focus:ring-accent"
        />
        Mark as best seller
      </label>

      @if (submitError(); as err) {
        <div class="rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
          {{ err }}
        </div>
      }

      <div class="flex items-center justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="close()"
          class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm font-medium text-default hover:bg-surface-2"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:bg-accent disabled:opacity-50"
        >
          {{ submitting() ? 'Saving…' : 'Add product' }}
        </button>
      </div>
    </form>
  </div>
</div>
