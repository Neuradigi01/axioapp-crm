<div class="px-6 py-6">
  <header class="mb-6">
    <h1 class="text-2xl font-semibold text-zinc-900">Inventory &amp; Warehouse</h1>
    <p class="mt-1 text-sm text-zinc-500">
      Track stock across stores, set reorder levels, watch alerts.
    </p>
  </header>

  <!-- Tabs -->
  <div class="mb-4 overflow-x-auto border-b border-zinc-200">
    <nav class="-mb-px flex gap-6" aria-label="Tabs">
      @for (t of tabs; track t.id) {
        <button
          type="button"
          (click)="setTab(t.id)"
          [class]="
            'whitespace-nowrap border-b-2 px-1 py-3 text-sm font-medium transition-colors ' +
            (activeTab() === t.id
              ? 'border-zinc-900 text-zinc-900'
              : 'border-transparent text-zinc-500 hover:border-zinc-300 hover:text-zinc-700')
          "
        >
          {{ t.label }}
        </button>
      }
    </nav>
  </div>

  @switch (activeTab()) {
    @case ('products') {
      <app-fp-inventory-products />
    }
    @case ('alerts') {
      <app-fp-inventory-alerts />
    }
  }
</div>
