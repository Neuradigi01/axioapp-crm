<div class="flex min-h-screen flex-col items-center justify-center bg-app px-6">
  <div class="w-full max-w-md rounded-xl border border-subtle bg-surface p-8 text-center shadow-sm">
    @if (loading()) {
      <p class="text-sm text-muted">Loading your profile…</p>
    } @else if (error()) {
      <h1 class="text-2xl font-semibold text-rose-700">Something went wrong</h1>
      <p class="mt-2 text-sm text-muted">{{ error() }}</p>
    } @else if (user(); as u) {
      <h1 class="text-2xl font-semibold text-default">Welcome, {{ u.full_name }}</h1>
      <p class="mt-2 text-sm text-muted">
        Signed in as <span class="font-medium text-default">{{ u.role_name }}</span>
      </p>
      <p class="mt-1 text-xs text-faint">{{ u.email }}</p>
      <p class="mt-6 text-sm text-faint">FurnitureCRM is being built one step at a time.</p>
    }
  </div>
</div>
