<app-form-card title="Access Rights" subtitle="Manage route access for this sub-admin" icon="admin_panel_settings" [showBackButton]="true" (backClicked)="goBack()">
  @if (isLoading()) {
    <div class="access-rights__loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <div class="access-rights__content">
      @if (adminDetail(); as admin) {
        <div class="access-rights__info">
          <span class="access-rights__info-label">{{ admin.name }}</span>
          <span class="access-rights__info-id">{{ admin.admin_user_id }}</span>
        </div>
      }

      <div class="access-rights__routes-actions">
        <button mat-stroked-button type="button" (click)="selectAll()">
          <mat-icon>select_all</mat-icon>
          Select All
        </button>
        <button mat-stroked-button type="button" (click)="deselectAll()">
          <mat-icon>deselect</mat-icon>
          Deselect All
        </button>
      </div>

      <div class="access-rights__route-tree">
        @for (node of routeTree(); track node.route.id) {
          <div class="access-rights__route-parent">
            <mat-checkbox
              [checked]="node.checked"
              [indeterminate]="node.indeterminate"
              [disabled]="node.route.is_compulsory"
              (change)="toggleParent(node)">
              {{ node.route.name }}
            </mat-checkbox>

            @if (node.children.length > 0) {
              <div class="access-rights__route-children">
                @for (child of node.children; track child.route.id) {
                  <mat-checkbox
                    [checked]="child.checked"
                    [disabled]="child.route.is_compulsory"
                    (change)="toggleChild(node, child)">
                    {{ child.route.name }}
                  </mat-checkbox>
                }
              </div>
            }
          </div>
        }
      </div>

      <button
        mat-flat-button
        class="access-rights__submit"
        (click)="onSave()"
        [disabled]="isSaving()">
        @if (isSaving()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Save
        }
      </button>
    </div>
  }
</app-form-card>
