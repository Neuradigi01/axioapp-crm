<h2 mat-dialog-title>{{ isEditMode ? 'Edit Route' : 'Add Route' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="route-dialog__form">
    <div class="route-dialog__row">
      <mat-form-field appearance="outline">
        <mat-label>Control ID</mat-label>
        <input matInput formControlName="control_id" placeholder="e.g. admin_dashboard" />
        <mat-error><app-validation-message [control]="form.controls['control_id']" label="Control ID" /></mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Display name" />
        <mat-error><app-validation-message [control]="form.controls['name']" label="Name" /></mat-error>
      </mat-form-field>
    </div>

    <div class="route-dialog__row">
      <mat-form-field appearance="outline">
        <mat-label>Path</mat-label>
        <input matInput formControlName="path" placeholder="e.g. dashboard" />
        <mat-error><app-validation-message [control]="form.controls['path']" label="Path" /></mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>URL</mat-label>
        <input matInput formControlName="url" placeholder="e.g. /admin/dashboard" />
        <mat-error><app-validation-message [control]="form.controls['url']" label="URL" /></mat-error>
      </mat-form-field>
    </div>

    <div class="route-dialog__row">
      <mat-form-field appearance="outline">
        <mat-label>Parent ID</mat-label>
        <input matInput type="number" formControlName="parent_id" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nav Parent ID</mat-label>
        <input matInput type="number" formControlName="nav_parent_id" />
      </mat-form-field>
    </div>

    <div class="route-dialog__row">
      <mat-form-field appearance="outline">
        <mat-label>User Type</mat-label>
        <mat-select formControlName="user_type">
          @for (opt of userTypeOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Order No</mat-label>
        <input matInput type="number" formControlName="order_no" />
      </mat-form-field>
    </div>

    <div class="route-dialog__row">
      <mat-form-field appearance="outline">
        <mat-label>Mat Icon</mat-label>
        <input matInput formControlName="mat_icon" placeholder="e.g. dashboard" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" placeholder="Optional description" rows="2"></textarea>
    </mat-form-field>

    <div class="route-dialog__checkboxes">
      <mat-checkbox formControlName="is_nav_menu_item">Is Nav Menu Item</mat-checkbox>
      <mat-checkbox formControlName="is_compulsory">Is Compulsory</mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (isEditMode) {
    <button mat-button color="warn" (click)="onDelete()" [disabled]="isSaving()">
      <mat-icon>delete</mat-icon>
      Delete
    </button>
  }
  <span class="route-dialog__spacer"></span>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onSave()" [disabled]="isSaving()">
    {{ isEditMode ? 'Update' : 'Create' }}
  </button>
</mat-dialog-actions>
