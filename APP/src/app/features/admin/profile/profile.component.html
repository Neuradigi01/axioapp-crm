<app-form-card title="My Profile" subtitle="View and update your profile information" icon="person">
  @if (isLoading()) {
    <div class="profile__loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <!-- Profile Image Upload -->
    <div class="profile__avatar-section">
      <div class="profile__avatar-wrapper" (click)="fileInput.click()">
        @if (profileImageUrl()) {
          <img [src]="profileImageUrl()" alt="Profile" class="profile__avatar-img" />
        } @else {
          <div class="profile__avatar-placeholder">
            <mat-icon>person</mat-icon>
          </div>
        }
        <div class="profile__avatar-overlay">
          @if (isUploading()) {
            <mat-spinner diameter="24" color="accent"></mat-spinner>
          } @else {
            <mat-icon>photo_camera</mat-icon>
          }
        </div>
        <input
          #fileInput
          type="file"
          accept="image/jpeg,image/png,image/gif,image/bmp,image/webp"
          hidden
          (change)="onFileSelected($event)" />
      </div>
      @if (profileImageUrl()) {
        <button
          mat-icon-button
          type="button"
          class="profile__avatar-remove"
          matTooltip="Remove photo"
          (click)="onRemoveImage()"
          [disabled]="isUploading()">
          <mat-icon>close</mat-icon>
        </button>
      }
      <span class="profile__avatar-hint">Click to upload photo (max 2 MB)</span>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile__form">
      <!-- Admin User ID (readonly) -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Admin User ID</mat-label>
        <input matInput formControlName="admin_user_id" />
      </mat-form-field>

      <!-- Name (readonly) -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-icon matPrefix>badge</mat-icon>
      </mat-form-field>

      <!-- Email (editable) -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
        <mat-icon matPrefix>email</mat-icon>
        <mat-error><app-validation-message [control]="profileForm.controls['email']" label="Email" /></mat-error>
      </mat-form-field>

      <!-- Mobile (editable) -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mobile Number</mat-label>
        <input matInput formControlName="mobile_no" type="tel" />
        <mat-icon matPrefix>phone</mat-icon>
      </mat-form-field>

      <!-- Submit -->
      <button
        mat-flat-button
        type="submit"
        class="profile__submit"
        [disabled]="isSaving()">
        @if (isSaving()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Save Changes
        }
      </button>
    </form>
  }
</app-form-card>
