<h2 mat-dialog-title>Edit User Profile</h2>

<mat-dialog-content>
  <form [formGroup]="form" id="editProfileForm" class="edit-profile-dialog__form">
    <mat-form-field appearance="outline" class="edit-profile-dialog__field">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="first_name" />
      <mat-error>
        <app-validation-message [control]="form.controls['first_name']" label="First name" />
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="edit-profile-dialog__field">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="last_name" />
      <mat-error>
        <app-validation-message [control]="form.controls['last_name']" label="Last name" />
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="edit-profile-dialog__field">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
      <mat-error>
        <app-validation-message [control]="form.controls['email']" label="Email" />
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="edit-profile-dialog__field">
      <mat-label>Mobile No</mat-label>
      <input matInput formControlName="mobile_no" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid || isSaving()" (click)="onConfirm()">
    Save Changes
  </button>
</mat-dialog-actions>
