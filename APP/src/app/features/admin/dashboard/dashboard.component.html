<div class="admin-dashboard">
  <app-dashboard-tiles [tiles]="tiles()" />

  <mat-card class="admin-dashboard__table-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Recent Registrations</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (recentRegistrations().length > 0) {
        <div class="admin-dashboard__table-wrapper">
          <table mat-table [dataSource]="recentRegistrations()" class="admin-dashboard__table">
            <ng-container matColumnDef="user_id">
              <th mat-header-cell *matHeaderCellDef>User ID</th>
              <td mat-cell *matCellDef="let row">{{ row.user_id }}</td>
            </ng-container>

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let row">{{ row.name }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let row">{{ row.email }}</td>
            </ng-container>

            <ng-container matColumnDef="mobile_no">
              <th mat-header-cell *matHeaderCellDef>Mobile</th>
              <td mat-cell *matCellDef="let row">{{ row.mobile_no || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="joining_date">
              <th mat-header-cell *matHeaderCellDef>Joined</th>
              <td mat-cell *matCellDef="let row">{{ row.joining_date | date:'mediumDate' }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      } @else {
        <p class="admin-dashboard__empty">No recent registrations.</p>
      }
    </mat-card-content>
  </mat-card>

  <app-dashboard-news />
</div>
