<h2 mat-dialog-title>{{ isEditMode ? 'Edit News' : 'Add News' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="news-dialog__form">
    <mat-form-field appearance="outline">
      <mat-label>Heading</mat-label>
      <input matInput formControlName="heading" placeholder="Enter heading" />
      <mat-error><app-validation-message [control]="form.controls['heading']" label="Heading" /></mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Details</mat-label>
      <textarea matInput formControlName="details" placeholder="Enter details" rows="4"></textarea>
      <mat-error><app-validation-message [control]="form.controls['details']" label="Details" /></mat-error>
    </mat-form-field>

    <div class="news-dialog__row">
      <mat-form-field appearance="outline">
        <mat-label>Priority</mat-label>
        <input matInput type="number" formControlName="priority" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>User Type</mat-label>
        <mat-select formControlName="user_type">
          @for (opt of userTypeOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onSave()" [disabled]="isSaving()">
    {{ isEditMode ? 'Update' : 'Create' }}
  </button>
</mat-dialog-actions>
