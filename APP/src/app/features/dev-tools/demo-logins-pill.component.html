@if (hasPresets()) {
  <button
    type="button"
    (click)="toggle()"
    class="fixed bottom-24 right-4 z-[9999] flex items-center gap-2 rounded-full bg-app px-4 py-2 text-sm font-medium text-white shadow-lg hover:bg-surface-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
    aria-label="Open demo logins"
  >
    <span aria-hidden="true">🛠</span>
    <span>Demo logins</span>
  </button>

  @if (open()) {
    <div
      (click)="close()"
      (keydown)="onBackdropKeydown($event)"
      class="fixed inset-0 z-[9998]"
      role="presentation"
      tabindex="-1"
    ></div>

    <div
      class="fixed bottom-36 right-4 z-[9999] w-72 overflow-hidden rounded-xl border border-subtle bg-surface shadow-2xl"
      role="dialog"
      aria-label="Demo logins"
    >
      <div class="flex items-center justify-between border-b border-subtle px-4 py-3">
        <div class="flex items-center gap-2 text-sm font-semibold text-default">
          <span aria-hidden="true">🛠</span>
          Demo logins
        </div>
        <button
          type="button"
          (click)="close()"
          class="rounded p-1 text-faint hover:bg-surface-2 hover:text-default"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <ul class="max-h-72 overflow-y-auto py-1">
        @for (p of presets(); track p.identifier) {
          <li>
            <button
              type="button"
              (click)="pick(p)"
              class="flex w-full items-center justify-between px-4 py-2 text-left text-sm text-default hover:bg-surface-2 focus:bg-surface-2 focus:outline-none"
            >
              <span class="truncate">{{ p.label }}</span>
              <span class="ml-2 shrink-0 font-mono text-[11px] text-faint">{{ p.orgSlug }}</span>
            </button>
          </li>
        }
      </ul>

      @if (selected(); as sel) {
        <div class="border-t border-subtle bg-surface-2 px-4 py-2 text-[11px] text-muted">
          Active org: <span class="font-mono font-medium text-default">{{ sel.orgSlug }}</span>
        </div>
      }
    </div>
  }
}
