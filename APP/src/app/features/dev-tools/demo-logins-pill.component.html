@if (hasPresets()) {
  <button
    type="button"
    (click)="toggle()"
    class="fixed bottom-4 right-4 z-50 flex items-center gap-2 rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-500"
    aria-label="Open demo logins"
  >
    <span aria-hidden="true">🛠</span>
    <span>Demo logins</span>
  </button>

  @if (open()) {
    <div
      (click)="close()"
      (keydown)="onBackdropKeydown($event)"
      class="fixed inset-0 z-40 bg-transparent"
      role="presentation"
      tabindex="-1"
    ></div>

    <div
      class="fixed bottom-16 right-4 z-50 w-72 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl"
      role="dialog"
      aria-label="Demo logins"
    >
      <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
        <div class="flex items-center gap-2 text-sm font-semibold text-slate-900">
          <span aria-hidden="true">🛠</span>
          Demo logins
        </div>
        <button
          type="button"
          (click)="close()"
          class="rounded p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <ul class="max-h-72 overflow-y-auto py-1">
        @for (p of presets(); track p.identifier) {
          <li>
            <button
              type="button"
              (click)="pick(p)"
              class="flex w-full items-center justify-between px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-100 focus:bg-slate-100 focus:outline-none"
            >
              <span class="truncate">{{ p.label }}</span>
              <span class="ml-2 shrink-0 font-mono text-[11px] text-slate-400">{{ p.orgSlug }}</span>
            </button>
          </li>
        }
      </ul>

      @if (selected(); as sel) {
        <div class="border-t border-slate-200 bg-slate-50 px-4 py-2 text-[11px] text-slate-500">
          Active org: <span class="font-mono font-medium text-slate-700">{{ sel.orgSlug }}</span>
        </div>
      }
    </div>
  }
}
