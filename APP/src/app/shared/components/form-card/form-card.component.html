<div class="form-card">
  @if (title()) {
    <div class="form-card__header">
      <div class="form-card__header-content">
        @if (showBackButton()) {
          <button
            mat-icon-button
            class="form-card__back-btn"
            (click)="onBackClick()"
            aria-label="Go back"
          >
            <mat-icon>arrow_back</mat-icon>
          </button>
        }
        @if (icon()) {
          <mat-icon class="form-card__icon">{{ icon() }}</mat-icon>
        }
        <div class="form-card__titles">
          <h2 class="form-card__title">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="form-card__subtitle">{{ subtitle() }}</p>
          }
        </div>
      </div>
    </div>
  }

  <div class="form-card__body">
    <ng-content></ng-content>
  </div>

  <div class="form-card__actions">
    <ng-content select="[form-card-actions]"></ng-content>
  </div>
</div>
