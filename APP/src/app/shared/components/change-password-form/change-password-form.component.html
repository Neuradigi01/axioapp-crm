<app-form-card title="Change Password" subtitle="Update your account password" icon="lock">
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="change-password__form">
    <!-- Current Password -->
    <mat-form-field appearance="outline" class="full-width" appPasswordToggle #oldPwToggle="passwordToggle">
      <mat-label>Current Password</mat-label>
      <input
        matInput
        formControlName="old_password"
        [type]="oldPwToggle.type()"
        autocomplete="current-password" />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="oldPwToggle.toggle()"
        [attr.aria-label]="oldPwToggle.ariaLabel()">
        <mat-icon>{{ oldPwToggle.icon() }}</mat-icon>
      </button>
      <mat-error><app-validation-message [control]="passwordForm.controls['old_password']" label="Current password" /></mat-error>
    </mat-form-field>

    <!-- New Password -->
    <mat-form-field appearance="outline" class="full-width" appPasswordToggle #newPwToggle="passwordToggle">
      <mat-label>New Password</mat-label>
      <input
        matInput
        formControlName="new_password"
        [type]="newPwToggle.type()"
        autocomplete="new-password" />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="newPwToggle.toggle()"
        [attr.aria-label]="newPwToggle.ariaLabel()">
        <mat-icon>{{ newPwToggle.icon() }}</mat-icon>
      </button>
      <mat-error><app-validation-message [control]="passwordForm.controls['new_password']" label="New password" /></mat-error>
    </mat-form-field>

    <!-- Confirm Password -->
    <mat-form-field appearance="outline" class="full-width" appPasswordToggle #cpToggle="passwordToggle">
      <mat-label>Confirm New Password</mat-label>
      <input
        matInput
        formControlName="confirm_password"
        [type]="cpToggle.type()"
        autocomplete="new-password" />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="cpToggle.toggle()"
        [attr.aria-label]="cpToggle.ariaLabel()">
        <mat-icon>{{ cpToggle.icon() }}</mat-icon>
      </button>
      <mat-error><app-validation-message [control]="passwordForm.controls['confirm_password']" label="Confirm password" /></mat-error>
    </mat-form-field>

    <!-- Submit -->
    <button
      mat-flat-button
      type="submit"
      class="change-password__submit"
      [disabled]="isLoading()">
      @if (isLoading()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        Change Password
      }
    </button>
  </form>
</app-form-card>
