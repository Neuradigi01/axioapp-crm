<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neuradigi CRM</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Pre-hydration theme setter. Runs before any stylesheet link so the
      very first paint is already in the correct theme (no FOUC). Reads
      the same localStorage key ThemeService uses (`app_theme`); values
      are 'light' | 'dark' | 'system'. `system` resolves to OS preference.
    -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('app_theme');
          var t =
            c === 'dark' || c === 'light'
              ? c
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          var a = localStorage.getItem('app_accent');
          if (a) document.documentElement.setAttribute('data-accent', a);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
