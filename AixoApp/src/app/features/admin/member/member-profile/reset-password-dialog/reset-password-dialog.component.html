<h2 mat-dialog-title>Reset User Password</h2>

<mat-dialog-content>
  <form [formGroup]="form" id="resetPasswordForm">
    <mat-form-field appearance="outline" appPasswordToggle #pwToggle="passwordToggle" class="reset-password-dialog__field">
      <mat-label>New Password</mat-label>
      <input matInput [type]="pwToggle.type()" formControlName="new_password" />
      <button mat-icon-button matSuffix type="button" (click)="pwToggle.toggle()" [attr.aria-label]="pwToggle.ariaLabel()">
        <mat-icon>{{ pwToggle.icon() }}</mat-icon>
      </button>
      <mat-error>
        <app-validation-message [control]="form.controls['new_password']" label="Password" />
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid || isSaving()" (click)="onConfirm()">
    Reset Password
  </button>
</mat-dialog-actions>
