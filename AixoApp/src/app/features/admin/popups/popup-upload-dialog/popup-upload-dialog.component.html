<h2 mat-dialog-title>Upload Popup</h2>

<mat-dialog-content>
  <div class="popup-upload-dialog__form">
    <div class="popup-upload-dialog__file-area">
      <input
        type="file"
        [accept]="acceptTypes"
        (change)="onFileSelected($event)"
        #fileInput
        hidden />
      <button mat-stroked-button (click)="fileInput.click()" type="button">
        <mat-icon>cloud_upload</mat-icon>
        Choose Image
      </button>
      @if (selectedFile) {
        <span class="popup-upload-dialog__file-name">{{ selectedFile.name }}</span>
      }
    </div>

    @if (previewUrl()) {
      <div class="popup-upload-dialog__preview">
        <img [src]="previewUrl()" alt="Preview" />
      </div>
    }

    <mat-form-field appearance="outline">
      <mat-label>Title (optional)</mat-label>
      <input matInput [(ngModel)]="title" placeholder="Enter popup title" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>User Type</mat-label>
      <mat-select [(ngModel)]="userType">
        @for (opt of userTypeOptions; track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onUpload()" [disabled]="!selectedFile || isSaving()">
    Upload
  </button>
</mat-dialog-actions>
