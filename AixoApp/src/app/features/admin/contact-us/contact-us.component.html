<div class="contact-us">
  <app-page-layout
    [formGroup]="searchForm"
    [data]="data()"
    [dataCount]="dataCount()"
    [isFiltered]="isFiltered()"
    [pageTitle]="'Contact Us'"
    [pageSubtitle]="'View contact form submissions'"
    [tableId]="'tblContactUs'"
    (submitEvent)="onSubmit()"
    (clearEvent)="clearFilters()"
    (pageEvent)="onPageChange($event)">

    <ng-template #requiredFilters>
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput formControlName="search" placeholder="Name, Email, Subject" />
      </mat-form-field>
    </ng-template>

    <ng-template #filters>
      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          @for (opt of typeOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </ng-template>

    <ng-template #tableHeader>
      <tr>
        <th>SR#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Type</th>
        <th>Subject</th>
        <th>Date</th>
        <th class="contact-us__actions-col">Actions</th>
      </tr>
    </ng-template>

    <ng-template #tableBody let-d let-srNo="srNo">
      <tr>
        <td>{{ srNo }}</td>
        <td>{{ d.name }}</td>
        <td>{{ d.email }}</td>
        <td>
          @let badge = getTypeBadge(d.type);
          <span class="contact-us__badge" [style.color]="badge.color" [style.background-color]="badge.bgVar">
            {{ d.type }}
          </span>
        </td>
        <td>{{ d.subject }}</td>
        <td>{{ d.created_at | date:'mediumDate' }}</td>
        <td class="contact-us__actions-col">
          <button mat-icon-button matTooltip="View Message" (click)="viewDetail(d)">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </tr>
    </ng-template>
  </app-page-layout>
</div>
