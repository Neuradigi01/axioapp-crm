<app-form-card title="Fernet Encryption" subtitle="Encrypt or decrypt text using Fernet" icon="lock">
  <mat-form-field appearance="outline" class="encryption__input">
    <mat-label>Enter text</mat-label>
    <textarea matInput rows="4" placeholder="Enter text to encrypt or decrypt"
      [ngModel]="inputText()" (ngModelChange)="inputText.set($event)"></textarea>
  </mat-form-field>

  <div class="encryption__actions">
    <button mat-flat-button color="primary" (click)="encrypt()" [disabled]="isLoading() || !inputText().trim()">
      @if (isLoading()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <ng-container>
          <mat-icon>enhanced_encryption</mat-icon>
          Encrypt
        </ng-container>
      }
    </button>

    <button mat-flat-button color="accent" (click)="decrypt()" [disabled]="isLoading() || !inputText().trim()">
      @if (isLoading()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <ng-container>
          <mat-icon>no_encryption</mat-icon>
          Decrypt
        </ng-container>
      }
    </button>

    <button mat-stroked-button (click)="clear()" [disabled]="isLoading()" matTooltip="Clear all">
      <mat-icon>clear_all</mat-icon>
      Clear
    </button>
  </div>

  @if (resultText()) {
    <div class="encryption__result">
      <div class="encryption__result-header">
        <span class="encryption__result-label">Result</span>
        <button mat-icon-button matTooltip="Copy to clipboard" (click)="copyResult()">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
      <div class="encryption__result-text">{{ resultText() }}</div>
    </div>
  }
</app-form-card>
