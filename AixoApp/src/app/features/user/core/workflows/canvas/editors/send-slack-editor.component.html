<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Slack template</label>
    <input
      type="text"
      [ngModel]="templateId()"
      (ngModelChange)="onTemplateChange($event)"
      placeholder="template UUID"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted font-mono"
    />
    @if (!templateId()) {
      <p class="text-[10px] text-red-500 mt-1">Template is required.</p>
    }
  </div>
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1">Slack channel</label>
    <input
      type="text"
      [ngModel]="slackChannel()"
      (ngModelChange)="onChannelChange($event)"
      placeholder="#crm-alerts"
      class="w-full text-xs px-2 py-1.5 rounded border border-subtle focus:outline-none focus:border-muted"
    />
    @if (!slackChannel().trim()) {
      <p class="text-[10px] text-red-500 mt-1">Channel is required.</p>
    } @else {
      <p class="text-[10px] text-muted mt-1">
        Must match a channel name configured in the Slack integration.
      </p>
    }
  </div>
</div>
