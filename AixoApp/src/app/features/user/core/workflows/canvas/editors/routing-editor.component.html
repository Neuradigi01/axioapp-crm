<div class="space-y-3">
  <div class="bg-zinc-50 border border-zinc-200 rounded px-2 py-1.5">
    <span class="text-[10px] uppercase tracking-wider text-zinc-500">Mode</span>
    <p class="text-xs font-medium text-zinc-700 capitalize">
      {{ mode().replaceAll('_', ' ') }}
    </p>
  </div>

  @if (!isSpecificUser()) {
    <div>
      <label class="block text-[11px] font-medium text-zinc-600 mb-1">Pool type</label>
      <select
        [ngModel]="poolType()"
        (ngModelChange)="onPoolTypeChange($event)"
        class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
      >
        <option value="role">By role</option>
        <option value="team">By team</option>
        <option value="explicit">Explicit user list</option>
      </select>
    </div>

    <div>
      <label class="block text-[11px] font-medium text-zinc-600 mb-1">
        Pool value
        @if (poolType() === 'explicit') {
          <span class="text-zinc-400">(comma-separated user UUIDs)</span>
        }
      </label>
      <input
        type="text"
        [ngModel]="poolValue()"
        (ngModelChange)="onPoolValueChange($event)"
        [placeholder]="
          poolType() === 'role'
            ? 'role name (e.g. Sales rep)'
            : poolType() === 'team'
              ? 'team id'
              : 'uuid1,uuid2,…'
        "
        class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
      />
      @if (!poolValue().trim()) {
        <p class="text-[10px] text-rose-600 mt-1">Pool value is required.</p>
      }
    </div>
  } @else {
    <div>
      <label class="block text-[11px] font-medium text-zinc-600 mb-1"> Specific user UUID </label>
      <input
        type="text"
        [ngModel]="specificUserId()"
        (ngModelChange)="onSpecificUserChange($event)"
        placeholder="uuid"
        class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500 font-mono"
      />
      @if (!specificUserId().trim()) {
        <p class="text-[10px] text-rose-600 mt-1">User UUID is required.</p>
      }
    </div>
  }

  <div>
    <label class="block text-[11px] font-medium text-zinc-600 mb-1">Attach to</label>
    <select
      [ngModel]="target()"
      (ngModelChange)="onTargetChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
    >
      <option value="lead.assigned_to">Lead owner</option>
      <option value="contact.assigned_to">Contact owner</option>
    </select>
  </div>

  <div>
    <label class="block text-[11px] font-medium text-zinc-600 mb-1">Fallback</label>
    <select
      [ngModel]="fallback()"
      (ngModelChange)="onFallbackChange($event)"
      class="w-full text-xs px-2 py-1.5 rounded border border-zinc-300 focus:outline-none focus:border-zinc-500"
    >
      <option value="workflow.owner">Workflow owner</option>
      <option value="leave_unassigned">Leave unassigned</option>
      <option value="skip">Skip the run</option>
    </select>
  </div>
</div>
