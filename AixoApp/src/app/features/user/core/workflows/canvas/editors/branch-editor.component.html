<div class="space-y-3">
  <div>
    <label class="block text-[11px] font-medium text-muted mb-1"> Yes-branch conditions </label>
    <p class="text-[10px] text-muted mb-2">
      When the conditions evaluate to true, the run follows the
      <code class="text-emerald-400">yes</code> edge; otherwise it follows the
      <code class="text-pink-600">no</code> edge.
    </p>
    <app-conditions-builder
      [tree]="conditions()"
      [variableGroups]="variableGroups"
      (treeChange)="onConditionsChange($event)"
    />
    @if (!conditions()) {
      <p class="text-[10px] text-red-500 mt-1">At least one condition is required.</p>
    }
  </div>
</div>
