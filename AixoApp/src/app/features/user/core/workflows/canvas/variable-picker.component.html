<div class="border border-subtle rounded bg-surface-2">
  <div class="px-2.5 py-1.5 border-b border-subtle relative">
    <lucide-icon
      name="Search"
      class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-faint"
    ></lucide-icon>
    <input
      type="search"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      placeholder="Search variables…"
      class="w-full pl-6 pr-1 py-0.5 text-[11px] bg-transparent focus:outline-none"
    />
  </div>
  <div class="max-h-48 overflow-y-auto">
    @for (group of filtered(); track group.label) {
      <div class="px-2 pt-2 pb-1">
        <h4 class="text-[10px] uppercase tracking-wider text-muted font-semibold mb-1">
          {{ group.label }}
        </h4>
        <div class="space-y-0.5">
          @for (path of group.paths; track path.path) {
            <button
              type="button"
              class="w-full text-left text-[11px] px-2 py-1 rounded hover:bg-surface"
              [title]="path.description"
              (click)="onPathClick(path.path)"
            >
              <code class="text-sky-700">{{ path.path }}</code>
            </button>
          }
        </div>
      </div>
    }
    @if (filtered().length === 0) {
      <p class="text-[11px] italic text-muted px-2 py-2">No variables match.</p>
    }
  </div>
</div>
