@if (entry(); as e) {
  <div class="mt-2 rounded-md border border-subtle bg-surface-2 px-3 py-2 text-xs">
    <p class="font-medium text-default">{{ e.label }}</p>
    <p class="mt-0.5 text-muted">{{ e.description }}</p>
    <button
      type="button"
      (click)="toggleExpanded()"
      class="mt-2 inline-flex items-center gap-1 rounded text-[10px] font-medium uppercase tracking-wide text-muted hover:text-default"
    >
      @if (expanded()) {
        <lucide-icon name="chevron-down" size="10" />
        Hide sample payload
      } @else {
        <lucide-icon name="chevron-right" size="10" />
        Show sample payload
      }
    </button>
    @if (expanded()) {
      <pre
        class="mt-1 overflow-x-auto rounded bg-surface px-2 py-1.5 font-mono text-[11px] leading-snug text-default ring-1 border-subtle"
        >{{ samplePayloadJson() }}</pre
      >
      <p class="mt-1 text-[10px] text-muted">
        Reference any path above in conditions or templates — e.g.
        <code class="rounded bg-surface-2 px-1 font-mono">contact.email</code>.
      </p>
    }
  </div>
}
