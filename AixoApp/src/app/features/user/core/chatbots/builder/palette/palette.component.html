@if (canvas.paletteCollapsed()) {
  <!-- Collapsed rail — just an expand chevron so operators can
       reclaim ~280px of horizontal canvas space while they design. -->
  <div
    class="flex flex-col items-center h-full min-h-0 bg-surface border-r border-subtle w-[44px] flex-shrink-0 py-3 gap-3"
  >
    <button
      type="button"
      (click)="canvas.togglePalette()"
      class="p-1.5 rounded hover:bg-surface-2 text-muted hover:text-default"
      title="Expand palette"
      aria-label="Expand palette"
    >
      <lucide-icon name="chevron-right" size="16"></lucide-icon>
    </button>
    <div
      class="[writing-mode:vertical-rl] rotate-180 text-[11px] font-semibold uppercase tracking-widest text-muted"
    >
      Nodes
    </div>
  </div>
} @else {
  <div
    class="relative flex flex-col h-full min-h-0 bg-surface border-r border-subtle flex-shrink-0"
    [style.width.px]="canvas.paletteWidth()"
  >
    <!-- Tab bar + collapse -->
    <div class="flex items-stretch border-b border-subtle flex-shrink-0">
      <button
        type="button"
        (click)="tab.set('messages')"
        [class]="
          'flex-1 px-3 pt-3.5 pb-3 text-sm font-semibold transition-colors border-b-2 ' +
          (tab() === 'messages'
            ? 'text-default border-accent'
            : 'text-muted border-transparent hover:text-default')
        "
      >
        Messages
      </button>
      <button
        type="button"
        (click)="tab.set('actions')"
        [class]="
          'flex-1 px-3 pt-3.5 pb-3 text-sm font-semibold transition-colors border-b-2 ' +
          (tab() === 'actions'
            ? 'text-default border-accent'
            : 'text-muted border-transparent hover:text-default')
        "
      >
        Actions
      </button>
      <button
        type="button"
        (click)="canvas.togglePalette()"
        class="px-2 text-muted hover:text-default border-b-2 border-transparent"
        title="Collapse palette"
        aria-label="Collapse palette"
      >
        <lucide-icon name="chevron-left" size="16"></lucide-icon>
      </button>
    </div>

    <!-- Search -->
    <div class="px-3 pt-3 pb-2 flex-shrink-0">
      <div class="relative">
        <lucide-icon
          name="search"
          size="14"
          class="absolute left-2.5 top-1/2 -translate-y-1/2 text-muted"
        ></lucide-icon>
        <input
          type="text"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
          placeholder="Search nodes…"
          class="w-full pl-8 pr-3 py-1.5 text-xs bg-app text-default border border-subtle rounded-md placeholder:text-muted focus:outline-none focus:border-accent"
        />
      </div>
    </div>

    <!-- Tiles -->
    <div class="flex-1 min-h-0 overflow-y-auto px-3 py-2 chatbot-palette-scroll">
      <div class="grid grid-cols-2 gap-2 pb-4">
        @for (tile of filteredTiles(); track tile.type) {
          <button
            type="button"
            (click)="onTile(tile)"
            [title]="tile.hint"
            class="relative flex flex-col items-center justify-center gap-2 px-2 py-3.5 bg-app border border-subtle rounded-lg text-center transition-all hover:border-default hover:-translate-y-0.5"
          >
            @if (tile.beta) {
              <span
                class="absolute top-1 right-1 px-1 py-px text-[8px] font-bold uppercase tracking-wider bg-fuchsia-500/15 text-fuchsia-500 rounded"
              >
                Beta
              </span>
            }
            <lucide-icon [name]="tile.icon" size="20" class="text-muted"></lucide-icon>
            <span class="text-[11px] font-medium text-default leading-tight">
              {{ tile.label }}
            </span>
          </button>
        }
      </div>
      @if (filteredTiles().length === 0) {
        <p class="text-center text-xs text-muted py-8">No nodes match your search.</p>
      }
    </div>

    <!-- Resize handle — visible vertical grip on the right edge so
         operators can find it. Full-height hit target with a small
         centered dotted grip for affordance. -->
    <div
      (mousedown)="onResizeMouseDown($event)"
      class="group absolute top-0 right-[-4px] bottom-0 w-2 cursor-col-resize hover:bg-accent/20 z-10 flex items-center justify-center"
      title="Drag to resize palette"
      aria-label="Resize palette"
    >
      <div
        class="w-1 h-8 rounded-full bg-subtle group-hover:bg-accent transition-colors flex flex-col items-center justify-center gap-1"
      >
        <span class="w-0.5 h-0.5 rounded-full bg-muted group-hover:bg-white"></span>
        <span class="w-0.5 h-0.5 rounded-full bg-muted group-hover:bg-white"></span>
        <span class="w-0.5 h-0.5 rounded-full bg-muted group-hover:bg-white"></span>
      </div>
    </div>
  </div>
}
