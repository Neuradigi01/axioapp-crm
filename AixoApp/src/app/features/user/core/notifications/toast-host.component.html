@if (toasts().length > 0) {
  <div
    class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-80 flex-col gap-2"
    aria-live="polite"
    aria-atomic="true"
  >
    @for (t of toasts(); track t.id) {
      <button
        type="button"
        (click)="onClick(t)"
        class="pointer-events-auto flex w-full items-start gap-3 rounded-md border px-3 py-2.5 text-left shadow-sm transition hover:shadow-md"
        [class]="toneClass(t.tone)"
      >
        <span
          class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-white ring-1 ring-zinc-200"
        >
          <lucide-icon [name]="toneIcon(t.tone)" class="h-3.5 w-3.5 text-zinc-700" />
        </span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium text-zinc-900">{{ t.title }}</span>
          @if (t.body) {
            <span class="mt-0.5 block text-xs text-zinc-600">{{ t.body }}</span>
          }
        </span>
        <button
          type="button"
          (click)="onClose($event, t.id)"
          class="rounded p-0.5 text-zinc-400 transition hover:bg-zinc-100 hover:text-zinc-700"
          aria-label="Dismiss"
        >
          <lucide-icon name="x" class="h-3.5 w-3.5" />
        </button>
      </button>
    }
  </div>
}
