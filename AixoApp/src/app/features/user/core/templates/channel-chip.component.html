@let d = descriptor();
<span
  class="inline-flex max-w-full items-center gap-1 rounded-md px-1 py-0.5 text-[10px] leading-tight font-medium whitespace-nowrap ring-1 ring-inset md:px-1.5 md:text-xs"
  [class]="d.classes"
  [title]="d.label"
>
  <lucide-icon [name]="d.icon" size="11" class="shrink-0" />
  {{ d.label }}
</span>
