<div class="relative inline-block" (click)="$event.stopPropagation()">
  <button
    type="button"
    (click)="toggle($event)"
    class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-subtle bg-surface text-muted hover:bg-surface-2 hover:text-default"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    aria-label="Row actions"
  >
    <lucide-icon name="more-vertical" class="h-4 w-4"></lucide-icon>
  </button>

  @if (open()) {
    <div
      role="menu"
      class="absolute right-0 z-30 mt-1 w-48 overflow-hidden rounded-md border border-subtle bg-surface shadow-lg ring-1 ring-black/5"
    >
      @for (a of actions(); track a.key) {
        <button
          type="button"
          role="menuitem"
          (click)="run(a, $event)"
          class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm"
          [class.text-red-600]="a.destructive"
          [class.hover:bg-red-500/10]="a.destructive"
          [class.text-default]="!a.destructive"
          [class.hover:bg-surface-2]="!a.destructive"
        >
          <lucide-icon [name]="a.icon" class="h-4 w-4"></lucide-icon>
          <span>{{ a.label }}</span>
        </button>
      }
    </div>
  }
</div>

@if (pendingMessage(); as msg) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    (click)="cancelPending()"
  >
    <div
      class="w-full max-w-md rounded-lg bg-surface p-5 shadow-xl ring-1 ring-black/5"
      (click)="$event.stopPropagation()"
    >
      <h3 class="text-base font-semibold text-default">{{ msg.title }}</h3>
      <p class="mt-1 text-sm text-muted">{{ msg.body }}</p>
      <div class="mt-4 flex justify-end gap-2">
        <button
          type="button"
          (click)="cancelPending()"
          class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm text-default hover:bg-surface-2"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="confirmPending()"
          class="rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-500"
        >
          {{ msg.confirm }}
        </button>
      </div>
    </div>
  </div>
}

@if (clipboardFallbackUrl(); as url) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    (click)="dismissClipboardFallback()"
  >
    <div
      class="w-full max-w-lg rounded-lg bg-surface p-5 shadow-xl ring-1 ring-black/5"
      (click)="$event.stopPropagation()"
    >
      <h3 class="text-base font-semibold text-default">Copy public URL</h3>
      <p class="mt-1 text-sm text-muted">
        Your browser blocked the clipboard write. Copy the URL manually.
      </p>
      <input
        type="text"
        readonly
        [value]="url"
        class="mt-3 w-full rounded-md border border-subtle bg-surface-2 px-3 py-2 font-mono text-sm text-default"
        (focus)="$any($event.target).select()"
      />
      <div class="mt-4 flex justify-end">
        <button
          type="button"
          (click)="dismissClipboardFallback()"
          class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:brightness-95"
        >
          Done
        </button>
      </div>
    </div>
  </div>
}
