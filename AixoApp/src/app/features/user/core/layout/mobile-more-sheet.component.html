@if (open()) {
  <!-- Transparent click-outside catcher (sits below the sheet, above
       the bottom-nav so the bar stays interactive). -->
  <div class="fixed inset-0 z-30 md:hidden" (click)="close()" aria-hidden="true"></div>

  <!-- Compact floating panel — anchored under the header, sized to
       content up to a max, sits above the fixed 64px bottom nav. -->
  <div
    class="fixed top-[56px] right-0 left-0 z-40 flex max-h-[calc(100vh-120px)] flex-col overflow-hidden border-b border-subtle bg-surface shadow-elevated md:hidden"
    role="dialog"
    aria-modal="true"
    aria-label="All modules"
  >
    <!-- Header row: search + close -->
    <div class="flex items-center gap-2 border-b border-subtle px-3 py-2.5">
      <div
        class="flex h-[38px] flex-1 items-center gap-2 rounded-xl border border-subtle bg-app px-3"
      >
        <lucide-icon name="search" class="h-4 w-4 shrink-0 text-faint" />
        <input
          #searchInput
          type="search"
          [value]="query()"
          (input)="onQuery($any($event.target).value)"
          placeholder="Jump to a screen or feature…"
          class="min-w-0 flex-1 bg-transparent text-[13.5px] text-default placeholder:text-faint focus:outline-none"
          aria-label="Search modules"
        />
      </div>
      <button
        type="button"
        (click)="close()"
        class="rounded-lg border border-subtle bg-app px-2 py-1 font-mono text-[10.5px] uppercase text-faint transition hover:text-default"
        aria-label="Close"
      >
        Esc
      </button>
    </div>

    <!-- Module list -->
    <div class="flex-1 overflow-y-auto p-2">
      @if (filtered().length === 0) {
        <p class="px-4 py-6 text-center text-sm text-faint">No modules match "{{ query() }}".</p>
      } @else {
        <ul class="flex flex-col">
          @for (m of filtered(); track m.id) {
            <li>
              <button
                type="button"
                (click)="goTo(m)"
                class="flex w-full items-center gap-3 rounded-xl px-2 py-2.5 text-left transition hover:bg-surface-2"
              >
                <span class="flex h-8 w-8 shrink-0 items-center justify-center text-muted">
                  <lucide-icon [name]="m.icon" class="h-[18px] w-[18px]" />
                </span>
                <span class="flex-1 truncate text-[14px] font-semibold text-default">
                  {{ m.name }}
                </span>
                <span class="text-[12px] font-medium text-faint">Go to</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </div>
}
