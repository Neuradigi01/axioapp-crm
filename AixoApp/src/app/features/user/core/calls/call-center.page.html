<div class="px-6 py-6">
  <header class="mb-6 flex items-start justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-zinc-900">Call Center</h1>
      <p class="mt-1 text-sm text-zinc-500">
        Log calls, browse the phone book, review transcripts &amp; analytics
      </p>
    </div>
  </header>

  <!-- Tabs -->
  <div class="mb-4 overflow-x-auto border-b border-zinc-200">
    <nav class="-mb-px flex gap-6" aria-label="Tabs">
      @for (t of tabs; track t.id) {
        <button
          type="button"
          (click)="setTab(t.id)"
          [class]="
            'whitespace-nowrap border-b-2 px-1 py-3 text-sm font-medium transition-colors ' +
            (activeTab() === t.id
              ? 'border-zinc-900 text-zinc-900'
              : 'border-transparent text-zinc-500 hover:border-zinc-300 hover:text-zinc-700')
          "
        >
          {{ t.label }}
        </button>
      }
    </nav>
  </div>

  @switch (activeTab()) {
    @case ('logs') {
      <app-call-logs-tab />
    }
    @case ('phone-book') {
      <app-call-phone-book-tab />
    }
    @case ('transcripts') {
      <app-call-transcripts-tab />
    }
    @case ('book-appointment') {
      <app-call-book-appointment-tab />
    }
    @case ('analytics') {
      <app-call-analytics-tab />
    }
  }
</div>
