<div class="px-4 py-4 md:px-6 md:py-6">
  <header class="mb-6 flex items-start justify-between gap-3">
    <div>
      <h1 class="font-display text-[26px] font-bold leading-tight tracking-[-0.02em] text-default">
        Call Center
      </h1>
      <p class="mt-1 text-[14px] text-muted">
        Log calls, browse the phone book, review transcripts &amp; analytics
      </p>
    </div>
    <button
      type="button"
      (click)="onLogCall()"
      class="shrink-0 rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:brightness-95"
    >
      Log call
    </button>
  </header>

  <!-- Tabs -->
  <div class="mb-4 overflow-x-auto border-b border-subtle">
    <nav class="-mb-px flex gap-6" aria-label="Tabs">
      @for (t of tabs; track t.id) {
        <button
          type="button"
          (click)="setTab(t.id)"
          [class]="
            'whitespace-nowrap border-b-2 px-1 py-3 text-sm font-medium transition-colors ' +
            (activeTab() === t.id
              ? 'border-accent text-default'
              : 'border-transparent text-muted hover:border-subtle hover:text-default')
          "
        >
          {{ t.label }}
        </button>
      }
    </nav>
  </div>

  @switch (activeTab()) {
    @case ('logs') {
      <app-call-logs-tab [openModalTrigger]="logCallTrigger()" />
    }
    @case ('phone-book') {
      <app-call-phone-book-tab />
    }
    @case ('transcripts') {
      <app-call-transcripts-tab />
    }
    @case ('book-appointment') {
      <app-call-book-appointment-tab />
    }
    @case ('analytics') {
      <app-call-analytics-tab />
    }
  }
</div>
