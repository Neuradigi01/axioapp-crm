<div
  class="inline-flex items-center rounded-xl border border-subtle bg-surface p-0.5"
  role="group"
  aria-label="Dashboard date range"
>
  @for (opt of options; track opt.value) {
    <button
      type="button"
      (click)="select(opt.value)"
      [class.bg-accent-soft]="active() === opt.value"
      [class.text-accent]="active() === opt.value"
      [class.text-muted]="active() !== opt.value"
      [attr.aria-pressed]="active() === opt.value"
      class="rounded-md px-3 py-1.5 font-mono text-xs font-semibold transition-colors hover:text-default focus:outline-none"
    >
      {{ opt.label }}
    </button>
  }
</div>
