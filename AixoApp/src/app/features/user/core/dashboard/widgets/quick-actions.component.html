@if (visible().length > 0) {
  <section class="mb-4 flex flex-wrap gap-2">
    @for (a of visible(); track a.key) {
      <a
        [routerLink]="a.routerLink"
        [queryParams]="a.queryParams"
        class="inline-flex items-center gap-2 rounded-xl border border-subtle bg-surface px-3 py-2 text-sm font-medium text-default shadow-sm transition hover:border-subtle hover:bg-surface-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-1"
      >
        <lucide-icon [name]="a.icon" class="h-4 w-4 text-muted"></lucide-icon>
        {{ a.label }}
      </a>
    }
  </section>
}
