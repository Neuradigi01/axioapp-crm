<div class="card">
  <div class="card-header">
    <h3 class="card-title">Trend</h3>
    <div class="flex flex-wrap items-center gap-1">
      @for (m of METRICS; track m.key) {
        <button
          type="button"
          (click)="setMetric(m.key)"
          [class]="metric() === m.key ? 'chip chip-active' : 'chip'"
          [attr.aria-pressed]="metric() === m.key"
        >
          {{ m.label }}
        </button>
      }
    </div>
  </div>

  <div>
    @if (error(); as err) {
      <div class="flex h-64 items-center justify-center text-sm text-red-500" role="alert">
        {{ err }}
      </div>
    } @else if (loading()) {
      <div class="h-64 animate-pulse rounded bg-surface-2" aria-busy="true"></div>
    } @else {
      <apx-chart
        [series]="series()"
        [chart]="chart()"
        [stroke]="stroke()"
        [fill]="fill()"
        [colors]="colors()"
        [xaxis]="xaxis()"
        [yaxis]="yaxis()"
        [dataLabels]="dataLabels()"
        [tooltip]="tooltip()"
        [grid]="grid()"
      />
    }
  </div>
</div>
