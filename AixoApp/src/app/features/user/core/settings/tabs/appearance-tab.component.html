<div>
  <p class="mb-4 text-sm text-muted">
    Choose how the app looks. <b>System</b> follows your operating-system preference and updates
    automatically when you switch.
  </p>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
    @for (opt of options; track opt.id) {
      <button
        type="button"
        (click)="pick(opt.id)"
        class="rounded-lg border p-4 text-left transition"
        [class.border-accent]="choice() === opt.id"
        [class.bg-surface-2]="choice() === opt.id"
        [class.border-subtle]="choice() !== opt.id"
      >
        <div
          class="mb-2 h-16 rounded-md border border-subtle"
          [class.bg-surface]="opt.id === 'light'"
          [class.bg-accent]="opt.id === 'dark'"
          [class.bg-gradient-to-r]="opt.id === 'system'"
          [class.from-white]="opt.id === 'system'"
          [class.to-zinc-900]="opt.id === 'system'"
        ></div>
        <div class="text-sm font-medium text-default">{{ opt.label }}</div>
        <div class="text-xs text-muted">{{ opt.hint }}</div>
      </button>
    }
  </div>
</div>
