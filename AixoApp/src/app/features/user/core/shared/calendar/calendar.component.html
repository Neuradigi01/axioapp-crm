<div class="overflow-hidden rounded-lg bg-surface shadow-sm ring-1 border-subtle">
  <header class="flex items-center justify-between border-b border-subtle px-4 py-3">
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="previousMonth()"
        class="rounded-md p-1.5 text-muted transition hover:bg-surface-2 hover:text-default"
        aria-label="Previous month"
      >
        <lucide-icon name="chevron-left" class="h-4 w-4" />
      </button>
      <h2 class="text-sm font-semibold text-default">{{ monthLabel() }}</h2>
      <button
        type="button"
        (click)="nextMonth()"
        class="rounded-md p-1.5 text-muted transition hover:bg-surface-2 hover:text-default"
        aria-label="Next month"
      >
        <lucide-icon name="chevron-right" class="h-4 w-4" />
      </button>
    </div>
    <button
      type="button"
      (click)="goToToday()"
      class="rounded-md border border-subtle bg-surface px-2.5 py-1 text-xs font-medium text-default hover:bg-surface-2"
    >
      Today
    </button>
  </header>

  <div class="grid grid-cols-7 border-b border-subtle bg-surface-2">
    @for (w of weekdayLabels; track w) {
      <div
        class="px-2 py-2 text-center text-[10px] font-semibold uppercase tracking-wider text-muted"
      >
        {{ w }}
      </div>
    }
  </div>

  <div class="grid grid-cols-7">
    @for (day of days(); track day.getTime()) {
      <button
        type="button"
        (click)="onDayClick(day)"
        class="group flex h-20 flex-col items-stretch border-b border-r border-subtle px-2 py-1.5 text-left transition last:border-r-0 hover:bg-surface-2 focus:bg-surface-2 focus:outline-none"
        [class.bg-surface-2]="!isInViewMonth(day)"
        [class.text-faint]="!isInViewMonth(day)"
        [class.ring-2]="isSelected(day)"
        [class.ring-inset]="isSelected(day)"
        [class.ring-accent]="isSelected(day)"
      >
        <span class="flex items-center justify-between">
          <span
            class="inline-flex h-6 w-6 items-center justify-center rounded-full text-xs"
            [class.bg-accent]="isTodayCell(day)"
            [class.text-white]="isTodayCell(day)"
            [class.font-semibold]="isTodayCell(day)"
            [class.text-default]="!isTodayCell(day) && isInViewMonth(day)"
          >
            {{ dayNumber(day) }}
          </span>
        </span>

        @if (eventCount(day) > 0) {
          <div class="mt-auto flex items-center gap-1">
            @for (i of dotsToRender(eventCount(day)); track i) {
              <span class="h-1.5 w-1.5 rounded-full bg-accent"></span>
            }
            @if (overflowCount(eventCount(day)) > 0) {
              <span class="ml-0.5 text-[10px] font-medium text-muted">
                +{{ overflowCount(eventCount(day)) }}
              </span>
            }
          </div>
        }
      </button>
    }
  </div>
</div>
