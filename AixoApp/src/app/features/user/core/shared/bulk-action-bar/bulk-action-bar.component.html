@if (visible()) {
  <div
    class="fixed bottom-4 left-1/2 z-30 -translate-x-1/2 transform"
    role="region"
    aria-label="Bulk actions"
    style="animation: popIn 0.12s ease"
  >
    <div
      class="flex items-center gap-2 rounded-xl border border-subtle bg-surface-2 px-3 py-2 text-sm text-default shadow-elevated"
    >
      <span class="font-mono text-xs font-medium text-muted">
        {{ _selectedCount() }} selected
      </span>
      <span class="h-4 w-px bg-subtle"></span>
      @for (a of visibleActions(); track a.key) {
        <button
          type="button"
          (click)="action.emit(a.key)"
          [class]="
            a.danger
              ? 'inline-flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-medium text-red-500 transition hover:bg-red-500/10'
              : 'inline-flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-medium text-default transition hover:bg-surface'
          "
        >
          <lucide-icon [name]="a.icon" class="h-3.5 w-3.5" />
          {{ a.label }}
        </button>
      }
      <span class="h-4 w-px bg-subtle"></span>
      <button
        type="button"
        (click)="clear.emit()"
        class="inline-flex items-center rounded-md p-1 text-faint transition hover:bg-surface hover:text-default"
        aria-label="Clear selection"
      >
        <lucide-icon name="x" class="h-3.5 w-3.5" />
      </button>
    </div>
  </div>
}
