<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
  style="animation: fadeIn 0.12s ease"
>
  <div
    class="w-full max-w-md overflow-hidden rounded-2xl border border-subtle bg-surface-2 shadow-elevated"
    style="animation: popIn 0.12s ease"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-title'"
  >
    <header class="border-b border-subtle px-5 py-4">
      <h2 id="confirm-title" class="font-display text-base font-semibold text-default">
        {{ title }}
      </h2>
    </header>
    @if (body) {
      <div class="px-5 py-4 text-[13.5px] text-muted">{{ body }}</div>
    }
    <footer class="flex items-center justify-end gap-2 border-t border-subtle px-5 py-4">
      <button
        type="button"
        class="btn btn-secondary"
        [disabled]="submitting"
        (click)="cancel.emit()"
      >
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        [disabled]="submitting"
        (click)="confirm.emit()"
        [class]="danger ? 'btn btn-primary bg-red-500 border-red-500' : 'btn btn-primary'"
      >
        {{ confirmLabel }}
      </button>
    </footer>
  </div>
</div>
