<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-lg bg-surface shadow-xl ring-1 border-subtle">
    <header class="border-b border-subtle px-5 py-3">
      <h2 class="text-sm font-semibold text-default">{{ heading() }}</h2>
    </header>
    <div class="space-y-4 px-5 py-4">
      <div>
        <label for="reassign_owner" class="block text-xs font-medium text-default">
          New owner
        </label>
        <select
          id="reassign_owner"
          [formControl]="userControl"
          class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm text-default shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
        >
          <option value="">Unassigned</option>
          @for (u of users(); track u.id) {
            <option [value]="u.id">{{ u.full_name }}</option>
          }
        </select>
      </div>
      <div>
        <label for="reassign_note" class="block text-xs font-medium text-default">
          Note <span class="text-faint">(optional)</span>
        </label>
        <textarea
          id="reassign_note"
          [formControl]="noteControl"
          rows="2"
          maxlength="500"
          placeholder="Saved on the timeline entry."
          class="mt-1 block w-full rounded-md border border-subtle bg-surface px-3 py-2 text-sm text-default placeholder-zinc-400 shadow-sm focus:border-muted focus:outline-none focus:ring-1 focus:ring-accent"
        ></textarea>
      </div>
      @if (_error(); as err) {
        <div
          class="rounded-md bg-red-500/10 px-3 py-2 text-xs text-red-400 ring-1 border-red-500/20"
        >
          {{ err }}
        </div>
      }
    </div>
    <footer
      class="flex items-center justify-end gap-2 border-t border-subtle bg-surface-2 px-5 py-3 rounded-b-lg"
    >
      <button
        type="button"
        class="rounded-md border border-subtle bg-surface px-3 py-1.5 text-sm font-medium text-default hover:bg-surface-2"
        [disabled]="_submitting()"
        (click)="cancel.emit()"
      >
        Cancel
      </button>
      <button
        type="button"
        [disabled]="!canConfirm()"
        (click)="onConfirm()"
        class="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-white hover:brightness-95 disabled:cursor-not-allowed disabled:bg-surface-2"
      >
        Reassign
      </button>
    </footer>
  </div>
</div>
