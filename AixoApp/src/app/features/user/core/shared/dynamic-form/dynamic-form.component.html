@if (loading()) {
  <div class="space-y-4" aria-busy="true" aria-live="polite">
    @for (i of skeletonRows; track i) {
      <div class="animate-pulse">
        <div class="h-3 w-24 rounded bg-surface-2"></div>
        <div class="mt-2 h-10 w-full rounded-lg bg-surface-2"></div>
      </div>
    }
    <span class="sr-only">Loading form fields…</span>
  </div>
} @else if (fields().length === 0) {
  <p
    class="rounded-lg border border-dashed border-subtle bg-surface-2 px-4 py-4 md:py-6 text-center text-sm text-faint"
  >
    No fields defined.
  </p>
} @else {
  <form [formGroup]="form()" class="space-y-4" novalidate>
    @for (def of fields(); track def.field_key) {
      <app-field-renderer [def]="def" [control]="control(def.field_key)" />
    }
  </form>
}
