<div class="flex flex-col items-center justify-center gap-3 py-5 md:py-8 text-center">
  @if (icon(); as ic) {
    <lucide-icon [name]="ic" class="h-8 w-8 text-faint" [attr.stroke-width]="1.6" />
  }
  <div class="text-sm font-semibold text-default">{{ title() }}</div>
  @if (subtitle(); as sub) {
    <p class="max-w-sm text-[13px] text-muted">{{ sub }}</p>
  }
  <div class="mt-1">
    <ng-content></ng-content>
  </div>
</div>
