<h2 mat-dialog-title class="confirmation-dialog__title">{{ data.title }}</h2>

<mat-dialog-content class="confirmation-dialog__content">
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions class="confirmation-dialog__actions" align="end">
  <button mat-button (click)="onCancel()">{{ cancelText }}</button>
  <button mat-flat-button [color]="color" (click)="onConfirm()">{{ confirmText }}</button>
</mat-dialog-actions>
